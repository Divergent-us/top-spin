<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1424">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ТОП-СПИН">
<link rel="apple-touch-icon" id="appleIcon" href="">
<link rel="manifest" id="manifestLink" href="">
<title>ТОП-СПИН — центр турниров</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/russo-one@5/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/golos-text@5/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/golos-text@5/500.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/golos-text@5/600.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/golos-text@5/700.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/golos-text@5/800.css">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-messaging-compat.js"></script>
<style>
:root{
--bg:#0a1424;--bg2:#0e1c31;--panel:#132238;--panel2:#182b46;--row:#0d1526;
--line:#24395a;--line2:#31507e;--txt:#eaf2ff;--mut:#8ea6c8;--dim:#5f7699;
--orange:#ff8b1f;--orange2:#ffb35c;--ball:#ffa41b;--blue:#3aa9ff;--cyan:#22d3ee;
--green:#41e08d;--green-dim:rgba(65,224,141,.14);--amber:#fbbf24;--amber-dim:rgba(251,191,36,.14);
--violet:#a78bfa;--lime:#90ee90;--red:#ff5f6b;--red-dim:rgba(255,95,107,.14);
--gold:#ffd166;--gold-d:#c8890f;--silver:#cfd8e3;--bronze:#e0a06c;
--ru-w:#ffffff;--ru-b:#0039A6;--ru-r:#D52B1E;
--wood:#6b4a2f;--wood2:#412d1d;--felt:#1668b0;--felt-d:#0a3f6d;
--rad:14px;--fd:'Russo One',system-ui,sans-serif;--fb:'Golos Text',system-ui,sans-serif}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px;scrollbar-color:var(--orange) var(--bg2);scrollbar-width:thin}
img{max-width:100%}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:var(--bg2);border-radius:9px}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--orange),#c25f0d);border-radius:9px;border:2px solid var(--bg2)}
::-webkit-scrollbar-thumb:hover{background:linear-gradient(180deg,var(--orange2),var(--orange))}
body{font-family:var(--fb);color:var(--txt);background:var(--bg);min-height:100vh;overflow-x:hidden;touch-action:manipulation;-webkit-text-size-adjust:100%;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
body.locked{overflow:hidden}
body.big-font{font-size:18px}
.bg-table{position:fixed;left:50%;top:56%;transform:translate(-50%,-50%);width:min(94vw,560px);color:#fff;opacity:.05;z-index:-1;pointer-events:none;stroke:currentColor;fill:none;stroke-width:2.5;transition:opacity .3s}
body.tab-tournaments .bg-table{opacity:0}
/* ===== ЗАЛ (фон вкладки Турниры) ===== */
.hall-bg{position:fixed;inset:0;z-index:-3;pointer-events:none;opacity:0;transition:opacity .45s ease;
background-size:cover,cover;background-position:center 62%,center 62%;background-repeat:no-repeat,no-repeat;
filter:saturate(.85) brightness(.46) contrast(1.05);transform:scale(1.04)}
body.tab-tournaments .hall-bg{opacity:1}
.hall-scrim{position:fixed;inset:0;z-index:-2;pointer-events:none;opacity:0;transition:opacity .45s ease;
background:linear-gradient(180deg,rgba(10,20,36,.86) 0%,rgba(10,20,36,.62) 26%,rgba(10,20,36,.72) 62%,rgba(10,20,36,.94) 100%),
radial-gradient(ellipse at 50% 34%,rgba(255,139,31,.16),transparent 62%)}
body.tab-tournaments .hall-scrim{opacity:1}
body.tab-tournaments .trow,body.tab-tournaments .card,body.tab-tournaments .thero,body.tab-tournaments .hcard,body.tab-tournaments .tournament-register-item{
background:linear-gradient(180deg,rgba(21,39,65,.80),rgba(14,28,49,.86));backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);border-color:rgba(255,179,92,.28)}
body.tab-tournaments .thero{border-color:rgba(255,139,31,.5);box-shadow:0 18px 46px rgba(0,0,0,.55)}
body.light{--bg:#f4f7fb;--bg2:#e7ecf3;--panel:#fff;--panel2:#f0f4f9;--row:#eef2f7;--line:#d3dbe4;--line2:#b6c3d2;--txt:#16202e;--mut:#4c5c6d;--dim:#8794a4}
body.light .bg-table{color:#0a1424;opacity:.07}
body.light .topbar,body.light .tabbar{background:rgba(244,247,251,.94)}
body.light input,body.light select,body.light textarea{background:#fff;color:var(--txt)}
body.light .card,body.light .sheet,body.light .counter,body.light .stat,body.light .trow,body.light .prow,body.light .setin,body.light .tally,body.light .train-card,body.light .lr-row,body.light .pcard,body.light .thero,body.light .mcard,body.light .podium-card,body.light .nc-item,body.light .gcard{background:#fff}
body.light .pcard-stat,body.light .thero-stat{background:#f2f6fc}
body.light .counter b,body.light .prow .rat,body.light .datebox b,body.light .tally .n{color:#c77700}
body.light.tab-tournaments .hall-bg{filter:saturate(.7) brightness(1.02) contrast(.95)}
body.light.tab-tournaments .hall-scrim{background:linear-gradient(180deg,rgba(244,247,251,.88),rgba(244,247,251,.72) 40%,rgba(244,247,251,.94))}
/* ===== ЛОГИН ===== */
.login-screen{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:20px;overflow-y:auto}
.login-bg{position:absolute;inset:0;z-index:0;overflow:hidden}
.login-bg canvas{position:absolute;inset:0;width:100%;height:100%;display:block;filter:blur(2px) saturate(1.25);transform:scale(1.03)}
.login-bg-overlay{position:absolute;inset:0;z-index:3;background:radial-gradient(ellipse at center,rgba(10,20,36,.30) 0%,rgba(10,20,36,.54) 55%,rgba(10,20,36,.82) 100%)}
.login-card{position:relative;z-index:4;max-width:400px;width:100%;background:rgba(21,39,65,.93);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:20px;padding:26px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.5)}
.login-logo{width:72px;height:72px;margin:0 auto 14px}
.login-title{font-family:var(--fd);font-size:24px;margin-bottom:6px;color:#eaf2ff}
.login-sub{color:#8ea6c8;font-size:13px;margin-bottom:16px}
.login-mode{display:flex;gap:8px;margin-bottom:8px}
.login-mode .btn{flex:1;padding:9px 10px;font-size:13px}
.login-step{display:none}.login-step.active{display:block}
.login-label{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#8ea6c8;margin:14px 0 6px;text-align:left}
.login-input{width:100%;font-family:var(--fb);font-size:16px;color:#eaf2ff;background:#0d1a2d;border:1px solid var(--line);border-radius:10px;padding:13px 12px;outline:none;text-align:center;letter-spacing:1px}
.login-btn{width:100%;margin-top:16px;font-family:var(--fb);font-weight:800;font-size:15px;color:#241203;background:linear-gradient(180deg,#ffa14a,#ff7d12);border:none;border-radius:11px;padding:13px;cursor:pointer}
.login-btn.secondary{background:transparent;color:#8ea6c8;margin-top:10px}
.login-error{color:var(--red);font-size:13px;margin-top:10px;min-height:18px;word-break:break-word}
.login-hint{color:#5f7699;font-size:12px;margin-top:10px;line-height:1.5}
/* ===== КАРКАС ===== */
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:6px;max-width:560px;margin:0 auto;width:100%;padding:calc(8px + env(safe-area-inset-top)) clamp(8px,3vw,14px) 8px;background:rgba(10,20,36,.92);backdrop-filter:blur(12px);border-bottom:1px solid rgba(36,57,90,.5)}
.app{max-width:560px;margin:0 auto;padding:0 clamp(10px,3vw,14px) calc(112px + env(safe-area-inset-bottom))}
.brand{display:flex;align-items:center;gap:9px;min-width:0;cursor:pointer;flex:1}
.logo{width:38px;height:38px;flex:none;filter:drop-shadow(0 4px 12px rgba(255,139,31,.35))}
.brand h1{font-family:var(--fd);font-size:clamp(14px,4vw,19px);letter-spacing:.05em;line-height:1}
.brand h1 em{font-style:normal;color:var(--orange)}
.brand small{display:block;color:var(--mut);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;margin-top:3px}
.topbar-right{display:flex;align-items:center;gap:5px;margin-left:auto;flex:none}
.datechip{font-size:11px;font-weight:600;color:var(--mut);border:1px solid var(--line);border-radius:999px;padding:4px 9px;white-space:nowrap}
.pushoff-chip{font-size:11px;font-weight:800;color:var(--amber);border:1px solid rgba(251,191,36,.55);background:var(--amber-dim);border-radius:999px;padding:4px 7px;cursor:pointer}
.sync-indicator{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:600;color:var(--mut);padding:3px 6px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.sync-indicator.synced{color:var(--green);border-color:rgba(65,224,141,.5)}
.sync-indicator.error{color:var(--red);border-color:rgba(255,95,107,.5)}
.sync-dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.iconbtn{position:relative;width:34px;height:34px;flex:none;display:grid;place-items:center;cursor:pointer;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;color:var(--mut)}
.iconbtn svg{width:18px;height:18px}
.iconbtn.has-new{color:var(--orange);border-color:rgba(255,139,31,.6);background:rgba(255,139,31,.12)}
.nbadge{position:absolute;top:-5px;right:-5px;min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:var(--red);color:#fff;font-size:9.5px;font-weight:800;display:grid;place-items:center;border:2px solid var(--bg);animation:pop .25s}
@keyframes pop{from{transform:scale(.4)}to{transform:none}}
.card{background:linear-gradient(180deg,#152741,#111f36);border:1px solid var(--line);border-radius:var(--rad);padding:clamp(12px,3.5vw,16px);position:relative}
.row-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.row-actions .btn{flex:1;justify-content:center}
.btn{display:inline-flex;align-items:center;gap:7px;justify-content:center;font-family:var(--fb);font-weight:800;font-size:14px;color:var(--txt);border:none;cursor:pointer;border-radius:11px;padding:11px 16px;user-select:none}
.btn[disabled]{opacity:.5;cursor:not-allowed;filter:grayscale(.5)}
.btn.primary{background:linear-gradient(180deg,#ffa14a,#ff7d12);color:#241203}
.btn.ghost{background:rgba(255,255,255,.04);border:1px solid var(--line2);font-weight:600}
.btn.danger{background:var(--red-dim);border:1px solid rgba(255,95,107,.45);color:var(--red)}
.btn.ok{background:var(--green-dim);border:1px solid rgba(65,224,141,.45);color:var(--green)}
.btn.info{background:rgba(58,169,255,.14);border:1px solid rgba(58,169,255,.45);color:var(--blue)}
.btn.gold{background:linear-gradient(180deg,#ffe08a,#e0a02c);color:#2b1a02;box-shadow:0 6px 18px rgba(255,209,102,.28)}
.btn.live{background:linear-gradient(180deg,#ff6b6b,#e02f3d);color:#fff;box-shadow:0 4px 16px rgba(224,47,61,.35)}
.btn.sm{padding:7px 12px;font-size:12.5px}
.btn.xs{padding:5px 9px;font-size:11.5px;border-radius:8px}
.btn.w100{width:100%}
.btn:active,.iconbtn:active,.tabbtn:active,.chip:active{transform:scale(.95);transition:transform .08s}
.trow:active,.prow:active,.train-card:active,.picker-item:active,.menu-row:active{transform:scale(.985);transition:transform .1s}
.msg-alert{animation:blink 1.1s ease-in-out infinite;border-color:var(--red);color:var(--red);background:var(--red-dim)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.45}}
.mut{color:var(--mut)}.dim{color:var(--dim)}.small{font-size:12px}
.sec-title{font-family:var(--fd);font-size:14px;letter-spacing:.12em;text-transform:uppercase;display:flex;align-items:center;gap:9px;margin:22px 2px 11px}
.sec-title .cnt{margin-left:auto;font-family:var(--fb);font-size:11px;font-weight:700;color:var(--dim)}
.status-dot{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:middle}
.status-dot.live{background:var(--green);box-shadow:0 0 8px var(--green);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.status-dot.upcoming{background:var(--blue)}
.status-dot.finished{background:var(--orange)}
.delta{font-weight:800;font-size:12px;padding:2px 8px;border-radius:7px;white-space:nowrap}
.delta.up{color:var(--green)}
.delta.down{color:var(--red)}
.delta.draw{color:var(--amber);background:var(--amber-dim);border:1px solid rgba(251,191,36,.4)}
.avatar{width:42px;height:42px;flex:none;border-radius:12px;display:grid;place-items:center;font-family:var(--fd);font-size:15px;color:#0a1424;overflow:hidden;background:#0d1a2d;position:relative}
.avatar.lg{width:64px;height:64px;font-size:23px;border-radius:16px}
.avatar.sm{width:30px;height:30px;font-size:11px;border-radius:9px}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.pring{transition:box-shadow .25s}
.pring.on{box-shadow:0 0 0 3px var(--green),0 0 12px rgba(65,224,141,.45)}
.pring.off{box-shadow:0 0 0 3px rgba(255,95,107,.5)}
#lightbox{position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.94);display:none;align-items:center;justify-content:center;cursor:zoom-out;padding:16px}
#lightbox img{max-width:94vw;max-height:94vh;object-fit:contain;border-radius:10px}
.menu-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;cursor:pointer;background:rgba(255,255,255,.03)}
.menu-row svg{width:20px;height:20px;flex:none;color:var(--orange2)}
.menu-row .mi{width:20px;flex:none;text-align:center;font-size:18px}
.menu-row span{flex:1;font-weight:700;font-size:14px}
.menu-row .mnum{flex:none;background:var(--red);color:#fff;border-radius:999px;font-size:10px;padding:1px 7px;font-weight:800}
input,select,textarea{width:100%;font-family:var(--fb);font-size:15px;color:var(--txt);background:#0d1a2d;border:1px solid var(--line);border-radius:10px;padding:11px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--orange)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
input[type=file]{display:none}
input[type=range]{-webkit-appearance:none;appearance:none;height:26px;background:transparent;border:none;padding:0}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:9px;background:linear-gradient(90deg,var(--orange),var(--line2))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;margin-top:-7px;border-radius:50%;background:var(--orange);border:2px solid #0d1a2d;cursor:pointer}
input[type=range]::-moz-range-track{height:6px;border-radius:9px;background:var(--line2)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--orange);border:2px solid #0d1a2d;cursor:pointer}
input[type=checkbox]{width:19px;height:19px;accent-color:var(--orange);flex:none}
label{display:block;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:13px 0 6px}
.frm2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.count-lbl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:700}
.counters{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.counter{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 3px;text-align:center}
.counter b{display:block;font-family:var(--fd);font-size:clamp(14px,4vw,16px);color:var(--orange2)}
.counter span{font-size:9px;text-transform:uppercase;color:var(--dim);font-weight:700}
.mover{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid rgba(36,57,90,.55);font-size:13.5px}
.mover:last-child{border-bottom:none}
.mover small{display:block;color:var(--dim);font-size:10.5px;margin-top:2px}
.mover.mini{padding:5px 2px;font-size:11.5px;gap:6px}
.list,.train-list{display:flex;flex-direction:column;gap:9px}
.train-card{display:flex;align-items:flex-start;gap:8px;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:10px;padding:9px 10px}
.tc-left{flex:1;min-width:0}
.tc-time{font-family:var(--fd);font-size:13px;color:var(--lime)}
.tc-sub{font-size:11px;color:var(--mut);margin-top:2px}
.tc-names{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tc-name{font-size:11px;background:rgba(58,169,255,.15);border:1px solid rgba(58,169,255,.4);border-radius:999px;padding:2px 8px;color:var(--blue)}
.tc-btn{flex:none}.tc-btn .btn{padding:6px 10px;font-size:11px}
.trow,.prow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:linear-gradient(180deg,#152741,#111f36);border:1px solid var(--line);border-radius:var(--rad);padding:13px;cursor:pointer;color:var(--txt);font-family:var(--fb)}
.datebox{flex:none;width:52px;text-align:center;background:rgba(13,26,45,.8);border:1px solid var(--line);border-radius:11px;padding:7px 4px}
.datebox b{display:block;font-family:var(--fd);font-size:20px;color:var(--orange2)}
.datebox span{font-size:10px;text-transform:uppercase;color:var(--dim)}
.trow .info,.prow .info{flex:1;min-width:0}
.trow .nm,.prow .nm{font-weight:800;font-size:15px}
.trow .sub,.prow .sub{color:var(--mut);font-size:12px;margin-top:3px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.prow .rat{font-family:var(--fd);font-size:19px;color:var(--ball)}
.cd-inline{color:var(--lime);font-family:var(--fd);font-size:13px;font-weight:700}
.rise{animation:rise .38s both}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.empty{text-align:center;padding:30px 18px;border:1.5px dashed var(--line2);border-radius:var(--rad);color:var(--mut)}
.empty .big{font-size:38px;margin-bottom:8px}
.empty b{display:block;color:var(--txt);font-size:16px;margin-bottom:5px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:10px;text-transform:uppercase;color:var(--dim);padding:6px 7px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 7px;border-bottom:1px solid rgba(36,57,90,.5)}
.tbl .rk{font-family:var(--fd);width:28px}
.tbl .nm{font-weight:700;cursor:pointer}
.tbl tr.inactive td{opacity:.55}
.tbl .pts{font-family:var(--fd);color:var(--ball)}
.seg{display:inline-flex;background:#0d1a2d;border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px;margin-bottom:12px}
.seg button{border:none;background:transparent;color:var(--mut);font-weight:700;font-size:12.5px;padding:7px 12px;border-radius:8px;cursor:pointer}
.seg button.on{background:var(--orange);color:#241203}
.backlink{display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:var(--mut);font-weight:700;font-size:13px;cursor:pointer;padding:8px 0;margin:4px 0 8px}
.ptags{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px;justify-content:center}
.ptag{display:inline-flex;align-items:center;gap:7px;background:rgba(13,26,45,.75);border:1px solid var(--line2);border-radius:999px;padding:4px 8px 4px 4px;font-size:13px;cursor:pointer}
.ptag.paused{border-color:var(--amber);color:var(--amber)}
.ptag.out{border-color:var(--red);color:var(--red);opacity:.75}
.ptag .pmini{width:26px;height:26px;border-radius:50%;overflow:hidden;display:grid;place-items:center;flex:none;font-family:var(--fd);font-size:10px;color:#0a1424}
.ptag .pmini img{width:100%;height:100%;object-fit:cover}
/* ===== ЧЕМПИОНСКОЕ ОФОРМЛЕНИЕ ===== */
.champ{position:relative;width:var(--sz,132px);height:calc(var(--sz,132px)*1.182);flex:none;margin:0 auto}
.champ-rays{position:absolute;left:50%;top:38%;width:170%;height:150%;transform:translate(-50%,-50%);pointer-events:none;
background:conic-gradient(from 0deg,rgba(255,209,102,.20) 0 6deg,transparent 6deg 22deg,rgba(255,209,102,.14) 22deg 28deg,transparent 28deg 44deg);
border-radius:50%;filter:blur(2px);opacity:.75;animation:spinSlow 26s linear infinite}
.champ.s .champ-rays{background:conic-gradient(from 0deg,rgba(207,216,227,.20) 0 6deg,transparent 6deg 22deg,rgba(207,216,227,.13) 22deg 28deg,transparent 28deg 44deg)}
.champ.b .champ-rays{background:conic-gradient(from 0deg,rgba(224,160,108,.20) 0 6deg,transparent 6deg 22deg,rgba(224,160,108,.13) 22deg 28deg,transparent 28deg 44deg)}
@keyframes spinSlow{to{transform:translate(-50%,-50%) rotate(360deg)}}
.champ-halo{position:absolute;left:50%;top:40%;width:78%;height:66%;transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;
background:radial-gradient(circle,var(--glow,rgba(255,209,102,.55)),transparent 68%);filter:blur(9px);animation:haloPulse 3.4s ease-in-out infinite}
@keyframes haloPulse{0%,100%{opacity:.75}50%{opacity:1}}
.champ-art{position:absolute;inset:0;width:100%;height:100%;overflow:visible;z-index:2;pointer-events:none}
.champ-ph{position:absolute;left:50%;top:40.4%;transform:translate(-50%,-50%);width:53.6%;aspect-ratio:1;border-radius:50%;overflow:hidden;z-index:1;
background:#0d1a2d;box-shadow:0 8px 22px rgba(0,0,0,.6),inset 0 0 0 2px rgba(255,255,255,.14)}
.champ-ph img{width:100%;height:100%;object-fit:cover;display:block}
.champ-ph .ini{width:100%;height:100%;display:grid;place-items:center;font-family:var(--fd);font-size:calc(var(--sz,132px)*.22);color:#0a1424}
.champ-crown{position:absolute;left:50%;top:-3%;transform:translate(-50%,-50%);font-size:calc(var(--sz,132px)*.20);z-index:3;filter:drop-shadow(0 3px 6px rgba(0,0,0,.6));animation:float 2.8s ease-in-out infinite}
@keyframes float{0%,100%{transform:translate(-50%,-50%)}50%{transform:translate(-50%,-64%)}}
.champ-shine{position:absolute;left:50%;top:80%;width:34%;height:26%;transform:translate(-50%,-50%);border-radius:50%;overflow:hidden;z-index:3;pointer-events:none}
.champ-shine:after{content:'';position:absolute;top:-40%;left:-70%;width:45%;height:190%;transform:rotate(18deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.85),transparent);animation:shine 3.6s ease-in-out infinite}
@keyframes shine{0%{left:-70%}58%,100%{left:130%}}
.champ-wrap{display:flex;flex-direction:column;align-items:center;text-align:center;cursor:pointer;min-width:0}
.champ-wrap .cw-name{font-family:var(--fd);font-size:13px;line-height:1.2;margin-top:6px;word-break:break-word;max-width:100%}
.champ-wrap.g .cw-name{color:var(--gold)}
.champ-wrap.s .cw-name{color:var(--silver)}
.champ-wrap.b .cw-name{color:var(--bronze)}
.champ-wrap .cw-sub{font-size:10.5px;color:var(--mut);margin-top:3px}
.champ-wrap .cw-lvl{font-size:9.5px;font-weight:800;color:var(--blue);margin-top:2px}
.champ-wrap .cw-aw{font-size:12px;margin-top:4px;letter-spacing:2px;min-height:15px}
.champ-wrap:hover .champ-ph{box-shadow:0 10px 28px rgba(0,0,0,.7),inset 0 0 0 2px rgba(255,255,255,.3)}
/* ===== ВВОД СЧЁТА ===== */
.sets-bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:12px 0 8px}
.sets-bar .cnt{font-family:var(--fd);font-size:12.5px;color:var(--orange2);margin-right:auto}
.sets-wrap{max-height:34vh;overflow-y:auto;padding:2px 4px 2px 2px;border:1px solid var(--line);border-radius:12px;background:rgba(0,0,0,.18)}
.vshead,.setrow{display:grid;grid-template-columns:42px 1fr 24px 1fr 32px;gap:6px;align-items:center}
.vshead{margin-bottom:10px}
.setrow{padding:5px 3px;border-bottom:1px solid rgba(36,57,90,.45)}
.setrow:last-child{border-bottom:none}
.vshead .side{font-weight:800;font-size:13px;text-align:center}
.vshead .vs,.colon{font-family:var(--fd);color:var(--orange);text-align:center;font-size:18px}
.setlabel{font-size:9px;font-weight:800;text-transform:uppercase;color:var(--dim);text-align:center}
.setin{width:100%;height:44px;text-align:center;font-family:var(--fd);font-size:20px;border-radius:10px;border-width:2px;padding:2px}
.setin.win{border-color:var(--green);color:var(--green)}
.setin.eq{border-color:var(--amber);color:var(--amber)}
.setrow .rm{width:32px;height:32px;border-radius:9px}
.tally{display:flex;align-items:center;justify-content:center;gap:13px;background:#0d1a2d;border:2px solid var(--line2);border-radius:16px;padding:13px;margin:12px 0 6px}
.tally.draw{border-color:var(--amber);box-shadow:0 0 18px rgba(251,191,36,.18)}
.tally .n{font-family:var(--fd);font-size:32px;color:var(--ball)}
.tally .sep{color:var(--dim);font-family:var(--fd);font-size:21px}
.tally .who{font-size:11px;color:var(--mut);max-width:100px;text-align:center;font-weight:700}
.sets-meta{text-align:center;font-size:11.5px;color:var(--mut);margin-bottom:6px;line-height:1.5}
.rprev{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.fin-toggle{display:flex;align-items:center;gap:10px;padding:11px;border:1px solid var(--line2);border-radius:11px;margin:10px 0;cursor:pointer;background:rgba(255,255,255,.03)}
.fin-toggle.on{border-color:var(--green);background:var(--green-dim)}
.fin-toggle .ft{flex:1}
.fin-toggle b{display:block;font-size:13.5px}
.fin-toggle small{display:block;font-size:11px;color:var(--mut);margin-top:2px;line-height:1.4}
/* ===== СТОЛ СВЕРХУ ===== */
.tt{position:relative;border-radius:14px;padding:18px 14px;overflow:hidden;border:1px solid #33241a;
background:radial-gradient(ellipse at 50% 40%,rgba(255,255,255,.07),transparent 62%),
repeating-linear-gradient(92deg,#7a5636 0 30px,#6b4a2f 30px 31px,#5f4229 31px 60px,#553a24 60px 61px),
linear-gradient(180deg,var(--wood),var(--wood2))}
.tt:after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 38%,rgba(0,0,0,.5));pointer-events:none}
.tt-stage{position:relative;width:100%;aspect-ratio:1.79;z-index:1;filter:drop-shadow(0 14px 16px rgba(0,0,0,.55))}
.tt-edge{position:absolute;inset:0;border-radius:7px;background:linear-gradient(180deg,#0d3a63,#072742);box-shadow:0 7px 0 #051d33,0 10px 18px rgba(0,0,0,.5)}
.tt-surface{position:absolute;inset:3px;border-radius:5px;background:linear-gradient(170deg,#2b86cf 0%,var(--felt) 32%,#0f5893 68%,var(--felt-d) 100%);box-shadow:inset 0 2px 10px rgba(255,255,255,.16),inset 0 -14px 26px rgba(0,0,0,.28)}
.tt-surface:before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(101deg,rgba(255,255,255,.045) 0 2px,transparent 2px 9px);border-radius:5px}
.tt-lines{position:absolute;inset:8px;border:2.5px solid rgba(255,255,255,.94);border-radius:2px;box-shadow:0 0 6px rgba(255,255,255,.2)}
.tt-lines:after{content:'';position:absolute;left:0;right:0;top:50%;height:2px;background:rgba(255,255,255,.8);transform:translateY(-1px)}
.tt-net{position:absolute;top:-7px;bottom:-7px;left:50%;width:15px;transform:translateX(-50%);z-index:3;
background:repeating-linear-gradient(0deg,rgba(255,255,255,.55) 0 1px,transparent 1px 4px),
repeating-linear-gradient(90deg,rgba(255,255,255,.4) 0 1px,transparent 1px 4px),
linear-gradient(180deg,rgba(14,24,40,.9),rgba(6,14,26,.94));
border-left:2px solid #eef4fb;border-right:2px solid #eef4fb;box-shadow:0 0 12px rgba(0,0,0,.6)}
.tt-net:before{content:'';position:absolute;left:-2px;right:-2px;top:0;height:3px;background:linear-gradient(180deg,#fff,#c9d6e6)}
.tt-post{position:absolute;left:50%;width:13px;height:13px;border-radius:50%;background:radial-gradient(circle at 34% 30%,#fff,#c3cedc 55%,#7d8b9d);transform:translateX(-50%);z-index:4;box-shadow:0 2px 5px rgba(0,0,0,.65)}
.tt-post.t{top:-13px}.tt-post.b{bottom:-13px}
.tt-half{position:absolute;top:0;bottom:0;width:50%;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;z-index:2}
.tt-half.l{left:0}.tt-half.r{right:0}
.tt-tag{display:flex;align-items:center;gap:5px;max-width:94%;background:rgba(4,14,26,.74);border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:3px 9px 3px 3px;backdrop-filter:blur(3px)}
.tt-tag .av{width:20px;height:20px;border-radius:50%;overflow:hidden;flex:none;display:grid;place-items:center;font-family:var(--fd);font-size:9px;color:#0a1424}
.tt-tag .av img{width:100%;height:100%;object-fit:cover}
.tt-tag .nm{font-size:10.5px;font-weight:800;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px rgba(0,0,0,.7)}
     /* ===== КРУПНЫЕ ИМЕНА И ФОТО НА СТОЛЕ (активное ведение) ===== */
#livePanel .tt-stage{aspect-ratio:1.62}
#livePanel .tt-half{padding-bottom:10px}
#livePanel .tt-tag{gap:9px;max-width:98%;padding:6px 15px 6px 6px;border-radius:999px;background:rgba(4,14,26,.84);border-width:1.5px}
#livePanel .tt-tag .av{width:42px;height:42px;font-size:15px}
#livePanel .tt-tag .nm{font-size:16.5px;font-weight:800;letter-spacing:.01em}
#livePanel .tt-nums b{font-size:20px}
#livePanel .tt-badge{font-size:10px}
@media (max-width:420px){
#livePanel .tt-stage{aspect-ratio:1.5}
#livePanel .tt-tag{gap:7px;padding:5px 12px 5px 5px}
#livePanel .tt-tag .av{width:36px;height:36px;font-size:13px}
#livePanel .tt-tag .nm{font-size:14.5px}
}
@media (max-width:340px){
#livePanel .tt-tag .nm{display:block;font-size:12.5px}
#livePanel .tt-tag .av{width:30px;height:30px;font-size:11px}
}
.tt-tag.srv{border-color:var(--ball);box-shadow:0 0 10px rgba(255,164,27,.4)}
.tt-pad{position:absolute;width:30px;height:42px;z-index:2;opacity:.95;filter:drop-shadow(0 4px 5px rgba(0,0,0,.5))}
.tt-pad.l{left:6%;top:14%;transform:rotate(-24deg)}
.tt-pad.r{right:6%;bottom:14%;transform:rotate(156deg)}
.tt-ball{position:absolute;width:13px;height:13px;border-radius:50%;z-index:5;background:radial-gradient(circle at 32% 28%,#fff6dd,#ffa41b 52%,#cf7a06);box-shadow:0 4px 7px rgba(0,0,0,.6),0 0 12px rgba(255,164,27,.5)}
.tt-ball.a{left:32%;top:34%}
.tt-ball.live{animation:ballRally 3.2s cubic-bezier(.45,0,.55,1) infinite}
@keyframes ballRally{0%{left:26%;top:32%}25%{left:70%;top:60%}50%{left:30%;top:66%}75%{left:68%;top:30%}100%{left:26%;top:32%}}
.tt-nums{position:absolute;top:6px;left:50%;transform:translateX(-50%);z-index:6;display:flex;align-items:center;gap:8px;background:rgba(4,12,22,.82);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:3px 12px;backdrop-filter:blur(4px)}
.tt-nums b{font-family:var(--fd);font-size:17px;color:var(--ball);line-height:1}
.tt-nums i{font-style:normal;color:var(--dim);font-size:13px}
.tt-nums.draw b{color:var(--amber)}
.tt-badge{position:absolute;top:6px;left:8px;z-index:6;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;padding:3px 8px;border-radius:999px;background:rgba(4,12,22,.8);border:1px solid rgba(255,255,255,.25);color:#dce8f7}
.tt-badge.live{color:#ffd7da;border-color:rgba(255,95,107,.7);background:rgba(120,20,30,.78);animation:pulse 1.6s infinite}
.tt-badge.done{color:#d6ffe9;border-color:rgba(65,224,141,.6);background:rgba(12,60,40,.78)}
.tt-badge.draw{color:#ffe9b8;border-color:rgba(251,191,36,.7);background:rgba(90,66,12,.8)}
.mcard{background:linear-gradient(180deg,#152741,#101d33);border:1px solid var(--line);border-radius:16px;padding:11px;margin-bottom:11px}
.mcard.next{border-color:var(--orange);box-shadow:0 6px 22px rgba(255,139,31,.16)}
.mcard.inplay{border-color:rgba(255,95,107,.6);box-shadow:0 6px 22px rgba(224,47,61,.16)}
.mcard.done{opacity:.94}
.mc-head{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--mut);margin-bottom:9px;flex-wrap:wrap}
.mc-head .tb{background:rgba(58,169,255,.15);border:1px solid rgba(58,169,255,.45);color:var(--blue);border-radius:6px;padding:2px 7px;font-weight:800}
.mc-head .st{margin-left:auto;font-size:9.5px;font-weight:800;text-transform:uppercase;padding:3px 8px;border-radius:999px;border:1px solid}
.mc-head .st.q{color:var(--mut);border-color:var(--line2)}
.mc-head .st.l{color:var(--red);border-color:rgba(255,95,107,.6);background:var(--red-dim)}
.mc-head .st.f{color:var(--green);border-color:rgba(65,224,141,.5);background:var(--green-dim)}
.mc-head .st.d{color:var(--amber);border-color:rgba(251,191,36,.55);background:var(--amber-dim)}
.mc-players{display:flex;align-items:center;gap:8px;margin-top:10px}
.mc-pl{flex:1;min-width:0;display:flex;align-items:center;gap:7px}
.mc-pl.r{justify-content:flex-end;text-align:right}
.mc-pl .nm{font-weight:800;font-size:12.5px;line-height:1.2;overflow:hidden}
.mc-pl .nm.win{color:var(--green)}
.mc-pl .nm small{display:block;font-weight:600;font-size:10px;color:var(--dim)}
.mc-sc{flex:none;text-align:center;min-width:64px}
.mc-sc b{font-family:var(--fd);font-size:24px;color:var(--ball);line-height:1}
.mc-sc.draw b{color:var(--amber)}
.mc-sc span{display:block;font-size:8.5px;text-transform:uppercase;color:var(--dim);font-weight:800;letter-spacing:.1em;margin-top:2px}
.qsets{display:flex;flex-wrap:wrap;gap:4px;margin-top:9px}
.qset{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--mut)}
.qset.a{border-color:rgba(65,224,141,.45);color:var(--green)}
.qset.b{border-color:rgba(58,169,255,.45);color:var(--blue)}
.qset.d{border-color:rgba(251,191,36,.45);color:var(--amber)}
.qacts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.qacts .btn{flex:1;min-width:80px}
/* ===== НИЖНЕЕ МЕНЮ ===== */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(560px,100%);z-index:50;display:flex;gap:4px;padding:8px 10px calc(9px + env(safe-area-inset-bottom));background:rgba(11,20,36,.95);backdrop-filter:blur(12px);border-top:1px solid var(--line)}
.tabbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;color:var(--dim);font-family:var(--fb);font-size:10px;font-weight:700;cursor:pointer;padding:7px 2px;border-radius:11px;position:relative}
.tabbtn svg{width:22px;height:22px}
.tabbtn.on{color:var(--orange)}
.badge{position:absolute;top:2px;right:6px;background:var(--red);color:#fff;font-size:9px;font-weight:800;border-radius:999px;padding:1px 5px;min-width:14px;text-align:center}
/* ===== МОДАЛКИ ===== */
#modal-root{position:fixed;inset:0;z-index:180;display:none;align-items:flex-end;justify-content:center;pointer-events:none}
.backdrop{position:absolute;inset:0;background:rgba(4,9,18,.74);backdrop-filter:blur(2px)}
.sheet{position:relative;width:min(560px,100%);max-height:92vh;overflow-y:auto;background:linear-gradient(180deg,#17293f,#101d31);border:1px solid var(--line2);border-radius:20px 20px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));animation:sheetIn .16s ease-out}
@keyframes sheetIn{from{transform:translateY(18px);opacity:.6}to{transform:none;opacity:1}}
.sheet h3{font-family:var(--fd);font-size:18px;margin-bottom:4px;padding-right:40px}
.sheet h4{font-family:var(--fd);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--orange2);margin:18px 0 8px}
.sheet .grab{width:44px;height:4px;border-radius:2px;background:var(--line2);margin:0 auto 15px}
.modal-x{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.06);border:1px solid var(--line2);color:var(--mut);font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:3}
.emorow{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px}
.emopt{width:42px;height:42px;font-size:20px;display:grid;place-items:center;cursor:pointer;background:#0d1a2d;border:1.5px solid var(--line);border-radius:11px}
.emopt.on{border-color:var(--gold);background:rgba(255,209,102,.14)}
/* ===== ТОСТЫ ===== */
#toast-root{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(94px + env(safe-area-inset-bottom));z-index:320;display:flex;flex-direction:column;gap:6px;align-items:center;width:min(430px,92%);pointer-events:none}
.toast{background:#1c2c45;border:1px solid var(--line2);color:var(--txt);font-size:13.5px;font-weight:700;padding:10px 16px;border-radius:12px;opacity:0;transform:translateY(8px) scale(.97);transition:opacity .1s linear,transform .1s linear;text-align:center;pointer-events:auto;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.45);max-width:100%}
.toast.in{opacity:1;transform:none}
.toast.out{opacity:0;transform:translateY(-4px) scale(.98)}
.toast.err{border-color:rgba(255,95,107,.65);color:#ffd7da}
.toast.ok{border-color:rgba(65,224,141,.65);color:#d6ffe9}
.toast.undo{display:flex;align-items:center;gap:10px;border-color:var(--amber);background:linear-gradient(180deg,#2a2416,#1c2c45);cursor:default}
.toast.undo span{flex:1;text-align:left;font-size:12.5px}
.toast.undo button{background:var(--amber);color:#241203;border:none;border-radius:8px;padding:6px 12px;font-weight:800;font-size:12px;cursor:pointer;flex:none}
.toast.undo .ux{background:transparent;color:var(--mut);padding:4px 6px;font-size:14px}
.toast.rich{display:flex;align-items:flex-start;gap:10px;text-align:left;border-color:rgba(58,169,255,.6);width:100%}
.rich-ico{flex:none;width:34px;height:34px;border-radius:50%;background:rgba(58,169,255,.18);border:1px solid rgba(58,169,255,.5);display:flex;align-items:center;justify-content:center;font-size:16px}
.rich-body{flex:1;min-width:0}
.rich-text{font-size:12.5px;color:var(--mut);word-break:break-word;font-weight:500}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:#0f1e33;border:1px solid var(--line);border-radius:11px;padding:11px 6px;text-align:center}
.stat b{display:block;font-family:var(--fd);font-size:18px}
.stat span{font-size:10px;text-transform:uppercase;color:var(--dim);font-weight:700}
.picker-list{display:flex;flex-direction:column;gap:6px;max-height:50vh;overflow-y:auto;margin-top:8px}
.picker-item{display:flex;align-items:center;gap:10px;background:#0d1a2d;border:1px solid var(--line);border-radius:11px;padding:9px 11px;cursor:pointer}
.picker-item .nm{flex:1;font-weight:700;font-size:14px}
.picker-item.picker-picked{border-color:var(--green);background:rgba(65,224,141,.08)}
.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.settings-grid.three{grid-template-columns:repeat(3,1fr)}
.toggle-row{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:10px;margin:8px 0;cursor:pointer}
.toggle-row span{flex:1;font-weight:600;font-size:13.5px}
.tournament-register-item{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:var(--rad);padding:14px;margin-bottom:9px}
.tournament-register-info{flex:1}
.tournament-register-name{font-weight:700;font-size:15px}
.tournament-register-meta{color:var(--mut);font-size:12px;margin-top:4px;display:flex;gap:6px;flex-wrap:wrap}
.settings-info{background:rgba(255,139,31,.08);border:1px solid rgba(255,139,31,.2);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:12px;color:var(--mut);line-height:1.55}
.settings-info.good{background:var(--green-dim);border-color:rgba(65,224,141,.35)}
.settings-info.warn{background:var(--amber-dim);border-color:rgba(251,191,36,.4)}
.settings-info.bad{background:var(--red-dim);border-color:rgba(255,95,107,.4)}
.code-item{display:flex;align-items:center;gap:10px;background:#0d1a2d;border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin-bottom:8px;flex-wrap:wrap}
.code-item .phone{flex:1;font-weight:700;font-size:13px}
.code-item .code{font-family:var(--fd);color:var(--ball);font-size:12px}
/* ===== ЦЕНТР УВЕДОМЛЕНИЙ ===== */
.nc-item{display:flex;gap:11px;padding:11px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:#0d1a2d;cursor:pointer;position:relative}
.nc-item.unread{border-color:rgba(255,139,31,.5);background:linear-gradient(180deg,rgba(255,139,31,.09),#0d1a2d)}
.nc-item.unread:before{content:'';position:absolute;left:-1px;top:12px;bottom:12px;width:3px;border-radius:3px;background:var(--orange)}
.nc-ico{flex:none;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:17px;background:rgba(58,169,255,.15);border:1px solid rgba(58,169,255,.4)}
.nc-ico.tour{background:rgba(255,209,102,.15);border-color:rgba(255,209,102,.45)}
.nc-ico.train{background:var(--green-dim);border-color:rgba(65,224,141,.4)}
.nc-ico.warn{background:var(--amber-dim);border-color:rgba(251,191,36,.45)}
.nc-ico.match{background:var(--red-dim);border-color:rgba(255,95,107,.45)}
.nc-b{flex:1;min-width:0}
.nc-b b{display:block;font-size:13.5px;line-height:1.3}
.nc-b p{font-size:12px;color:var(--mut);margin-top:3px;line-height:1.45;word-break:break-word}
.nc-b time{display:block;font-size:10.5px;color:var(--dim);margin-top:5px}
/* ===== ЧЕЛЛЕНДЖИ / ИИ ===== */
.challenges{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:16px}
.ch-title{font-size:17px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;font-family:var(--fd)}
.ch-sub{margin-top:4px;font-size:13px;color:var(--mut);line-height:1.4}
.ch-total{display:flex;align-items:center;gap:10px;margin-top:16px}
.ch-total-bar{flex:1;height:6px;border-radius:99px;background:#1c2740;overflow:hidden}
.ch-total-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#16a34a,#4ade80);transition:width .4s}
.ch-total span{font-size:12px;color:var(--mut);white-space:nowrap;font-weight:600}
.ch-list{list-style:none;margin:16px 0 0;display:flex;flex-direction:column;gap:10px}
.ch-item{display:flex;align-items:center;gap:11px;padding:12px 13px;background:var(--row);border:1px solid var(--line);border-radius:12px}
.ch-item.done{border-color:rgba(74,222,128,.35);background:rgba(74,222,128,.05)}
.ch-check{flex:none;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:var(--green-dim);color:#4ade80;border:1.5px solid #4ade80}
.ch-item.wip .ch-check{background:var(--amber-dim);color:var(--amber);border-color:var(--amber);font-size:10px}
.ch-emoji{font-size:20px;flex:none}
.ch-name{flex:1;font-size:13.5px;font-weight:600;line-height:1.3}
.ch-badge{font-size:10.5px;font-weight:700;padding:4px 9px;border-radius:99px;background:var(--green-dim);color:#4ade80;white-space:nowrap}
.ch-item.wip .ch-badge{background:var(--amber-dim);color:var(--amber)}
.ai-trainer-card{background:linear-gradient(135deg,#1e293b,#0f172a);border:1px solid var(--blue);border-radius:var(--rad);padding:16px;margin-top:16px}
.ai-trainer-header{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-family:var(--fd);color:var(--blue);font-size:14px}
.ai-icon{width:24px;height:24px;fill:currentColor}
.ai-btn-analyze{width:100%;background:rgba(58,169,255,.15);border:1px solid rgba(58,169,255,.4);color:var(--blue);font-weight:700;padding:12px;border-radius:10px;cursor:pointer;display:flex;justify-content:center;align-items:center;gap:8px}
.ai-response-area{margin-top:12px;background:rgba(0,0,0,.25);border-radius:8px;padding:12px;font-size:13px;line-height:1.6;display:none;white-space:pre-wrap}
.ai-loading{display:inline-block;width:14px;height:14px;border:2px solid transparent;border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* ===== ЧАТ ===== */
.chat-screen{position:fixed;inset:0;z-index:150;background:var(--bg);display:none;flex-direction:column;height:100dvh;overflow:hidden}
.chat-screen.active{display:flex}
.chat-header{flex:none;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:rgba(10,20,36,.96);border-bottom:1px solid var(--line)}
.chat-back,.chat-action-btn{width:38px;height:38px;flex:none;display:grid;place-items:center;background:rgba(255,255,255,.06);border:1px solid var(--line2);border-radius:11px;color:var(--txt);cursor:pointer}
.chat-action-btn{border-radius:50%}
.chat-action-btn.call-a{border-color:rgba(65,224,141,.55);color:var(--green)}
.chat-action-btn.call-v{border-color:rgba(58,169,255,.55);color:var(--blue)}
.chat-back svg,.chat-action-btn svg{width:20px;height:20px}
.chat-header-av{width:38px;height:38px;flex:none;border-radius:50%;overflow:hidden;background:var(--panel);display:grid;place-items:center;font-family:var(--fd);font-size:14px;color:#0a1424}
.chat-header-av img{width:100%;height:100%;object-fit:cover}
.chat-header-info{flex:1;min-width:0}
.chat-header-name{font-weight:800;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-header-status{font-size:11.5px;color:var(--mut);margin-top:2px}
.chat-header-status.online{color:var(--green)}
.chat-header-status.typing{color:var(--blue);animation:blink 1.4s infinite}
.chat-header-actions{display:flex;gap:8px;margin-left:auto}
.chat-body{flex:1;overflow-y:auto;padding:14px 14px 8px;display:flex;flex-direction:column;gap:2px;overscroll-behavior:contain}
.chat-date-divider{text-align:center;margin:14px 0 10px;font-size:11px;font-weight:700;color:var(--dim);text-transform:uppercase}
.chat-date-divider span{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:999px;padding:3px 12px}
.chat-msg{display:flex;margin-bottom:4px;max-width:85%;animation:msgIn .16s ease-out}
@keyframes msgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.chat-msg.mine{align-self:flex-end}
.chat-msg .msg-bubble{padding:8px 12px;border-radius:16px;background:var(--panel2);border:1px solid var(--line);font-size:14px;line-height:1.4;overflow-wrap:break-word;min-width:74px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;white-space:pre-wrap}
.chat-msg.mine .msg-bubble{background:linear-gradient(180deg,rgba(255,139,31,.28),rgba(255,139,31,.16));border-color:rgba(255,139,31,.5);cursor:pointer}
.chat-msg .msg-from{font-size:11px;font-weight:800;color:var(--orange2);margin-bottom:3px}
.chat-msg .msg-meta{display:flex;align-items:center;gap:4px;justify-content:flex-end;margin-top:2px;font-size:10px;color:var(--dim)}
.chat-msg .msg-meta .check.read{color:var(--blue)}
.chat-input-area{flex:none;display:flex;align-items:flex-end;gap:8px;padding:10px 12px calc(12px + env(safe-area-inset-bottom));background:rgba(10,20,36,.96);border-top:1px solid var(--line)}
.chat-textarea{flex:1;min-height:42px;max-height:120px;resize:none;font-size:15px;background:var(--panel2);border:1px solid var(--line2);border-radius:20px;padding:11px 16px;line-height:1.3}
.chat-send{width:44px;height:44px;flex:none;border-radius:50%;border:none;background:linear-gradient(180deg,#ffa14a,#ff7d12);color:#241203;cursor:pointer;display:grid;place-items:center}
.chat-send svg{width:20px;height:20px}
.chat-empty{text-align:center;padding:40px 20px;color:var(--mut);font-size:13px}
.chat-empty .big{font-size:36px;margin-bottom:8px}
.chat-dialogs{display:flex;flex-direction:column;gap:2px;max-height:60vh;overflow-y:auto;margin:10px -8px;padding:0 8px}
.chat-dialog{display:flex;align-items:center;gap:12px;padding:10px 8px;border-radius:12px;cursor:pointer}
.chat-dialog-av{width:48px;height:48px;flex:none;border-radius:50%;display:grid;place-items:center;font-family:var(--fd);font-size:16px;overflow:hidden;background:var(--panel2);position:relative;color:#0a1424}
.chat-dialog-av img{width:100%;height:100%;object-fit:cover}
.chat-dialog-av.online::after{content:'';position:absolute;bottom:1px;right:1px;width:10px;height:10px;border-radius:50%;background:var(--green);border:2px solid var(--bg)}
.chat-dialog-body{flex:1;min-width:0}
.chat-dialog-top,.chat-dialog-bottom{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chat-dialog-bottom{margin-top:2px}
.chat-dialog-name{font-weight:800;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-dialog-time{font-size:11px;color:var(--dim);flex:none}
.chat-dialog-last{font-size:12.5px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.chat-dialog-last.unread{color:var(--txt);font-weight:600}
.chat-unread{background:var(--orange);color:#241203;font-size:10.5px;font-weight:800;border-radius:999px;padding:1px 7px;min-width:20px;text-align:center;flex:none}
.dropdown-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1}
.dropdown-menu{position:absolute;top:calc(55px + env(safe-area-inset-top));right:12px;width:244px;background:linear-gradient(180deg,#17293f,#101d31);border:1px solid var(--line2);border-radius:14px;padding:8px;box-shadow:0 10px 30px rgba(0,0,0,.6);animation:popIn .14s ease-out;z-index:2}
@keyframes popIn{from{opacity:0;transform:scale(.94) translateY(-8px)}to{opacity:1;transform:none}}
.dropdown-menu .menu-row{margin-bottom:5px;padding:11px 12px}
.dropdown-menu .menu-row:last-child{margin-bottom:0}
/* ===== РЕЙТИНГ ===== */
.rating-hero{position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% -20%,rgba(255,209,102,.26),transparent 62%),linear-gradient(135deg,#1d1a10,#0f172a);border:1px solid rgba(255,209,102,.55);border-radius:20px;padding:18px 16px;margin-bottom:15px;text-align:center}
.rating-hero h2{font-family:var(--fd);color:var(--gold);font-size:20px;margin-bottom:4px;letter-spacing:.08em}
.rating-hero p{color:var(--mut);font-size:12px;line-height:1.4}
.rating-list{display:flex;flex-direction:column;gap:8px}
.rating-row{display:flex;align-items:center;gap:11px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer}
.rating-row.top1{background:linear-gradient(90deg,rgba(255,209,102,.18),var(--panel));border-color:rgba(255,209,102,.55)}
.rating-row.top2{background:linear-gradient(90deg,rgba(207,216,227,.16),var(--panel));border-color:rgba(207,216,227,.45)}
.rating-row.top3{background:linear-gradient(90deg,rgba(224,160,108,.16),var(--panel));border-color:rgba(224,160,108,.45)}
.rating-pos{font-family:var(--fd);font-size:17px;color:var(--dim);width:24px;text-align:center;flex:none}
.rating-row.top1 .rating-pos{color:var(--gold);font-size:21px}
.rating-row.top2 .rating-pos{color:var(--silver)}
.rating-row.top3 .rating-pos{color:var(--bronze)}
.rating-info{flex:1;min-width:0}
.rating-name{font-weight:800;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rating-sub{font-size:11px;color:var(--mut);margin-top:2px}
.rating-val{font-family:var(--fd);font-size:21px;color:var(--ball);flex:none}
.push-enable-card{background:linear-gradient(135deg,rgba(65,224,141,.12),rgba(58,169,255,.08));border:1px solid rgba(65,224,141,.4);border-radius:var(--rad);padding:14px;margin-top:14px;display:flex;align-items:center;gap:12px}
.push-enable-card.off{background:linear-gradient(135deg,rgba(251,191,36,.12),rgba(255,139,31,.06));border-color:rgba(251,191,36,.45)}
.push-enable-card .pe-ico{flex:none;width:42px;height:42px;border-radius:50%;background:rgba(65,224,141,.18);border:1px solid rgba(65,224,141,.5);display:flex;align-items:center;justify-content:center;font-size:20px}
.push-enable-card.off .pe-ico{background:var(--amber-dim);border-color:rgba(251,191,36,.5)}
.push-enable-card .pe-body{flex:1;min-width:0}
.push-enable-card .pe-title{font-weight:800;font-size:14px}
.push-enable-card .pe-sub{font-size:11.5px;color:var(--mut);line-height:1.4}
/* ===== ЗАЛ СЛАВЫ ===== */
.glory{position:relative;overflow:hidden;border-radius:24px;padding:24px 16px 20px;margin-bottom:16px;border:1px solid rgba(255,209,102,.5);
background:radial-gradient(ellipse at 50% -14%,rgba(255,209,102,.34),transparent 58%),radial-gradient(ellipse at 12% 108%,rgba(213,43,30,.20),transparent 55%),radial-gradient(ellipse at 88% 106%,rgba(0,57,166,.24),transparent 55%),linear-gradient(180deg,#1c1509,#0b1120 72%);
box-shadow:0 22px 60px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.08)}
.glory-beams{position:absolute;left:50%;top:-42%;width:150%;height:120%;transform:translateX(-50%);pointer-events:none;opacity:.5;
background:conic-gradient(from 180deg at 50% 0%,transparent 0 8deg,rgba(255,225,160,.20) 8deg 12deg,transparent 12deg 26deg,rgba(255,225,160,.14) 26deg 30deg,transparent 30deg 46deg,rgba(255,225,160,.18) 46deg 50deg,transparent 50deg 360deg);
filter:blur(3px);animation:beamSway 12s ease-in-out infinite}
@keyframes beamSway{0%,100%{transform:translateX(-50%) rotate(-3deg)}50%{transform:translateX(-50%) rotate(3deg)}}
.glory-dust{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.glory-dust i{position:absolute;bottom:-12px;width:4px;height:4px;border-radius:50%;background:rgba(255,214,130,.9);box-shadow:0 0 8px rgba(255,209,102,.9);animation:dustUp linear infinite}
@keyframes dustUp{0%{transform:translateY(0) scale(.6);opacity:0}12%{opacity:.9}100%{transform:translateY(-320px) scale(1.1);opacity:0}}
.glory-inner{position:relative;z-index:2;text-align:center}
.glory-kick{font-size:10px;letter-spacing:.34em;text-transform:uppercase;color:#e8c98a;font-weight:800}
.glory-title{font-family:var(--fd);font-size:clamp(26px,8vw,38px);letter-spacing:.12em;margin:6px 0 4px;
background:linear-gradient(100deg,#fff3c4,#ffd166 32%,#fff8dc 50%,#e0a02c 68%,#ffd166);-webkit-background-clip:text;background-clip:text;color:transparent;
filter:drop-shadow(0 3px 14px rgba(255,209,102,.45));background-size:220% 100%;animation:goldFlow 7s linear infinite}
@keyframes goldFlow{to{background-position:220% 0}}
.glory-sub{font-size:12px;color:#cbb894;line-height:1.5;max-width:340px;margin:0 auto}
.glory-cup{width:120px;height:120px;margin:12px auto 4px;display:flex;align-items:center;justify-content:center}
.glory-cup img,.glory-cup svg{max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 10px 22px rgba(255,209,102,.55))}
.glory-tally{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.gt{border-radius:14px;padding:10px 6px;text-align:center;border:1px solid;position:relative;overflow:hidden}
.gt b{display:block;font-family:var(--fd);font-size:22px;line-height:1}
.gt span{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.1em;font-weight:800;margin-top:4px;opacity:.85}
.gt i{font-style:normal;font-size:18px;display:block;margin-bottom:2px}
.gt.g{background:linear-gradient(180deg,rgba(255,209,102,.24),rgba(255,209,102,.06));border-color:rgba(255,209,102,.6);color:#ffe9b0}
.gt.s{background:linear-gradient(180deg,rgba(207,216,227,.2),rgba(207,216,227,.05));border-color:rgba(207,216,227,.5);color:#e9eff6}
.gt.b{background:linear-gradient(180deg,rgba(224,160,108,.22),rgba(224,160,108,.05));border-color:rgba(224,160,108,.5);color:#f4d3b6}
.glory-podium{display:flex;align-items:flex-end;justify-content:center;gap:6px;margin-top:20px}
.gp{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center}
.gp-base{width:100%;margin-top:8px;border-radius:12px 12px 0 0;display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-size:24px;color:#2b1a02;border:1px solid;border-bottom:none}
.gp.g .gp-base{height:74px;background:linear-gradient(180deg,#ffe6a3,#ffd166 45%,#d99b1f);border-color:#ffe9b5}
.gp.s .gp-base{height:54px;background:linear-gradient(180deg,#f2f6fb,#cfd8e3 45%,#9aa8ba);border-color:#e6edf5}
.gp.b .gp-base{height:40px;background:linear-gradient(180deg,#f0c39c,#e0a06c 45%,#a86c3c);border-color:#f3caa8}
.alley{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px;margin:0 -2px}
.alley-card{flex:none;width:132px;border-radius:16px;padding:12px 8px 10px;text-align:center;cursor:pointer;position:relative;
background:linear-gradient(180deg,rgba(255,209,102,.14),rgba(13,20,34,.9));border:1px solid rgba(255,209,102,.4)}
.alley-card .an{font-size:11.5px;font-weight:800;margin-top:6px;line-height:1.2;color:#ffe9b0}
.alley-card .ac{font-size:10px;color:var(--mut);margin-top:3px}
.gcard{position:relative;display:flex;gap:12px;align-items:center;padding:14px 14px 14px 16px;border-radius:16px;margin-bottom:10px;overflow:hidden;
background:linear-gradient(120deg,rgba(255,209,102,.13),rgba(19,34,56,.94) 46%);border:1px solid rgba(255,209,102,.34)}
.gcard:before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--ru-w) 0 33%,var(--ru-b) 33% 66%,var(--ru-r) 66% 100%);opacity:.85}
.gcard:after{content:'';position:absolute;top:-60%;left:-30%;width:26%;height:220%;transform:rotate(18deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.14),transparent);animation:shine 6s ease-in-out infinite;pointer-events:none}
.gcard.g{border-color:rgba(255,209,102,.65);background:linear-gradient(120deg,rgba(255,209,102,.24),rgba(26,20,8,.94) 48%)}
.gcard.s{border-color:rgba(207,216,227,.55);background:linear-gradient(120deg,rgba(207,216,227,.2),rgba(18,26,40,.94) 48%)}
.gcard.b{border-color:rgba(224,160,108,.55);background:linear-gradient(120deg,rgba(224,160,108,.2),rgba(26,18,12,.94) 48%)}
.gmed{flex:none;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:28px;position:relative;
background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.5),rgba(255,209,102,.28) 46%,rgba(0,0,0,.35));border:2px solid rgba(255,209,102,.6);box-shadow:0 6px 16px rgba(0,0,0,.5)}
.gcard.s .gmed{border-color:rgba(207,216,227,.6);background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.55),rgba(207,216,227,.26) 46%,rgba(0,0,0,.35))}
.gcard.b .gmed{border-color:rgba(224,160,108,.6);background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.5),rgba(224,160,108,.26) 46%,rgba(0,0,0,.35))}
.gbody{flex:1;min-width:0;position:relative;z-index:1}
.gtitle{font-family:var(--fd);font-size:14.5px;color:var(--gold);line-height:1.2}
.gcard.s .gtitle{color:var(--silver)}.gcard.b .gtitle{color:var(--bronze)}
.gname{font-weight:800;font-size:13.5px;margin-top:3px}
.gsub{font-size:11px;color:var(--mut);margin-top:3px;line-height:1.4}
.gdate{font-size:10px;color:var(--dim);margin-top:4px}
.gcard .del{position:relative;z-index:1}
.auto-badge{font-size:9px;font-weight:800;background:rgba(58,169,255,.2);color:var(--blue);border-radius:5px;padding:1px 5px;margin-left:6px;vertical-align:middle}
.glory-seg{display:flex;gap:6px;background:rgba(0,0,0,.32);border:1px solid rgba(255,209,102,.32);border-radius:12px;padding:4px;margin:14px 0 12px}
.glory-seg button{flex:1;border:none;background:transparent;color:#cbb894;font-family:var(--fb);font-weight:800;font-size:12px;padding:8px 6px;border-radius:9px;cursor:pointer}
.glory-seg button.on{background:linear-gradient(180deg,#ffe08a,#e0a02c);color:#2b1a02}
/* ===== ЗВОНКИ ===== */
.call-screen{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(560px,100%);z-index:215;background:rgba(13,26,45,.98);backdrop-filter:blur(12px);border-radius:20px 20px 0 0;border:1px solid var(--line2);border-bottom:none;display:none;flex-direction:column;align-items:center;padding:18px 20px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -10px 30px rgba(0,0,0,.55)}
.call-screen.active{display:flex}
.call-avatar{width:76px;height:76px;border-radius:50%;background:var(--panel2);display:grid;place-items:center;font-size:26px;font-family:var(--fd);margin-bottom:12px;overflow:hidden;border:3px solid var(--line2);color:#0a1424}
.call-avatar.ringing{animation:callPulse 1.4s infinite}
@keyframes callPulse{0%,100%{box-shadow:0 0 0 0 rgba(65,224,141,.45)}50%{box-shadow:0 0 0 14px rgba(65,224,141,0)}}
.call-avatar img{width:100%;height:100%;object-fit:cover}
.call-name{font-family:var(--fd);font-size:19px;margin-bottom:4px;text-align:center}
.call-status{font-size:13.5px;color:var(--mut);margin-bottom:4px;min-height:18px;text-align:center}
.call-timer{font-family:var(--fd);font-size:15px;color:var(--green);margin-bottom:14px;min-height:18px}
.call-actions{display:flex;gap:18px;align-items:center}
.call-btn{width:56px;height:56px;border-radius:50%;border:none;display:grid;place-items:center;cursor:pointer;color:#fff;font-size:22px}
.call-btn.hangup{background:var(--red)}
.call-btn.mute{background:var(--blue)}
.call-btn.mute.muted{background:var(--dim)}
.call-btn.cam{background:var(--violet)}
.call-btn.cam.off{background:var(--dim)}
.call-btn svg{width:25px;height:25px}
.call-lbl{font-size:9.5px;color:var(--dim);text-align:center;margin-top:5px;font-weight:700;text-transform:uppercase}
.call-col{display:flex;flex-direction:column;align-items:center}
/* ===== КАРТОЧКА ИГРОКА (крупное фото) ===== */
.pcard{position:relative;border-radius:22px;overflow:hidden;border:1px solid var(--line2);background:linear-gradient(180deg,#132238,#0e1c31);box-shadow:0 14px 40px rgba(0,0,0,.45);margin-bottom:16px}
.pcard-cover{position:relative;height:126px;background:linear-gradient(135deg,var(--c1,#ff8b1f),var(--c2,#e0452c))}
.pcard-cover .rings{position:absolute;inset:0;opacity:.28;background-image:repeating-radial-gradient(circle at 50% 130%,rgba(255,255,255,.4) 0 1px,transparent 1px 20px)}
.pcard-cover .glow{position:absolute;inset:0;background:radial-gradient(circle at 22% 18%,rgba(255,255,255,.28),transparent 46%),radial-gradient(circle at 82% 76%,rgba(0,0,0,.28),transparent 52%)}
.pcard-lvl{position:absolute;top:10px;left:12px;z-index:2;background:rgba(10,20,36,.55);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:999px;padding:4px 11px;font-size:11px;font-weight:800}
.pcard-edit{position:absolute;top:9px;right:9px;z-index:2;width:34px;height:34px;border-radius:11px;border:1px solid rgba(255,255,255,.4);background:rgba(10,20,36,.45);color:#fff;cursor:pointer;font-size:15px}
.pcard-body{padding:0 16px 16px;text-align:center;position:relative}
.pcard-av{width:158px;height:158px;margin:-84px auto 12px;border-radius:50%;overflow:hidden;border:5px solid var(--panel);box-shadow:0 14px 34px rgba(0,0,0,.6);background:#0d1a2d;position:relative;cursor:pointer;display:grid;place-items:center}
.pcard-av img{width:100%;height:100%;object-fit:cover;display:block}
.pcard-av .ini{width:100%;height:100%;display:grid;place-items:center;font-family:var(--fd);font-size:54px;color:#0a1424}
.pcard-av .cam{position:absolute;bottom:0;left:0;right:0;background:rgba(10,20,36,.82);color:var(--orange2);font-size:10px;font-weight:800;padding:5px 0}
.pcard-name{font-family:var(--fd);font-size:23px;line-height:1.15;margin-bottom:4px}
.pcard-sub{font-size:12px;color:var(--mut);margin-bottom:10px}
.pcard-chips{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
.pchip{font-size:10.5px;padding:4px 10px;border-radius:99px;font-weight:800;border:1px solid;white-space:nowrap}
.pchip.st{background:rgba(255,139,31,.12);border-color:rgba(255,139,31,.45);color:var(--orange2)}
.pchip.lv{background:rgba(58,169,255,.12);border-color:rgba(58,169,255,.45);color:var(--blue)}
.pchip.on{background:var(--green-dim);border-color:rgba(65,224,141,.45);color:var(--green)}
.pchip.off{background:rgba(255,255,255,.05);border-color:var(--line2);color:var(--dim)}
.pchip.hot{background:var(--red-dim);border-color:rgba(255,95,107,.5);color:var(--red)}
.pcard-rate{display:flex;flex-direction:column;align-items:center;gap:2px;margin-bottom:12px}
.pcard-rate b{font-family:var(--fd);font-size:46px;line-height:1;color:var(--orange)}
.pcard-rate span{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);font-weight:800}
.pcard-prog{margin:0 auto 14px;max-width:330px}
.pcard-prog .bar{height:7px;border-radius:99px;background:#1c2740;overflow:hidden}
.pcard-prog .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--orange),var(--gold))}
.pcard-prog small{display:block;margin-top:6px;font-size:10.5px;color:var(--mut)}
.pcard-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.pcard-stat{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:9px 4px;text-align:center}
.pcard-stat b{display:block;font-family:var(--fd);font-size:17px}
.pcard-stat span{font-size:8.5px;text-transform:uppercase;color:var(--dim);font-weight:800}
.pcard-awards{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.pcard-awards .aw{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:18px;background:rgba(255,209,102,.12);border:1px solid rgba(255,209,102,.35)}
/* ===== КАРТОЧКА ТУРНИРА ===== */
.thero{position:relative;border-radius:22px;overflow:hidden;border:1px solid rgba(255,139,31,.35);background:linear-gradient(180deg,#152741,#0e1c31);padding:18px 16px;text-align:center;margin-bottom:14px}
.thero .halo{position:absolute;top:-80px;left:50%;transform:translateX(-50%);width:300px;height:220px;background:radial-gradient(circle,rgba(255,139,31,.22),transparent 70%);pointer-events:none}
.thero>*{position:relative}
.thero-kick{display:flex;justify-content:center;align-items:center;gap:8px;font-size:11.5px;color:var(--mut);margin-bottom:8px;flex-wrap:wrap}
.thero-name{font-family:var(--fd);font-size:clamp(20px,5.4vw,26px);line-height:1.15;margin-bottom:6px}
.thero-time{font-family:var(--fd);font-size:16px;color:var(--lime);margin-bottom:10px}
.thero-cd{font-family:var(--fd);font-size:clamp(26px,7.5vw,34px);color:var(--ball);margin:2px 0 4px}
.thero-cdl{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);font-weight:800}
.thero-cup{width:132px;height:132px;margin:12px auto 2px;display:flex;align-items:center;justify-content:center}
.thero-cup img,.thero-cup svg{max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 10px 22px rgba(255,209,102,.5))}
.thero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:14px}
.thero-stat{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center}
.thero-stat b{display:block;font-family:var(--fd);font-size:16px;color:var(--orange2)}
.thero-stat span{font-size:8.5px;text-transform:uppercase;color:var(--dim);font-weight:800}
.tw{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:5px;margin:14px auto 4px;padding:16px 14px;border-radius:18px;background:linear-gradient(180deg,rgba(255,209,102,.18),rgba(255,209,102,.04));border:1px solid rgba(255,209,102,.45);max-width:340px;width:100%;cursor:pointer;color:var(--txt);font-family:var(--fb)}
.tw-label{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:800;width:100%}
.tw-meta{font-size:11.5px;color:var(--mut);width:100%}
.tw.sm{padding:12px;max-width:300px}
.tw.xs{padding:10px;margin:10px auto 0}
.hcard{background:linear-gradient(180deg,#152741,#111f36);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;cursor:pointer;text-align:center}
.hcard .hn{font-family:var(--fd);font-size:16px;line-height:1.2}
.hcard .hd{font-size:11.5px;color:var(--mut);margin-top:4px}
.hcard .hs{display:flex;justify-content:center;gap:10px;font-size:11.5px;color:var(--mut);margin-top:6px;flex-wrap:wrap}
/* ===== ПОДИУМ АРЕНЫ ===== */
.podium-card{position:relative;overflow:hidden;border-radius:22px;border:1px solid rgba(255,209,102,.42);background:radial-gradient(ellipse at 50% -20%,rgba(255,209,102,.2),transparent 60%),linear-gradient(180deg,#1a2b45,#0d1a2e);padding:16px 12px 0}
.podium-head{position:relative;display:flex;align-items:center;gap:8px}
.podium-head b{font-family:var(--fd);font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.podium-head .sub{font-size:10.5px;color:var(--mut);margin-top:3px}
.podium-head .more{margin-left:auto;flex:none}
.podium{position:relative;display:flex;align-items:flex-end;justify-content:center;gap:6px;margin-top:22px}
.pod-col{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;cursor:pointer;animation:podUp .5s both}
@keyframes podUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.pod-base{position:relative;width:100%;margin-top:9px;border-radius:12px 12px 0 0;border:1px solid;border-bottom:none;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.pod-base b{font-family:var(--fd);font-size:26px;line-height:1;color:#0a1424;opacity:.85}
.pod-base span{font-size:8px;font-weight:800;text-transform:uppercase;color:rgba(10,20,36,.7);margin-top:2px}
.pod-col.g .pod-base{height:88px;background:linear-gradient(180deg,#ffe6a3,#ffd166 45%,#d99b1f);border-color:#ffe9b5}
.pod-col.s .pod-base{height:64px;background:linear-gradient(180deg,#f2f6fb,#cfd8e3 45%,#9aa8ba);border-color:#e6edf5}
.pod-col.b .pod-base{height:48px;background:linear-gradient(180deg,#f0c39c,#e0a06c 45%,#a86c3c);border-color:#f3caa8}
.pod-col.g .pod-base:after{content:'';position:absolute;top:0;left:-60%;width:45%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);animation:shine 3.4s ease-in-out infinite}
.podium-foot{position:relative;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;padding:10px 4px;font-size:10.5px;color:var(--mut);border-top:1px solid rgba(255,255,255,.07);background:rgba(0,0,0,.18);margin:0 -12px}
.podium-foot b{color:var(--orange2)}
/* ===== ДОКУМЕНТЫ ===== */
.doc-viewer{position:fixed;inset:0;z-index:300;background:var(--bg2);display:none;flex-direction:column;height:100dvh}
.doc-viewer.active{display:flex}
.doc-top{flex:none;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;background:linear-gradient(180deg,#17293f,#101d31);border-bottom:1px solid var(--line2)}
.doc-top .t{flex:1;min-width:0}
.doc-top .t b{display:block;font-family:var(--fd);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc-top .t small{color:var(--mut);font-size:11px}
.doc-actions{flex:none;display:flex;gap:7px;overflow-x:auto;padding:10px 12px;background:rgba(10,20,36,.6);border-bottom:1px solid var(--line)}
.doc-actions .btn{flex:none;white-space:nowrap}
.doc-scroll{flex:1;overflow-y:auto;padding:14px 10px calc(24px + env(safe-area-inset-bottom));background:var(--bg2)}
.doc-page{background:#fff;color:#12203a;max-width:820px;margin:0 auto 16px;border-radius:8px;padding:26px 24px}
.doc-page .dh{display:flex;align-items:center;gap:12px;border-bottom:3px solid #ff8b1f;padding-bottom:12px;margin-bottom:14px}
.doc-page .dh .mark{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#ff8b1f,#e0452c);display:grid;place-items:center;font-size:22px;flex:none}
.doc-page .dh h1{font-family:var(--fd);font-size:19px;color:#0a1424;line-height:1.15}
.doc-page .dh p{font-size:11.5px;color:#5b6b85;margin-top:3px}
.doc-page .dh .brandname{margin-left:auto;text-align:right;font-family:var(--fd);font-size:13px;color:#ff8b1f;flex:none}
.doc-champ{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;background:#fff7e8;border:1px solid #ffd79a;border-radius:12px;padding:14px;margin-bottom:14px}
.doc-champ .lbl{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:#a16207;font-weight:800}
.doc-champ .nm{font-family:var(--fd);font-size:20px;color:#0a1424}
.doc-champ .mt{font-size:11.5px;color:#7a5312}
.doc-kpis{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.doc-kpi{flex:1;min-width:96px;background:#f2f6fc;border:1px solid #dbe4f0;border-left:4px solid #ff8b1f;border-radius:8px;padding:8px 10px}
.doc-kpi b{display:block;font-family:var(--fd);font-size:17px;color:#0a1424}
.doc-kpi span{font-size:9.5px;text-transform:uppercase;color:#5b6b85;font-weight:700}
.doc-table{width:100%;border-collapse:collapse;font-size:12.5px}
.doc-table th{background:#0a1424;color:#fff;text-align:left;padding:8px 7px;font-size:10px;text-transform:uppercase}
.doc-table td{padding:7px;border-bottom:1px solid #e4eaf3;color:#12203a}
.doc-table tr:nth-child(even) td{background:#f7fafd}
.doc-table td.r,.doc-table th.r{text-align:right}
.doc-table td.c,.doc-table th.c{text-align:center}
.doc-table td.b{font-weight:800}
.doc-note{margin-top:14px;background:#fff7e8;border:1px solid #ffd79a;border-radius:8px;padding:10px 12px;font-size:11.5px;color:#7a5312;line-height:1.5}
.doc-foot{margin-top:14px;display:flex;justify-content:space-between;font-size:10px;color:#8b97ab;border-top:1px solid #e4eaf3;padding-top:8px}
/* ===== АКТИВНЫЙ ТУРНИР ===== */
.live-panel{position:fixed;inset:0;z-index:170;background:var(--bg);display:none;flex-direction:column;height:100dvh}
.live-panel.active{display:flex}
.live-top{flex:none;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;background:linear-gradient(135deg,#2a1420,#101d31);border-bottom:1px solid var(--line2)}
.live-top .r1{display:flex;align-items:center;gap:10px}
.live-top .r1 .t{flex:1;min-width:0}
.live-top .r1 .t b{display:block;font-family:var(--fd);font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.live-top .r1 .t small{color:var(--mut);font-size:11px}
.live-dot{width:9px;height:9px;border-radius:50%;background:var(--red);animation:pulse 1.4s infinite;flex:none}
.live-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.live-kpi{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:9px;padding:6px 4px;text-align:center}
.live-kpi b{display:block;font-family:var(--fd);font-size:15px;color:var(--orange2)}
.live-kpi span{font-size:8.5px;text-transform:uppercase;color:var(--dim);font-weight:700}
.live-tabs{flex:none;display:flex;gap:4px;padding:8px 10px 0;background:rgba(10,20,36,.6)}
.live-tabs button{flex:1;border:none;background:transparent;color:var(--mut);font-family:var(--fb);font-weight:800;font-size:12px;padding:9px 4px;border-radius:10px 10px 0 0;cursor:pointer;border-bottom:2px solid transparent}
.live-tabs button.on{color:var(--orange);border-bottom-color:var(--orange);background:rgba(255,139,31,.08)}
.live-tabs button i{font-style:normal;opacity:.7;font-size:10.5px;margin-left:3px}
.live-body{flex:1;overflow-y:auto;padding:12px 12px calc(20px + env(safe-area-inset-bottom))}
.live-toolbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.live-toolbar input[type=text]{flex:1;min-width:130px;padding:9px 11px;font-size:13.5px}
.live-toolbar select{width:auto;min-width:120px;padding:9px 30px 9px 10px;font-size:12.5px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px}
.chip{flex:none;border:1px solid var(--line2);background:rgba(255,255,255,.04);color:var(--mut);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--orange);color:#241203;border-color:var(--orange)}
.chip .n{opacity:.7;margin-left:4px}
.lr-row{display:flex;align-items:center;gap:9px;background:linear-gradient(180deg,#152741,#111f36);border:1px solid var(--line);border-radius:12px;padding:9px 10px;margin-bottom:8px}
.lr-row.paused{border-color:rgba(251,191,36,.5)}
.lr-row.out{border-color:rgba(255,95,107,.45);opacity:.78}
.lr-row.sel{border-color:var(--blue)}
.lr-grip{flex:none;display:flex;flex-direction:column;gap:2px}
.lr-grip button{width:22px;height:17px;border-radius:5px;border:1px solid var(--line2);background:rgba(255,255,255,.05);color:var(--mut);font-size:9px;cursor:pointer;padding:0}
.lr-info{flex:1;min-width:0}
.lr-name{font-weight:800;font-size:13.5px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.lr-sub{font-size:10.5px;color:var(--mut);margin-top:3px;display:flex;gap:7px;flex-wrap:wrap}
.lr-sub b{color:var(--txt)}
.st-chip{font-size:9px;font-weight:800;padding:2px 6px;border-radius:99px;text-transform:uppercase}
.st-chip.active{background:var(--green-dim);color:var(--green);border:1px solid rgba(65,224,141,.4)}
.st-chip.paused{background:var(--amber-dim);color:var(--amber);border:1px solid rgba(251,191,36,.45)}
.st-chip.out{background:var(--red-dim);color:var(--red);border:1px solid rgba(255,95,107,.45)}
.lr-acts{flex:none;display:flex;gap:4px}
.lr-acts button{width:32px;height:32px;border-radius:9px;border:1px solid var(--line2);background:rgba(255,255,255,.05);color:var(--mut);cursor:pointer;font-size:14px;display:grid;place-items:center;padding:0}
.lr-acts button.p{border-color:rgba(251,191,36,.5);color:var(--amber)}
.lr-acts button.a{border-color:rgba(65,224,141,.5);color:var(--green)}
.lr-acts button.o{border-color:rgba(255,95,107,.45);color:var(--red)}
.bulk-bar{position:sticky;bottom:0;display:flex;gap:6px;align-items:center;background:linear-gradient(180deg,#1c2c45,#132238);border:1px solid var(--blue);border-radius:12px;padding:9px 10px;margin-top:10px;flex-wrap:wrap}
.bulk-bar .cnt{font-weight:800;font-size:12.5px;color:var(--blue);flex:1;min-width:80px}
/* ===== АВАТАР ===== */
.av-drop{border:2px dashed var(--line2);border-radius:14px;padding:14px;text-align:center;background:rgba(255,255,255,.02);margin-bottom:10px}
.av-drop.hot{border-color:var(--orange);background:rgba(255,139,31,.08)}
.av-stage{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;justify-content:center}
.av-canvas-wrap{position:relative;width:220px;height:220px;flex:none;border-radius:16px;overflow:hidden;background:#0d1a2d;border:2px solid var(--line2);touch-action:none;cursor:grab}
.av-canvas-wrap canvas{width:100%;height:100%;display:block}
.av-mask{position:absolute;inset:0;pointer-events:none;box-shadow:0 0 0 200px rgba(10,20,36,.55) inset}
.av-mask.round::after{content:'';position:absolute;left:10px;top:10px;right:10px;bottom:10px;border:2px dashed rgba(255,139,31,.9);border-radius:50%}
.av-side{flex:1;min-width:190px}
.av-preview-row{display:flex;gap:10px;align-items:center;justify-content:center;margin-bottom:8px}
.av-pv{border-radius:50%;overflow:hidden;border:2px solid var(--orange);background:#0d1a2d;flex:none}
.av-pv.s{width:40px;height:40px}
.av-pv.m{width:60px;height:60px}
.av-pv.l{width:84px;height:84px;border-radius:12px}
.av-pv img{width:100%;height:100%;object-fit:cover;display:block}
.av-tool{margin-bottom:9px}
.av-tool .lbl{display:flex;justify-content:space-between;font-size:10.5px;font-weight:800;text-transform:uppercase;color:var(--mut);margin-bottom:3px}
.av-tool .lbl b{color:var(--orange2)}
.av-btns{display:flex;gap:6px;flex-wrap:wrap}
.av-btns .btn{flex:1;min-width:70px}
.av-presets{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:8px}
.av-preset{aspect-ratio:1;border-radius:10px;overflow:hidden;border:2px solid var(--line);cursor:pointer;background:#0d1a2d;padding:0}
.av-preset.on{border-color:var(--orange)}
.av-preset img{width:100%;height:100%;display:block;object-fit:cover}
.av-hint{font-size:11px;color:var(--dim);line-height:1.5;margin-top:8px}
.file-row{display:flex;align-items:center;gap:10px;background:#0d1a2d;border:1px solid var(--line);border-radius:11px;padding:9px 11px;margin-bottom:7px}
.file-ico{width:36px;height:36px;flex:none;border-radius:9px;display:grid;place-items:center;font-size:12px;font-weight:800;font-family:var(--fd);background:rgba(167,139,250,.15);color:var(--violet);border:1px solid rgba(167,139,250,.4)}
.file-ico.pdf{background:var(--red-dim);color:var(--red);border-color:rgba(255,95,107,.4)}
.file-ico.csv,.file-ico.xls,.file-ico.js{background:var(--green-dim);color:var(--green);border-color:rgba(65,224,141,.4)}
.file-info{flex:1;min-width:0}
.file-name{font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-meta{font-size:10.5px;color:var(--dim);margin-top:2px}
.code-block{background:#08101d;border:1px solid var(--line2);border-radius:10px;padding:12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;line-height:1.55;color:#c8d8f0;white-space:pre;overflow:auto;max-height:40vh;margin-top:8px}
.log-item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid rgba(36,57,90,.5)}
.log-ico{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-size:14px}
.log-ico.fix{background:var(--green-dim);border:1px solid rgba(65,224,141,.4)}
.log-ico.new{background:rgba(58,169,255,.15);border:1px solid rgba(58,169,255,.4)}
.log-b{flex:1;min-width:0}
.log-b b{display:block;font-size:13.5px;margin-bottom:2px}
.log-b p{font-size:12px;color:var(--mut);line-height:1.5}
.diag-row{display:flex;align-items:flex-start;gap:10px;padding:10px;border:1px solid var(--line);border-radius:11px;margin-bottom:7px;background:#0d1a2d}
