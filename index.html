<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1424">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ТОП-СПИН">
<link rel="apple-touch-icon" id="appleIcon" href="">
<link rel="manifest" id="manifestLink" href="">
<title>ТОП-СПИН — центр турниров</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/russo-one@5/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/golos-text@5/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/golos-text@5/500.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/golos-text@5/600.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/golos-text@5/700.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/golos-text@5/800.css">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-messaging-compat.js"></script>
<style>
:root{--bg:#0a1424;--bg2:#0e1c31;--panel:#132238;--panel2:#182b46;--row:#0d1526;--line:#24395a;--line2:#31507e;--txt:#eaf2ff;--mut:#8ea6c8;--dim:#5f7699;--orange:#ff8b1f;--orange2:#ffb35c;--ball:#ffa41b;--blue:#3aa9ff;--cyan:#22d3ee;--green:#41e08d;--green-dim:rgba(65,224,141,.14);--amber:#fbbf24;--amber-dim:rgba(251,191,36,.14);--violet:#a78bfa;--lime:#90ee90;--red:#ff5f6b;--red-dim:rgba(255,95,107,.14);--gold:#ffd166;--silver:#cfd8e3;--bronze:#e0a06c;--rad:14px;--fd:'Russo One',system-ui,sans-serif;--fb:'Golos Text',system-ui,sans-serif}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px;scrollbar-color:var(--orange) var(--bg2);scrollbar-width:thin}
img{max-width:100%}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:var(--bg2);border-radius:9px}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--orange),#c25f0d);border-radius:9px;border:2px solid var(--bg2)}
::-webkit-scrollbar-thumb:hover{background:linear-gradient(180deg,var(--orange2),var(--orange))}
body{font-family:var(--fb);color:var(--txt);background:var(--bg);min-height:100vh;overflow-x:hidden;touch-action:manipulation;-webkit-text-size-adjust:100%;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
body.locked{overflow:hidden}
body.big-font{font-size:18px}
.bg-table{position:fixed;left:50%;top:56%;transform:translate(-50%,-50%);width:min(94vw,560px);color:#fff;opacity:.05;z-index:-1;pointer-events:none;stroke:currentColor;fill:none;stroke-width:2.5}
body.light{--bg:#f5f7fa;--bg2:#e8ecf1;--panel:#fff;--panel2:#f0f4f8;--row:#eef2f7;--line:#d1d9e0;--line2:#b8c4d0;--txt:#1a2332;--mut:#4a5a6a;--dim:#8a96a6}
body.light .bg-table{color:#0a1424;opacity:.07}
body.light .topbar,body.light .tabbar{background:rgba(245,247,250,.94)}
body.light input,body.light select,body.light textarea{background:#fff;color:var(--txt)}
body.light .card,body.light .sheet,body.light .counter,body.light .stat,body.light .trow,body.light .prow,body.light .mrow,body.light .setin,body.light .tally,body.light .train-card,body.light .lr-row,body.light .pcard,body.light .thero,body.light .qcard,body.light .podium-card{background:#fff}
body.light .pcard-stat,body.light .thero-stat{background:#f2f6fc}
body.light .counter b,body.light .prow .rat,body.light .datebox b,body.light .tally .n{color:#c77700}
.login-screen{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:20px;overflow-y:auto}
.login-bg{position:absolute;inset:0;z-index:0;overflow:hidden}
.login-bg canvas{position:absolute;inset:0;width:100%;height:100%;display:block;filter:blur(2px) saturate(1.25);transform:scale(1.03)}
.login-bg-overlay{position:absolute;inset:0;z-index:3;background:radial-gradient(ellipse at center,rgba(10,20,36,.30) 0%,rgba(10,20,36,.52) 55%,rgba(10,20,36,.80) 100%)}
.login-card{position:relative;z-index:4;max-width:400px;width:100%;background:rgba(21,39,65,.92);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:20px;padding:26px;text-align:center}
.login-logo{width:72px;height:72px;margin:0 auto 14px}
.login-title{font-family:var(--fd);font-size:24px;margin-bottom:6px;color:#eaf2ff}
.login-sub{color:#8ea6c8;font-size:13px;margin-bottom:16px}
.login-mode{display:flex;gap:8px;margin-bottom:8px}.login-mode .btn{flex:1;padding:9px 10px;font-size:13px}
.login-step{display:none}.login-step.active{display:block}
.login-label{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#8ea6c8;margin:14px 0 6px;text-align:left}
.login-input{width:100%;font-family:var(--fb);font-size:16px;color:#eaf2ff;background:#0d1a2d;border:1px solid var(--line);border-radius:10px;padding:13px 12px;outline:none;text-align:center;letter-spacing:1px}
.login-btn{width:100%;margin-top:16px;font-family:var(--fb);font-weight:800;font-size:15px;color:#241203;background:linear-gradient(180deg,#ffa14a,#ff7d12);border:none;border-radius:11px;padding:13px;cursor:pointer}
.login-btn.secondary{background:transparent;color:#8ea6c8;margin-top:10px}
.login-error{color:var(--red);font-size:13px;margin-top:10px;min-height:18px;word-break:break-word}
.login-hint{color:#5f7699;font-size:12px;margin-top:10px;line-height:1.5}
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:8px;max-width:540px;margin:0 auto;width:100%;padding:calc(8px + env(safe-area-inset-top)) clamp(10px,3vw,14px) 8px;background:rgba(10,20,36,.9);backdrop-filter:blur(10px)}
.app{max-width:540px;margin:0 auto;padding:0 clamp(10px,3vw,14px) calc(110px + env(safe-area-inset-bottom))}
.brand{display:flex;align-items:center;gap:10px;min-width:0;cursor:pointer;flex:1}
.logo{width:40px;height:40px;flex:none;filter:drop-shadow(0 4px 12px rgba(255,139,31,.35))}
.brand h1{font-family:var(--fd);font-size:clamp(15px,4.2vw,19px);letter-spacing:.06em;line-height:1}
.brand h1 em{font-style:normal;color:var(--orange)}
.brand small{display:block;color:var(--mut);font-size:10px;letter-spacing:.14em;text-transform:uppercase;margin-top:3px}
.topbar-right{display:flex;align-items:center;gap:6px;margin-left:auto;flex:none}
.datechip{font-size:11px;font-weight:600;color:var(--mut);border:1px solid var(--line);border-radius:999px;padding:4px 9px;white-space:nowrap}
.pushoff-chip{font-size:10px;font-weight:800;color:var(--amber);border:1px solid rgba(251,191,36,.55);background:var(--amber-dim);border-radius:999px;padding:4px 8px;white-space:nowrap;cursor:pointer}
.sync-indicator{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:600;color:var(--mut);padding:2px 7px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.sync-indicator.synced{color:var(--green);border-color:rgba(65,224,141,.5)}
.sync-indicator.error{color:var(--red);border-color:rgba(255,95,107,.5)}
.sync-dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.iconbtn{width:36px;height:36px;flex:none;display:grid;place-items:center;cursor:pointer;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;color:var(--mut)}
.iconbtn svg{width:18px;height:18px}
.card{background:linear-gradient(180deg,#152741,#111f36);border:1px solid var(--line);border-radius:var(--rad);padding:clamp(12px,3.5vw,16px);position:relative}
.row-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.row-actions .btn{flex:1;justify-content:center}
.btn{display:inline-flex;align-items:center;gap:7px;justify-content:center;font-family:var(--fb);font-weight:800;font-size:14px;color:var(--txt);border:none;cursor:pointer;border-radius:11px;padding:11px 16px;user-select:none}
.btn[disabled]{opacity:.5;cursor:not-allowed;filter:grayscale(.5)}
.btn.primary{background:linear-gradient(180deg,#ffa14a,#ff7d12);color:#241203}
.btn.ghost{background:rgba(255,255,255,.04);border:1px solid var(--line2);font-weight:600}
.btn.danger{background:var(--red-dim);border:1px solid rgba(255,95,107,.45);color:var(--red)}
.btn.ok{background:var(--green-dim);border:1px solid rgba(65,224,141,.45);color:var(--green)}
.btn.info{background:rgba(58,169,255,.14);border:1px solid rgba(58,169,255,.45);color:var(--blue)}
.btn.gold{background:linear-gradient(180deg,#ffd166,#e0a02c);color:#241203}
.btn.live{background:linear-gradient(180deg,#ff6b6b,#e02f3d);color:#fff;box-shadow:0 4px 16px rgba(224,47,61,.35)}
.btn.sm{padding:7px 12px;font-size:12.5px}.btn.xs{padding:5px 9px;font-size:11.5px;border-radius:8px}.btn.w100{width:100%}
.btn:active,.iconbtn:active,.tabbtn:active,.chip:active{transform:scale(.95);transition:transform .08s}
.mrow:active,.trow:active,.prow:active,.train-card:active,.picker-item:active,.menu-row:active,.pod-col:active{transform:scale(.985);transition:transform .1s}
.msg-alert{animation:blink 1.1s ease-in-out infinite;border-color:var(--red);color:var(--red);background:var(--red-dim)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.45}}
.mut{color:var(--mut)}.dim{color:var(--dim)}.small{font-size:12px}
.sec-title{font-family:var(--fd);font-size:14px;letter-spacing:.12em;text-transform:uppercase;display:flex;align-items:center;gap:9px;margin:22px 2px 11px}
.sec-title .cnt{margin-left:auto;font-family:var(--fb);font-size:11px;font-weight:700;color:var(--dim)}
.status-dot{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:middle}
.status-dot.live{background:var(--green);box-shadow:0 0 8px var(--green);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.status-dot.upcoming{background:var(--blue)}.status-dot.finished{background:var(--orange)}
.delta{font-weight:800;font-size:12px;padding:2px 8px;border-radius:7px;white-space:nowrap}
.delta.up{color:var(--green)}.delta.down{color:var(--red)}
.avatar{width:42px;height:42px;flex:none;border-radius:12px;display:grid;place-items:center;font-family:var(--fd);font-size:15px;color:#0a1424;overflow:hidden;background:#0d1a2d;position:relative}
.avatar.lg{width:64px;height:64px;font-size:23px;border-radius:16px}
.avatar.xl{width:72px;height:72px;font-size:26px;border-radius:50%}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.pring{transition:box-shadow .25s}
.pring.on{box-shadow:0 0 0 3px var(--green),0 0 12px rgba(65,224,141,.45)}
.pring.off{box-shadow:0 0 0 3px rgba(255,95,107,.55)}
#lightbox{position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.94);display:none;align-items:center;justify-content:center;cursor:zoom-out;padding:16px}
#lightbox img{max-width:94vw;max-height:94vh;object-fit:contain;border-radius:10px}
.menu-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;cursor:pointer;background:rgba(255,255,255,.03)}
.menu-row svg{width:20px;height:20px;flex:none;color:var(--orange2)}
.menu-row .mi{width:20px;flex:none;text-align:center;font-size:18px}
.menu-row span{flex:1;font-weight:700;font-size:14px}
input,select,textarea{width:100%;font-family:var(--fb);font-size:15px;color:var(--txt);background:#0d1a2d;border:1px solid var(--line);border-radius:10px;padding:11px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--orange)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:34px}
input[type=file]{display:none}
input[type=range]{-webkit-appearance:none;appearance:none;height:26px;background:transparent;border:none;padding:0}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:9px;background:linear-gradient(90deg,var(--orange),var(--line2))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;margin-top:-7px;border-radius:50%;background:var(--orange);border:2px solid #0d1a2d;box-shadow:0 2px 8px rgba(255,139,31,.6);cursor:pointer}
input[type=range]::-moz-range-track{height:6px;border-radius:9px;background:var(--line2)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--orange);border:2px solid #0d1a2d;cursor:pointer}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--orange);flex:none}
label{display:block;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:13px 0 6px}
.frm2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.count-lbl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:700}
.counters{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.counter{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 3px;text-align:center}
.counter b{display:block;font-family:var(--fd);font-size:clamp(14px,4vw,16px);color:var(--orange2)}
.counter span{font-size:9px;text-transform:uppercase;color:var(--dim);font-weight:700}
.mover{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid rgba(36,57,90,.55);font-size:13.5px}
.mover:last-child{border-bottom:none}
.mover small{display:block;color:var(--dim);font-size:10.5px;margin-top:2px}
.mover.mini{padding:5px 2px;font-size:11.5px;gap:6px}
.list,.train-list{display:flex;flex-direction:column;gap:9px}
.train-card{display:flex;align-items:flex-start;gap:8px;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:10px;padding:9px 10px}
.tc-left{flex:1;min-width:0}
.tc-time{font-family:var(--fd);font-size:13px;color:var(--lime)}
.tc-sub{font-size:11px;color:var(--mut);margin-top:2px}
.tc-names{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tc-name{font-size:11px;background:rgba(58,169,255,.15);border:1px solid rgba(58,169,255,.4);border-radius:999px;padding:2px 8px;color:var(--blue)}
.tc-btn{flex:none}.tc-btn .btn{padding:6px 10px;font-size:11px}
.trow,.prow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:linear-gradient(180deg,#152741,#111f36);border:1px solid var(--line);border-radius:var(--rad);padding:13px;cursor:pointer;color:var(--txt);font-family:var(--fb)}
.datebox{flex:none;width:52px;text-align:center;background:#0d1a2d;border:1px solid var(--line);border-radius:11px;padding:7px 4px}
.datebox b{display:block;font-family:var(--fd);font-size:20px;color:var(--orange2)}
.datebox span{font-size:10px;text-transform:uppercase;color:var(--dim)}
.trow .info,.prow .info{flex:1;min-width:0}
.trow .nm,.prow .nm{font-weight:800;font-size:15px}
.trow .sub,.prow .sub{color:var(--mut);font-size:12px;margin-top:3px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.prow .rat{font-family:var(--fd);font-size:19px;color:var(--ball)}
.cd-inline{color:var(--lime);font-family:var(--fd);font-size:13px;font-weight:700}
.rise{animation:rise .38s both}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.empty{text-align:center;padding:30px 18px;border:1.5px dashed var(--line2);border-radius:var(--rad);color:var(--mut)}
.empty .big{font-size:38px;margin-bottom:8px}.empty b{display:block;color:var(--txt);font-size:16px;margin-bottom:5px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:10px;text-transform:uppercase;color:var(--dim);padding:6px 7px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 7px;border-bottom:1px solid rgba(36,57,90,.5)}
.tbl .rk{font-family:var(--fd);width:28px}
.tbl .nm{font-weight:700;cursor:pointer}
.tbl tr.inactive td{opacity:.55}
.tbl .pts{font-family:var(--fd);color:var(--ball)}
.seg{display:inline-flex;background:#0d1a2d;border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px;margin-bottom:12px}
.seg button{border:none;background:transparent;color:var(--mut);font-weight:700;font-size:12.5px;padding:7px 12px;border-radius:8px;cursor:pointer}
.seg button.on{background:var(--orange);color:#241203}
.backlink{display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:var(--mut);font-weight:700;font-size:13px;cursor:pointer;padding:8px 0;margin:4px 0 8px}
.ptags{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px;justify-content:center}
.ptag{display:inline-flex;align-items:center;gap:7px;background:#0d1a2d;border:1px solid var(--line2);border-radius:999px;padding:4px 8px 4px 4px;font-size:13px;cursor:pointer}
.ptag.paused{border-color:var(--amber);color:var(--amber)}
.ptag.out{border-color:var(--red);color:var(--red);opacity:.75}
.ptag .pmini{width:26px;height:26px;border-radius:50%;overflow:hidden;display:grid;place-items:center;flex:none;font-family:var(--fd);font-size:10px;color:#0a1424}
.ptag .pmini img{width:100%;height:100%;object-fit:cover}
.vshead,.setrow{display:grid;grid-template-columns:46px 1fr 34px 1fr 34px;gap:8px;align-items:center}
.vshead{margin-bottom:16px}.setrow{margin-bottom:12px}
.vshead .side{font-weight:800;font-size:14px;text-align:center}
.vshead .vs,.colon{font-family:var(--fd);color:var(--orange);text-align:center;font-size:22px}
.setlabel{font-size:10px;font-weight:800;text-transform:uppercase;color:var(--dim);text-align:center}
.setin{width:100%;height:60px;text-align:center;font-family:var(--fd);font-size:26px;border-radius:14px;border-width:2px;padding:4px}
.setin.win{border-color:var(--green);color:var(--green)}
.setrow .rm{width:34px;height:34px;border-radius:10px}
.tally{display:flex;align-items:center;justify-content:center;gap:16px;background:#0d1a2d;border:2px solid var(--line2);border-radius:16px;padding:16px;margin:16px 0}
.tally .n{font-family:var(--fd);font-size:38px;color:var(--ball)}
.tally .sep{color:var(--dim);font-family:var(--fd);font-size:26px}
.tally .who{font-size:12px;color:var(--mut);max-width:105px;text-align:center;font-weight:700}
.rprev{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(540px,100%);z-index:50;display:flex;gap:4px;padding:8px 10px calc(9px + env(safe-area-inset-bottom));background:rgba(11,20,36,.95);backdrop-filter:blur(10px);border-top:1px solid var(--line)}
.tabbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;color:var(--dim);font-family:var(--fb);font-size:10px;font-weight:700;cursor:pointer;padding:7px 2px;border-radius:11px;position:relative}
.tabbtn svg{width:22px;height:22px}.tabbtn.on{color:var(--orange)}
.badge{position:absolute;top:2px;right:6px;background:var(--red);color:#fff;font-size:9px;font-weight:800;border-radius:999px;padding:1px 5px;min-width:14px;text-align:center}
#modal-root{position:fixed;inset:0;z-index:180;display:none;align-items:flex-end;justify-content:center;pointer-events:none}
.backdrop{position:absolute;inset:0;background:rgba(4,9,18,.72);backdrop-filter:blur(2px)}
.sheet{position:relative;width:min(540px,100%);max-height:92vh;overflow-y:auto;background:linear-gradient(180deg,#17293f,#101d31);border:1px solid var(--line2);border-radius:20px 20px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));animation:sheetIn .16s ease-out}
@keyframes sheetIn{from{transform:translateY(18px);opacity:.6}to{transform:none;opacity:1}}
.sheet h3{font-family:var(--fd);font-size:18px;margin-bottom:4px;padding-right:40px}
.sheet h4{font-family:var(--fd);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--orange2);margin:18px 0 8px}
.sheet .grab{width:44px;height:4px;border-radius:2px;background:var(--line2);margin:0 auto 15px}
.modal-x{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.06);border:1px solid var(--line2);color:var(--mut);font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:3}
.emorow{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px}
.emopt{width:42px;height:42px;font-size:20px;display:grid;place-items:center;cursor:pointer;background:#0d1a2d;border:1.5px solid var(--line);border-radius:11px}
.emopt.on{border-color:var(--orange);background:rgba(255,139,31,.12)}
.award-card{display:flex;align-items:center;gap:14px;padding:14px;border-radius:16px;border:1px solid var(--line);background:linear-gradient(135deg,rgba(255,209,102,.10),rgba(255,139,31,.04));margin-bottom:10px}
.award-card.g{background:linear-gradient(135deg,rgba(255,209,102,.22),rgba(255,139,31,.08));border-color:rgba(255,209,102,.5)}
.award-card.s{background:linear-gradient(135deg,rgba(207,216,227,.18),rgba(255,255,255,.05));border-color:rgba(207,216,227,.45)}
.award-card.b{background:linear-gradient(135deg,rgba(224,160,108,.2),rgba(224,160,108,.06));border-color:rgba(224,160,108,.45)}
.award-card.d{background:linear-gradient(135deg,rgba(58,169,255,.18),rgba(58,169,255,.05));border-color:rgba(58,169,255,.5)}
.award-emoji{flex:none;font-size:46px;line-height:1}
.award-mid{flex:1;min-width:0;display:flex;align-items:center;gap:12px}
.award-info{flex:1;min-width:0}
.award-title{font-family:var(--fd);font-size:15px;color:var(--gold)}
.award-card.s .award-title{color:var(--silver)}.award-card.b .award-title{color:var(--bronze)}.award-card.d .award-title{color:var(--blue)}
.award-name{font-weight:800;font-size:14px;margin-top:2px}
.award-sub{font-size:11px;color:var(--mut);margin-top:2px}
.award-card .del{margin-left:auto}
.auto-badge{font-size:9px;font-weight:800;background:rgba(58,169,255,.2);color:var(--blue);border-radius:5px;padding:1px 5px;margin-left:6px;vertical-align:middle}
/* ==== БЫСТРЫЕ УВЕДОМЛЕНИЯ ==== */
#toast-root{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(94px + env(safe-area-inset-bottom));z-index:320;display:flex;flex-direction:column;gap:6px;align-items:center;width:min(430px,92%);pointer-events:none}
.toast{background:#1c2c45;border:1px solid var(--line2);color:var(--txt);font-size:13.5px;font-weight:700;padding:10px 16px;border-radius:12px;opacity:0;transform:translateY(8px) scale(.97);transition:opacity .1s linear,transform .1s linear;text-align:center;pointer-events:auto;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.45);max-width:100%}
.toast.in{opacity:1;transform:none}
.toast.out{opacity:0;transform:translateY(-4px) scale(.98)}
.toast.err{border-color:rgba(255,95,107,.65);color:#ffd7da}
.toast.ok{border-color:rgba(65,224,141,.65);color:#d6ffe9}
.toast.undo{display:flex;align-items:center;gap:10px;border-color:var(--amber);background:linear-gradient(180deg,#2a2416,#1c2c45);cursor:default}
.toast.undo span{flex:1;text-align:left;font-size:12.5px}
.toast.undo button{background:var(--amber);color:#241203;border:none;border-radius:8px;padding:6px 12px;font-weight:800;font-size:12px;cursor:pointer;flex:none}
.toast.undo .ux{background:transparent;color:var(--mut);padding:4px 6px;font-size:14px}
.toast.sms{display:flex;align-items:flex-start;gap:10px;text-align:left;border-color:rgba(58,169,255,.6);width:100%}
.sms-ico{flex:none;width:34px;height:34px;border-radius:50%;background:rgba(58,169,255,.18);border:1px solid rgba(58,169,255,.5);display:flex;align-items:center;justify-content:center;font-size:16px}
.sms-body{flex:1;min-width:0}.sms-text{font-size:12.5px;color:var(--mut);word-break:break-word;font-weight:500}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:#0f1e33;border:1px solid var(--line);border-radius:11px;padding:11px 6px;text-align:center}
.stat b{display:block;font-family:var(--fd);font-size:18px}
.stat span{font-size:10px;text-transform:uppercase;color:var(--dim);font-weight:700}
.picker-list{display:flex;flex-direction:column;gap:6px;max-height:50vh;overflow-y:auto;margin-top:8px}
.picker-item{display:flex;align-items:center;gap:10px;background:#0d1a2d;border:1px solid var(--line);border-radius:11px;padding:9px 11px;cursor:pointer}
.picker-item .nm{flex:1;font-weight:700;font-size:14px}
.picker-item.picker-picked{border-color:var(--green);background:rgba(65,224,141,.08)}
.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.settings-grid.three{grid-template-columns:repeat(3,1fr)}
.toggle-row{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:10px;margin:8px 0;cursor:pointer}
.toggle-row span{flex:1;font-weight:600;font-size:13.5px}
.tournament-register-item{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:var(--rad);padding:14px;margin-bottom:9px}
.tournament-register-info{flex:1}.tournament-register-name{font-weight:700;font-size:15px}
.tournament-register-meta{color:var(--mut);font-size:12px;margin-top:4px;display:flex;gap:6px;flex-wrap:wrap}
.settings-info{background:rgba(255,139,31,.08);border:1px solid rgba(255,139,31,.2);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:12px;color:var(--mut);line-height:1.5}
.settings-info.good{background:var(--green-dim);border-color:rgba(65,224,141,.35)}
.settings-info.warn{background:var(--amber-dim);border-color:rgba(251,191,36,.4)}
.code-item{display:flex;align-items:center;gap:10px;background:#0d1a2d;border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin-bottom:8px;flex-wrap:wrap}
.code-item .phone{flex:1;font-weight:700;font-size:13px}
.code-item .code{font-family:var(--fd);color:var(--ball);font-size:12px}
.challenges{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:16px}
.ch-title{font-size:17px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;font-family:var(--fd)}
.ch-sub{margin-top:4px;font-size:13px;color:var(--mut);line-height:1.4}
.ch-total{display:flex;align-items:center;gap:10px;margin-top:16px}
.ch-total-bar{flex:1;height:6px;border-radius:99px;background:#1c2740;overflow:hidden}
.ch-total-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#16a34a,#4ade80);transition:width .4s}
.ch-total span{font-size:12px;color:var(--mut);white-space:nowrap;font-weight:600}
.ch-list{list-style:none;margin:16px 0 0;display:flex;flex-direction:column;gap:10px}
.ch-item{display:flex;align-items:center;gap:11px;padding:12px 13px;background:var(--row);border:1px solid var(--line);border-radius:12px}
.ch-item.done{border-color:rgba(74,222,128,.35);background:rgba(74,222,128,.05)}
.ch-check{flex:none;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:var(--green-dim);color:#4ade80;border:1.5px solid #4ade80}
.ch-item.wip .ch-check{background:var(--amber-dim);color:var(--amber);border-color:var(--amber);font-size:10px}
.ch-emoji{font-size:20px;flex:none}
.ch-name{flex:1;font-size:13.5px;font-weight:600;line-height:1.3}
.ch-badge{font-size:10.5px;font-weight:700;padding:4px 9px;border-radius:99px;background:var(--green-dim);color:#4ade80;white-space:nowrap}
.ch-item.wip .ch-badge{background:var(--amber-dim);color:var(--amber)}
.ai-trainer-card{background:linear-gradient(135deg,#1e293b,#0f172a);border:1px solid var(--blue);border-radius:var(--rad);padding:16px;margin-top:16px}
.ai-trainer-header{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-family:var(--fd);color:var(--blue);font-size:14px}
.ai-icon{width:24px;height:24px;fill:currentColor}
.ai-btn-analyze{width:100%;background:rgba(58,169,255,.15);border:1px solid rgba(58,169,255,.4);color:var(--blue);font-weight:700;padding:12px;border-radius:10px;cursor:pointer;display:flex;justify-content:center;align-items:center;gap:8px}
.ai-response-area{margin-top:12px;background:rgba(0,0,0,.25);border-radius:8px;padding:12px;font-size:13px;line-height:1.6;display:none;white-space:pre-wrap}
.ai-loading{display:inline-block;width:14px;height:14px;border:2px solid transparent;border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.chat-screen{position:fixed;inset:0;z-index:150;background:var(--bg);display:none;flex-direction:column;height:100dvh;overflow:hidden}
.chat-screen.active{display:flex}
.chat-header{flex:none;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:rgba(10,20,36,.96);border-bottom:1px solid var(--line)}
.chat-back,.chat-action-btn{width:38px;height:38px;flex:none;display:grid;place-items:center;background:rgba(255,255,255,.06);border:1px solid var(--line2);border-radius:11px;color:var(--txt);cursor:pointer}
.chat-action-btn{border-radius:50%}
.chat-action-btn.call-a{border-color:rgba(65,224,141,.55);color:var(--green)}
.chat-action-btn.call-v{border-color:rgba(58,169,255,.55);color:var(--blue)}
.chat-back svg,.chat-action-btn svg{width:20px;height:20px}
.chat-header-av{width:38px;height:38px;flex:none;border-radius:50%;overflow:hidden;background:var(--panel);display:grid;place-items:center;font-family:var(--fd);font-size:14px;color:#0a1424}
.chat-header-av img{width:100%;height:100%;object-fit:cover}
.chat-header-info{flex:1;min-width:0}
.chat-header-name{font-weight:800;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-header-status{font-size:11.5px;color:var(--mut);margin-top:2px}
.chat-header-status.online{color:var(--green)}
.chat-header-status.typing{color:var(--blue);animation:blink 1.4s infinite}
.chat-header-actions{display:flex;gap:8px;margin-left:auto}
.chat-body{flex:1;overflow-y:auto;padding:14px 14px 8px;display:flex;flex-direction:column;gap:2px;overscroll-behavior:contain}
.chat-date-divider{text-align:center;margin:14px 0 10px;font-size:11px;font-weight:700;color:var(--dim);text-transform:uppercase}
.chat-date-divider span{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:999px;padding:3px 12px}
.chat-msg{display:flex;margin-bottom:4px;max-width:85%;animation:msgIn .16s ease-out}
@keyframes msgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.chat-msg.mine{align-self:flex-end}
.chat-msg .msg-bubble{padding:8px 12px;border-radius:16px;background:var(--panel2);border:1px solid var(--line);font-size:14px;line-height:1.4;position:relative;overflow-wrap:break-word;min-width:74px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;white-space:pre-wrap}
.chat-msg.mine .msg-bubble{background:linear-gradient(180deg,rgba(255,139,31,.28),rgba(255,139,31,.16));border-color:rgba(255,139,31,.5);cursor:pointer}
.chat-msg .msg-from{font-size:11px;font-weight:800;color:var(--orange2);margin-bottom:3px}
.chat-msg .msg-meta{display:flex;align-items:center;gap:4px;justify-content:flex-end;margin-top:2px;font-size:10px;color:var(--dim)}
.chat-msg .msg-meta .check.read{color:var(--blue)}
.chat-input-area{flex:none;display:flex;align-items:flex-end;gap:8px;padding:10px 12px calc(12px + env(safe-area-inset-bottom));background:rgba(10,20,36,.96);border-top:1px solid var(--line)}
.chat-textarea{flex:1;min-height:42px;max-height:120px;resize:none;font-size:15px;background:var(--panel2);border:1px solid var(--line2);border-radius:20px;padding:11px 16px;line-height:1.3}
.chat-send{width:44px;height:44px;flex:none;border-radius:50%;border:none;background:linear-gradient(180deg,#ffa14a,#ff7d12);color:#241203;cursor:pointer;display:grid;place-items:center}
.chat-send svg{width:20px;height:20px}
.chat-empty{text-align:center;padding:40px 20px;color:var(--mut);font-size:13px}
.chat-empty .big{font-size:36px;margin-bottom:8px}
.chat-dialogs{display:flex;flex-direction:column;gap:2px;max-height:60vh;overflow-y:auto;margin:10px -8px;padding:0 8px}
.chat-dialog{display:flex;align-items:center;gap:12px;padding:10px 8px;border-radius:12px;cursor:pointer}
.chat-dialog:active{background:rgba(255,255,255,.06)}
.chat-dialog-av{width:48px;height:48px;flex:none;border-radius:50%;display:grid;place-items:center;font-family:var(--fd);font-size:16px;overflow:hidden;background:var(--panel2);position:relative;color:#0a1424}
.chat-dialog-av img{width:100%;height:100%;object-fit:cover}
.chat-dialog-av.online::after{content:'';position:absolute;bottom:1px;right:1px;width:10px;height:10px;border-radius:50%;background:var(--green);border:2px solid var(--bg)}
.chat-dialog-body{flex:1;min-width:0}
.chat-dialog-top,.chat-dialog-bottom{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chat-dialog-bottom{margin-top:2px}
.chat-dialog-name{font-weight:800;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-dialog-time{font-size:11px;color:var(--dim);flex:none}
.chat-dialog-last{font-size:12.5px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.chat-dialog-last.unread{color:var(--txt);font-weight:600}
.chat-unread{background:var(--orange);color:#241203;font-size:10.5px;font-weight:800;border-radius:999px;padding:1px 7px;min-width:20px;text-align:center;flex:none}
.dropdown-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1}
.dropdown-menu{position:absolute;top:calc(55px + env(safe-area-inset-top));right:12px;width:238px;background:linear-gradient(180deg,#17293f,#101d31);border:1px solid var(--line2);border-radius:14px;padding:8px;box-shadow:0 10px 30px rgba(0,0,0,.6);animation:popIn .14s ease-out;z-index:2}
@keyframes popIn{from{opacity:0;transform:scale(.94) translateY(-8px)}to{opacity:1;transform:none}}
.dropdown-menu .menu-row{margin-bottom:5px;padding:11px 12px}
.dropdown-menu .menu-row:last-child{margin-bottom:0}
.rating-hero{background:linear-gradient(135deg,#1e293b,#0f172a);border:1px solid var(--gold);border-radius:var(--rad);padding:16px 20px;margin-bottom:15px;text-align:center;box-shadow:0 8px 24px rgba(255,209,102,.1)}
.rating-hero h2{font-family:var(--fd);color:var(--gold);font-size:20px;margin-bottom:4px}
.rating-hero p{color:var(--mut);font-size:12px;line-height:1.4}
.rating-list{display:flex;flex-direction:column;gap:8px}
.rating-row{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer}
.rating-row.top1{background:linear-gradient(90deg,rgba(255,209,102,.15),var(--panel));border-color:rgba(255,209,102,.5)}
.rating-row.top2{background:linear-gradient(90deg,rgba(207,216,227,.15),var(--panel));border-color:rgba(207,216,227,.4)}
.rating-row.top3{background:linear-gradient(90deg,rgba(224,160,108,.15),var(--panel));border-color:rgba(224,160,108,.4)}
.rating-pos{font-family:var(--fd);font-size:18px;color:var(--dim);width:28px;text-align:center;flex:none}
.rating-row.top1 .rating-pos{color:var(--gold);font-size:22px}
.rating-row.top2 .rating-pos{color:var(--silver)}.rating-row.top3 .rating-pos{color:var(--bronze)}
.rating-info{flex:1;min-width:0}
.rating-name{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rating-sub{font-size:11px;color:var(--mut);margin-top:2px}
.rating-val{font-family:var(--fd);font-size:22px;color:var(--ball);flex:none}
.push-enable-card{background:linear-gradient(135deg,rgba(65,224,141,.12),rgba(58,169,255,.08));border:1px solid rgba(65,224,141,.4);border-radius:var(--rad);padding:14px;margin-top:14px;display:flex;align-items:center;gap:12px}
.push-enable-card.off{background:linear-gradient(135deg,rgba(251,191,36,.12),rgba(255,139,31,.06));border-color:rgba(251,191,36,.45)}
.push-enable-card .pe-ico{flex:none;width:42px;height:42px;border-radius:50%;background:rgba(65,224,141,.18);border:1px solid rgba(65,224,141,.5);display:flex;align-items:center;justify-content:center;font-size:20px}
.push-enable-card.off .pe-ico{background:var(--amber-dim);border-color:rgba(251,191,36,.5)}
.push-enable-card .pe-body{flex:1;min-width:0}
.push-enable-card .pe-title{font-weight:800;font-size:14px}
.push-enable-card .pe-sub{font-size:11.5px;color:var(--mut);line-height:1.4}
/* ==== ЗВОНКИ ==== */
.call-screen{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(540px,100%);z-index:215;background:rgba(13,26,45,.98);backdrop-filter:blur(10px);border-radius:20px 20px 0 0;border:1px solid var(--line2);border-bottom:none;display:none;flex-direction:column;align-items:center;padding:18px 20px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -10px 30px rgba(0,0,0,.55)}
.call-screen.active{display:flex}
.call-avatar{width:76px;height:76px;border-radius:50%;background:var(--panel2);display:grid;place-items:center;font-size:26px;font-family:var(--fd);margin-bottom:12px;overflow:hidden;border:3px solid var(--line2);color:#0a1424}
.call-avatar.ringing{animation:callPulse 1.4s infinite}
@keyframes callPulse{0%,100%{box-shadow:0 0 0 0 rgba(65,224,141,.45)}50%{box-shadow:0 0 0 14px rgba(65,224,141,0)}}
.call-avatar img{width:100%;height:100%;object-fit:cover}
.call-name{font-family:var(--fd);font-size:19px;margin-bottom:4px;text-align:center}
.call-status{font-size:13.5px;color:var(--mut);margin-bottom:4px;min-height:18px;text-align:center}
.call-timer{font-family:var(--fd);font-size:15px;color:var(--green);margin-bottom:14px;min-height:18px}
.call-actions{display:flex;gap:18px;align-items:center}
.call-btn{width:56px;height:56px;border-radius:50%;border:none;display:grid;place-items:center;cursor:pointer;color:#fff}
.call-btn.hangup{background:var(--red)}.call-btn.mute{background:var(--blue)}.call-btn.mute.muted{background:var(--dim)}
.call-btn.cam{background:var(--violet)}.call-btn.cam.off{background:var(--dim)}
.call-btn svg{width:25px;height:25px}
.call-lbl{font-size:9.5px;color:var(--dim);text-align:center;margin-top:5px;font-weight:700;text-transform:uppercase}
.call-col{display:flex;flex-direction:column;align-items:center}
/* ==== КАРТОЧКА ИГРОКА ==== */
.pcard{position:relative;border-radius:22px;overflow:hidden;border:1px solid var(--line2);background:linear-gradient(180deg,#132238,#0e1c31);box-shadow:0 14px 40px rgba(0,0,0,.45);margin-bottom:16px}
.pcard-cover{position:relative;height:108px;background:linear-gradient(135deg,var(--c1,#ff8b1f),var(--c2,#e0452c))}
.pcard-cover .rings{position:absolute;inset:0;opacity:.28;background-image:repeating-radial-gradient(circle at 50% 130%,rgba(255,255,255,.4) 0 1px,transparent 1px 20px)}
.pcard-cover .glow{position:absolute;inset:0;background:radial-gradient(circle at 22% 18%,rgba(255,255,255,.28),transparent 46%),radial-gradient(circle at 82% 76%,rgba(0,0,0,.28),transparent 52%)}
.pcard-lvl{position:absolute;top:10px;left:12px;z-index:2;background:rgba(10,20,36,.55);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:999px;padding:4px 11px;font-size:11px;font-weight:800}
.pcard-edit{position:absolute;top:9px;right:9px;z-index:2;width:34px;height:34px;border-radius:11px;border:1px solid rgba(255,255,255,.4);background:rgba(10,20,36,.45);color:#fff;cursor:pointer;font-size:15px}
.pcard-body{padding:0 16px 16px;text-align:center;position:relative}
.pcard-av{width:114px;height:114px;margin:-60px auto 10px;border-radius:50%;overflow:hidden;border:4px solid var(--panel);box-shadow:0 10px 26px rgba(0,0,0,.55);background:#0d1a2d;position:relative;cursor:pointer;display:grid;place-items:center}
.pcard-av img{width:100%;height:100%;object-fit:cover;display:block}
.pcard-av .ini{width:100%;height:100%;display:grid;place-items:center;font-family:var(--fd);font-size:38px;color:#0a1424}
.pcard-av .cam{position:absolute;bottom:0;left:0;right:0;background:rgba(10,20,36,.8);color:var(--orange2);font-size:9.5px;font-weight:800;padding:3px 0}

.thero-stat b{display:block;font-family:var(--fd);font-size:16px;color:var(--orange2)}
.thero-stat span{font-size:8.5px;text-transform:uppercase;color:var(--dim);font-weight:800}
.tw{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:5px;margin:14px auto 4px;padding:16px 14px;border-radius:18px;background:linear-gradient(180deg,rgba(255,209,102,.18),rgba(255,209,102,.04));border:1px solid rgba(255,209,102,.45);max-width:340px;width:100%;cursor:pointer;color:var(--txt);font-family:var(--fb)}

.tpod{display:flex;justify-content:center;align-items:flex-end;gap:10px;margin:14px auto 0;max-width:370px}

.tpod .av{width:52px;height:52px;border-radius:50%;overflow:hidden;border:2px solid var(--line2);background:#0d1a2d;display:grid;place-items:center;margin-bottom:5px}

.tpod .nm{font-size:11.5px;font-weight:800;line-height:1.2;word-break:break-word;margin-top:2px}

/* ==== ПОДИУМ АРЕНЫ ==== */
.podium-card{position:relative;overflow:hidden;border-radius:20px;border:1px solid rgba(255,209,102,.38);background:linear-gradient(180deg,#1a2b45,#0d1a2e);padding:14px 12px 0;box-shadow:0 14px 36px rgba(0,0,0,.45)}

.podium-head{position:relative;display:flex;align-items:center;gap:8px;margin-bottom:2px}
.podium-head b{font-family:var(--fd);font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.podium-head .sub{font-size:10.5px;color:var(--mut);margin-top:3px}
.podium-head .more{margin-left:auto;flex:none}

.pod-col{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;cursor:pointer;animation:podUp .5s both}

.pod-medal{font-size:16px;line-height:1;margin-bottom:3px}
.pod-av{width:54px;height:54px;border-radius:50%;overflow:hidden;border:3px solid var(--line2);background:#0d1a2d;display:grid;place-items:center;transition:transform .22s,box-shadow .22s;box-shadow:0 6px 16px rgba(0,0,0,.5)}

.pod-name{font-size:11.5px;font-weight:800;line-height:1.2;text-align:center;margin-top:6px;word-break:break-word;max-width:100%}
.pod-col.g .pod-name{font-size:12.5px;color:var(--gold)}
.pod-lvl{font-size:9px;font-weight:800;color:var(--blue);margin-top:2px;text-align:center}
.pod-r{font-family:var(--fd);font-size:19px;color:var(--ball);margin-top:3px;line-height:1}
.pod-col.g .pod-r{font-size:23px;color:var(--gold);text-shadow:0 0 16px rgba(255,209,102,.5)}
.pod-sub{font-size:9.5px;color:var(--mut);margin-top:2px;text-align:center}
.pod-aw{font-size:11px;margin-top:3px;min-height:14px;letter-spacing:1px}
.pod-base{position:relative;width:100%;margin-top:9px;border-radius:12px 12px 0 0;border:1px solid;border-bottom:none;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.pod-base b{font-family:var(--fd);font-size:26px;line-height:1;color:#0a1424;opacity:.85}
.pod-base span{font-size:8px;font-weight:800;text-transform:uppercase;letter-spacing:.12em;color:rgba(10,20,36,.7);margin-top:2px}
.pod-col.g .pod-base{height:88px;background:linear-gradient(180deg,#ffe6a3,#ffd166 45%,#d99b1f);border-color:#ffe9b5}
.pod-col.s .pod-base{height:64px;background:linear-gradient(180deg,#f2f6fb,#cfd8e3 45%,#9aa8ba);border-color:#e6edf5}

.podium-foot{position:relative;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;padding:9px 4px calc(10px + env(safe-area-inset-bottom,0px));font-size:10.5px;color:var(--mut);border-top:1px solid rgba(255,255,255,.07);background:rgba(0,0,0,.18);margin:0 -12px}
.podium-foot b{color:var(--orange2)}
.hcard{background:linear-gradient(180deg,#152741,#111f36);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;cursor:pointer;text-align:center}

.hcard .hd{font-size:11.5px;color:var(--mut);margin-top:4px}
.hcard .hs{display:flex;justify-content:center;gap:10px;font-size:11.5px;color:var(--mut);margin-top:6px;flex-wrap:wrap}
/* ==== ДОКУМЕНТЫ ==== */
.doc-viewer{position:fixed;inset:0;z-index:300;background:var(--bg2);display:none;flex-direction:column;height:100dvh}
.doc-viewer.active{display:flex}

.doc-kpi span{font-size:9.5px;text-transform:uppercase;color:#5b6b85;font-weight:700}
.doc-table{width:100%;border-collapse:collapse;font-size:12.5px}

.qhead{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--mut);margin-bottom:9px;flex-wrap:wrap}
.qhead .tb{background:rgba(58,169,255,.15);border:1px solid rgba(58,169,255,.4);color:var(--blue);border-radius:6px;padding:2px 7px;font-weight:800}
.qhead .flag{margin-left:auto;font-size:13px}
.qpair{display:flex;align-items:center;gap:8px}
.qside{flex:1;min-width:0;display:flex;align-items:center;gap:7px}
.qside.r{justify-content:flex-end;text-align:right}
.qside .nm{font-weight:800;font-size:12.5px;line-height:1.2;overflow:hidden}
.qside .nm.win{color:var(--green)}
.qvs{font-family:var(--fd);color:var(--orange);font-size:13px;flex:none}
.qscore{font-family:var(--fd);font-size:20px;color:var(--ball);flex:none}
.qacts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.qacts .btn{flex:1;min-width:84px}
/* ==== СТУДИЯ АВАТАРА ==== */
.av-drop{border:2px dashed var(--line2);border-radius:14px;padding:14px;text-align:center;background:rgba(255,255,255,.02);margin-bottom:10px}
.av-drop.hot{border-color:var(--orange);background:rgba(255,139,31,.08)}
.av-stage{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;justify-content:center}
.av-canvas-wrap{position:relative;width:220px;height:220px;flex:none;border-radius:16px;overflow:hidden;background:#0d1a2d;border:2px solid var(--line2);touch-action:none;cursor:grab}
.av-canvas-wrap canvas{width:100%;height:100%;display:block}
.av-mask{position:absolute;inset:0;pointer-events:none;box-shadow:0 0 0 200px rgba(10,20,36,.55) inset}
.av-mask.round::after{content:'';position:absolute;left:10px;top:10px;right:10px;bottom:10px;border:2px dashed rgba(255,139,31,.9);border-radius:50%}
.av-mask.square::after{content:'';position:absolute;left:10px;top:10px;right:10px;bottom:10px;border:2px dashed rgba(255,139,31,.9);border-radius:12px}
.av-side{flex:1;min-width:190px}
.av-preview-row{display:flex;gap:10px;align-items:center;justify-content:center;margin-bottom:8px}
.av-pv{border-radius:50%;overflow:hidden;border:2px solid var(--orange);background:#0d1a2d;flex:none}
.av-pv.s{width:40px;height:40px}.av-pv.m{width:60px;height:60px}.av-pv.l{width:84px;height:84px;border-radius:12px}
.av-pv img{width:100%;height:100%;object-fit:cover;display:block}
.av-tool{margin-bottom:9px}
.av-tool .lbl{display:flex;justify-content:space-between;font-size:10.5px;font-weight:800;text-transform:uppercase;color:var(--mut);margin-bottom:3px}
.av-tool .lbl b{color:var(--orange2)}
.av-btns{display:flex;gap:6px;flex-wrap:wrap}
.av-btns .btn{flex:1;min-width:70px}
.av-presets{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:8px}
.av-preset{aspect-ratio:1;border-radius:10px;overflow:hidden;border:2px solid var(--line);cursor:pointer;background:#0d1a2d;padding:0}
.av-preset.on{border-color:var(--orange)}
.av-preset img{width:100%;height:100%;display:block;object-fit:cover}
.av-hint{font-size:11px;color:var(--dim);line-height:1.5;margin-top:8px}
.file-row{display:flex;align-items:center;gap:10px;background:#0d1a2d;border:1px solid var(--line);border-radius:11px;padding:9px 11px;margin-bottom:7px}
.file-ico{width:36px;height:36px;flex:none;border-radius:9px;display:grid;place-items:center;font-size:13px;font-weight:800;font-family:var(--fd);background:rgba(167,139,250,.15);color:var(--violet);border:1px solid rgba(167,139,250,.4)}
.file-ico.pdf{background:var(--red-dim);color:var(--red);border-color:rgba(255,95,107,.4)}
.file-ico.csv,.file-ico.xls{background:var(--green-dim);color:var(--green);border-color:rgba(65,224,141,.4)}
.file-info{flex:1;min-width:0}
.file-name{font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-meta{font-size:10.5px;color:var(--dim);margin-top:2px}
.code-block{background:#08101d;border:1px solid var(--line2);border-radius:10px;padding:12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;line-height:1.55;color:#c8d8f0;white-space:pre;overflow:auto;max-height:46vh;margin-top:8px}
.log-item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid rgba(36,57,90,.5)}
.log-item:last-child{border-bottom:none}
.log-ico{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-size:14px}
.log-ico.fix{background:var(--green-dim);border:1px solid rgba(65,224,141,.4)}
.log-ico.new{background:rgba(58,169,255,.15);border:1px solid rgba(58,169,255,.4)}
.log-b{flex:1;min-width:0}
.log-b b{display:block;font-size:13.5px;margin-bottom:2px}
.log-b p{font-size:12px;color:var(--mut);line-height:1.5}
.diag-row{display:flex;align-items:flex-start;gap:10px;padding:10px;border:1px solid var(--line);border-radius:11px;margin-bottom:7px;background:#0d1a2d}
.diag-ico{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:13px;font-weight:800;background:rgba(255,255,255,.06);color:var(--mut)}
.diag-row.ok .diag-ico{background:var(--green-dim);color:var(--green);border:1px solid rgba(65,224,141,.45)}
.diag-row.bad .diag-ico{background:var(--red-dim);color:var(--red);border:1px solid rgba(255,95,107,.45)}
.diag-row.wait .diag-ico{background:rgba(58,169,255,.15);color:var(--blue);border:1px solid rgba(58,169,255,.45)}
.diag-b{flex:1;min-width:0}.diag-b b{display:block;font-size:13px}
.diag-b span{display:block;font-size:11.5px;color:var(--mut);margin-top:2px;word-break:break-word}
@media (max-width:400px){

sha256(c).then(h=>{const s=state.playerCodes?state.playerCodes[ph]:null;

function generatePairs(tid,mode){const t=tourn(tid);if(!t)return;
const ids=activeIds(t),skipped=(t.playerIds||[]).length-ids.length;
if(ids.length<2){toast('Нужно минимум 2 активных участника','err');LIVE.tab='roster';renderLive();return;}
let added=0;
if(mode==='swiss'){const st=standings(tid),eng=engine();
const order=ids.slice().sort((a,b)=>{const ra=st.find(r=>r.pid===a),rb=st.find(r=>r.pid===b);return((rb?rb.pts:0)-(ra?ra.pts:0))||(eng.R[b]-eng.R[a]);});
const used={};order.forEach(a=>{if(used[a])return;let partner=null;
for(let i=0;i<order.length;i++){const b=order[i];if(b===a||used[b])continue;if(!pairExists(tid,a,b)){partner=b;break;}}
if(!partner)for(let j=0;j<order.length;j++){const c=order[j];if(c!==a&&!used[c]){partner=c;break;}}
if(partner){used[a]=1;used[partner]=1;state.matches.push({id:uid(),tournamentId:tid,playerAId:a,playerBId:partner,time:'',table:(added%4)+1,sets:null});added++;}});}
else if(mode==='random'){const pool=ids.slice();for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
for(let k=0;k+1<pool.length;k+=2)if(!pairExists(tid,pool[k],pool[k+1])){state.matches.push({id:uid(),tournamentId:tid,playerAId:pool[k],playerBId:pool[k+1],time:'',table:(k/2)%4+1,sets:null});added++;}}
else{for(let a=0;a<ids.length;a++)for(let b=a+1;b<ids.length;b++)if(!pairExists(tid,ids[a],ids[b])){state.matches.push({id:uid(),tournamentId:tid,playerAId:ids[a],playerBId:ids[b],time:'',table:0,sets:null});added++;}}

function roundRobin(ids){const a=ids.slice();if(a.length%2)a.push(null);const n=a.length,r=[];
for(let i=0;i<n-1;i++){for(let j=0;j<n/2;j++){const x=a[j],y=a[n-1-j];if(x&&y)r.push(i%2?[y,x]:[x,y]);}a.splice(1,0,a.pop());}return r;}

async function analyzeGameStyle(pid){const btn=document.querySelector('.ai-btn-analyze'),box=$('#aiResponseBox');if(!btn||!box)return;
const ck='ai_v6_'+pid+'_'+new Date().toISOString().slice(0,10);
if(state.aiCache&&state.aiCache[ck]){box.style.display='block';box.textContent=state.aiCache[ck];return;}
const orig=btn.innerHTML;btn.disabled=true;btn.innerHTML='<span class="ai-loading"></span> Анализ…';box.style.display='block';box.textContent='Собираю статистику и историю встреч…';
try{const eng=engine(),s=playerStats(pid,eng),p=player(pid);if(!p)throw new Error('Игрок не найден');
const my=eng.played.filter(m=>m.playerAId===pid||m.playerBId===pid);
if(!my.length)throw new Error('Пока нет сыгранных матчей — анализировать нечего');
const h2h={};my.forEach(m=>{const isA=m.playerAId===pid,o=isA?m.playerBId:m.playerAId;if(!h2h[o])h2h[o]={w:0,l:0,last:''};
const w=matchWinner(m)===pid,sc=setsCountArr(m.sets);if(w)h2h[o].w++;else h2h[o].l++;h2h[o].last=(w?'победа':'поражение')+' '+(isA?sc[0]:sc[1])+':'+(isA?sc[1]:sc[0]);});
let ht='';Object.keys(h2h).forEach(o=>{const op=player(o);if(!op)return;ht+=`С ${op.firstName} ${op.lastName} (рейтинг ${eng.R[o]}): ${h2h[o].w} побед, ${h2h[o].l} поражений. Последний раз: ${h2h[o].last}.\n`;});
const ml=my.slice(-5).map(m=>{const isA=m.playerAId===pid,o=isA?m.playerBId:m.playerAId,w=matchWinner(m)===pid,sc=setsCountArr(m.sets),d=eng.mdelta[m.id]?(isA?eng.mdelta[m.id].A:eng.mdelta[m.id].B):0;
return`${w?'✅ Победа':'❌ Поражение'} против ${pNameRaw(o)} (сеты ${isA?sc[0]:sc[1]}:${isA?sc[1]:sc[0]}, рейтинг ${d>0?'+':''}${d})`;}).join('\n');
const sty=p.playStyle||'universal',sn=sty==='attack'?'АТАКУЮЩИЙ (топспины, быстрые атаки у стола)':sty==='defense'?'ЗАЩИТНЫЙ (подрезки, игра в обороне)':'УНИВЕРСАЛЬНЫЙ (смешивает атаку и защиту)';
const sys='Ты — мой личный тренер по НАСТОЛЬНОМУ ТЕННИСУ. МОЙ СТИЛЬ: '+sn+'. НИКОГДА не говори "корт" или "гейм" — говори "стол" и "партия". Обращайся на "ты". Ответ: 1) ОБЩИЙ АНАЛИЗ кратко; 2) ТАКТИКА ПРОТИВ 2-3 СОПЕРНИКОВ. Максимум 220 слов, с эмодзи.';
const usr=`📊 ИГРОК: ${p.firstName} ${p.lastName}\n🎾 РЕЙТИНГ: ${eng.R[pid]} | ВИНРЕЙТ: ${s.winp}%\n🔥 СЕРИЯ: ${s.streak}\n🏓 ПОСЛЕДНИЕ 5 МАТЧЕЙ:\n${ml}\n⚔️ ИСТОРИЯ ВСТРЕЧ:\n${ht||'пока нет'}`;
const r=await fetch(WORKER_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:[{role:'system',content:sys},{role:'user',content:usr}],temperature:.7,max_tokens:900})});
if(!r.ok)throw new Error('API '+r.status);
const d=await r.json();if(d.error)throw new Error(d.error.message||JSON.stringify(d.error));
if(!d.choices||!d.choices[0]||!d.choices[0].message)throw new Error('Некорректный ответ сервера');
const txt=d.choices[0].message.content;box.textContent=txt;state.aiCache=state.aiCache||{};state.aiCache[ck]=txt;lsSet(LS_KEY,JSON.stringify(state));
}catch(e){box.innerHTML=`<span style="color:var(--red)">❌ ${esc(e.message)}</span>`;}
finally{btn.disabled=false;btn.innerHTML=orig;}}
