.diag-ico{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:13px;font-weight:800;background:rgba(255,255,255,.06);color:var(--mut)}
.diag-row.ok .diag-ico{background:var(--green-dim);color:var(--green)}
.diag-row.bad .diag-ico{background:var(--red-dim);color:var(--red)}
.diag-row.wait .diag-ico{background:rgba(58,169,255,.15);color:var(--blue)}
.diag-b{flex:1;min-width:0}
.diag-b b{display:block;font-size:13px}
.diag-b span{display:block;font-size:11.5px;color:var(--mut);margin-top:2px;word-break:break-word}
@media (max-width:420px){
.datechip{display:none}
.app{padding:0 10px calc(104px + env(safe-area-inset-bottom))}

.counter b{font-size:14px}.setin{height:40px;font-size:18px}

.pcard-av{width:140px;height:140px;margin-top:-74px}.pcard-av .ini{font-size:48px}.pcard-rate b{font-size:40px}
.pod-col.g .pod-base{height:74px}.pod-col.s .pod-base{height:54px}.pod-col.b .pod-base{height:42px}

.gmed{width:48px;height:48px;font-size:24px}
.alley-card{width:120px}

function cupHtml(cls){
const src=__cupSrc||CUP_FILE;
return`<img class="cup-img ${cls||''}" src="${esc(src)}" alt="Кубок клуба" onerror="this.style.display='none';var s=this.nextElementSibling;if(s)s.style.display='block'"><span class="cup-fb" style="display:none;width:100%;height:100%">${CUP_SVG}</span>`;}
function loadCup(){
const im=new Image();
im.onload=()=>{
try{
const c=document.createElement('canvas');c.width=im.naturalWidth;c.height=im.naturalHeight;
const g=c.getContext('2d');g.drawImage(im,0,0);
const d=g.getImageData(0,0,c.width,c.height),p=d.data;
let touched=false;
for(let i=0;i<p.length;i+=4){if(p[i]>232&&p[i+1]>232&&p[i+2]>232){p[i+3]=0;touched=true;}}
if(touched)g.putImageData(d,0,0);
__cupSrc=c.toDataURL('image/png');
}catch(e){__cupSrc=CUP_FILE;}
__cupReady=true;applyCup();};
im.onerror=()=>{__cupReady=true;__cupSrc=null;applyCup();};
im.src=CUP_FILE+'?v='+APP_VERSION;}
function applyCup(){
document.querySelectorAll('img.cup-img').forEach(img=>{
if(__cupSrc){if(img.getAttribute('src')!==__cupSrc)img.setAttribute('src',__cupSrc);img.style.display='';const fb=img.nextElementSibling;if(fb)fb.style.display='none';}
});}

function norm(s){
s=s||{};
s.settings=Object.assign({},DEF_SET,s.settings||{});
s.players=s.players||[];s.tournaments=s.tournaments||[];s.matches=s.matches||[];
s.awards=s.awards||[];s.playerCodes=s.playerCodes||{};s.trainings=s.trainings||[];s.aiCache=s.aiCache||{};
s.tournaments.forEach(t=>{t.playerIds=t.playerIds||[];t.playerState=t.playerState||{};t.archived=t.archived||[];t.teams=t.teams||[];if(!t.type)t.type='individual';});
s.matches.forEach(m=>{if(m.sets&&!Array.isArray(m.sets))m.sets=null;});
return s;}
function loadState(){try{const s=JSON.parse(lsGet(LS_KEY));if(s)return norm(s);}catch(e){}return null;}
function loadBackup(){try{const s=JSON.parse(lsGet(BAK_KEY));if(s)return norm(s);}catch(e){}return null;}
let state=loadState()||loadBackup()||norm({});
let ui={tab:'arena',tournamentId:null,playerId:null,ratingSort:'r',awardFilter:'all'};
const player=id=>state.players.find(p=>p.id===id);
const tourn=id=>state.tournaments.find(t=>t.id===id);
const pNameRaw=id=>{const p=player(id);return p?(p.firstName+' '+p.lastName):'—';};
const pShort=id=>{const p=player(id);return p?(p.lastName||p.firstName):'—';};

function fmtDateFull(d){const x=new Date((d||'2000-01-01')+'T12:00');return isNaN(x.getTime())?'—':x.toLocaleDateString('ru-RU',{weekday:'short'})+', '+x.getDate()+' '+MONF[x.getMonth()];}

function laurel(cx,cy,r,a0,a1,n,P,sc){
let s='';
const rad=d=>d*Math.PI/180;
const pt=a=>[cx+r*Math.cos(rad(a)),cy+r*Math.sin(rad(a))];
const [x0,y0]=pt(a0),[x1,y1]=pt(a1);
s+=`<path d="M${x0.toFixed(1)} ${y0.toFixed(1)} A${r} ${r} 0 0 ${a1>a0?1:0} ${x1.toFixed(1)} ${y1.toFixed(1)}" fill="none" stroke="${P.stem}" stroke-width="3.2" stroke-linecap="round" opacity=".95"/>`;
for(let i=0;i<n;i++){
const t=i/(n-1),a=a0+(a1-a0)*t,[x,y]=pt(a),k=sc*(1-.32*t);
s+=`<g transform="translate(${x.toFixed(1)},${y.toFixed(1)}) rotate(${(a+90).toFixed(1)})">
<ellipse cx="0" cy="${(-10*k).toFixed(1)}" rx="${(5.4*k).toFixed(1)}" ry="${(10.4*k).toFixed(1)}" fill="${P.l1}" stroke="${P.l2}" stroke-width="1.1" transform="rotate(-30)"/>

</g>`;}
return s;}

const toastMult=()=>({fast:1,normal:1.9,slow:3.2}[lsGet('toastSpeed')||'fast']||1);
function killToast(t){if(!t||!t.parentNode)return;clearTimeout(t.__tm);t.classList.remove('in');t.classList.add('out');setTimeout(()=>{if(t.parentNode)t.remove();},110);}
function clearToasts(){const r=$('#toast-root');if(r)r.querySelectorAll('.toast:not(.undo)').forEach(killToast);}
function toast(msg,type){const r=$('#toast-root');if(!r)return;
r.querySelectorAll('.toast:not(.undo)').forEach(t=>{clearTimeout(t.__tm);t.remove();});
const t=document.createElement('div');t.className='toast '+(type||'');t.textContent=msg;t.title='Нажмите, чтобы закрыть';
t.onclick=()=>killToast(t);r.appendChild(t);requestAnimationFrame(()=>t.classList.add('in'));
t.__tm=setTimeout(()=>killToast(t),Math.round((type==='err'?1600:950)*toastMult()));}
function pushUndo(label,fn){const r=$('#toast-root');if(!r)return;
r.querySelectorAll('.toast.undo').forEach(t=>{clearTimeout(t.__tm);t.remove();});
UNDO=fn;const t=document.createElement('div');t.className='toast undo';

function audioCtx(){if(!__actx){try{__actx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(__actx&&__actx.state==='suspended')__actx.resume().catch(()=>{});return __actx;}
function playSound(type){if(!soundOn())return;try{const a=audioCtx();if(!a)return;
const o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);const t=a.currentTime;
if(type==='matchEnd'){o.type='triangle';o.frequency.setValueAtTime(660,t);o.frequency.exponentialRampToValueAtTime(1320,t+.12);g.gain.setValueAtTime(.22,t);g.gain.exponentialRampToValueAtTime(.01,t+.5);o.start(t);o.stop(t+.5);}
else if(type==='msg'||type==='ring'){o.type='sine';o.frequency.setValueAtTime(988,t);o.frequency.setValueAtTime(1319,t+.12);g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.01,t+.35);o.start(t);o.stop(t+.35);}
else if(type==='ok'){o.type='sine';o.frequency.setValueAtTime(880,t);g.gain.setValueAtTime(.13,t);g.gain.exponentialRampToValueAtTime(.01,t+.18);o.start(t);o.stop(t+.2);}
else if(type==='warn'){o.type='square';o.frequency.setValueAtTime(300,t);g.gain.setValueAtTime(.09,t);g.gain.exponentialRampToValueAtTime(.01,t+.25);o.start(t);o.stop(t+.25);}
else{o.type='square';o.frequency.value=600;g.gain.setValueAtTime(.05,t);g.gain.exponentialRampToValueAtTime(.01,t+.05);o.start(t);o.stop(t+.06);}}catch(e){}}

function startBgAnim(cv){try{if(__bgRaf){cancelAnimationFrame(__bgRaf);__bgRaf=null;}
const ctx=cv.getContext('2d');if(!ctx)return;
const rs=()=>{cv.width=cv.clientWidth||innerWidth;cv.height=cv.clientHeight||innerHeight;};rs();addEventListener('resize',rs);
const t0=performance.now(),trail=[],ps=[];
for(let i=0;i<24;i++)ps.push({x:Math.random(),y:Math.random(),r:Math.random()*2.2+.8,s:Math.random()*.00016+.00005,p:Math.random()*6.28});

const T=4200,t=((now-t0)%T)/T,w=cv.width,h=cv.height,hue=210+Math.sin(now*.00025)*18;
const g=ctx.createLinearGradient(0,0,w,h);
g.addColorStop(0,`hsl(${hue} 45% 10%)`);g.addColorStop(.55,`hsl(${hue+14} 48% 15%)`);g.addColorStop(1,`hsl(${hue+30} 40% 9%)`);

const rg=ctx.createRadialGradient(w*.5,h*.42,10,w*.5,h*.42,Math.max(w,h)*.6);
rg.addColorStop(0,'rgba(255,139,31,.18)');rg.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=rg;ctx.fillRect(0,0,w,h);
ps.forEach(p=>{p.y-=p.s*16;p.p+=.02;if(p.y<-.05){p.y=1.05;p.x=Math.random();}
ctx.fillStyle=`rgba(255,255,255,${.06+.06*Math.sin(p.p)})`;ctx.beginPath();ctx.arc(p.x*w+Math.sin(p.p)*10,p.y*h,p.r,0,6.28);ctx.fill();});
ctx.strokeStyle='rgba(255,255,255,.3)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(w*.06,h*.66);ctx.lineTo(w*.94,h*.66);ctx.stroke();
const sw=Math.sin(t*6.28);
[[.16,-.5,'#e8452c',sw],[.84,.5,'#3aa9ff',-sw]].forEach(a=>{ctx.save();ctx.translate(w*a[0],h*.52+a[3]*h*.06);ctx.rotate(a[1]+a[3]*.25);

const bx=w*.16+w*.68*t,by=h*.5-Math.abs(Math.sin(t*9.42))*h*.22;trail.push({x:bx,y:by});if(trail.length>14)trail.shift();
trail.forEach((q,i)=>{ctx.fillStyle=`rgba(255,164,27,${i/trail.length*.35})`;ctx.beginPath();ctx.arc(q.x,q.y,Math.max(3,w*.012)*(i/trail.length),0,6.28);ctx.fill();});
ctx.fillStyle='#ffa41b';ctx.shadowColor='rgba(255,164,27,.85)';ctx.shadowBlur=20;ctx.beginPath();ctx.arc(bx,by,Math.max(6,w*.016),0,6.28);ctx.fill();ctx.shadowBlur=0;
__bgRaf=requestAnimationFrame(frame);}

function sha256(t){try{if(window.crypto&&crypto.subtle)return crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)).then(b=>Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join(''));}catch(e){}return Promise.resolve(fallbackHash(t));}
function fallbackHash(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return'fh'+Math.abs(h).toString(16);}
function failInfo(p){const u=parseInt(lsGet('topspin_lock_'+p)||'0');return Date.now()<u?{locked:true,left:Math.ceil((u-Date.now())/1000)}:{locked:false,left:0};}
function registerFail(p){const k='topspin_fail_'+p,n=parseInt(lsGet(k)||'0')+1;lsSet(k,String(n));if(n>=5){lsSet('topspin_lock_'+p,String(Date.now()+60000));lsSet(k,'0');}}
function resetFail(p){lsSet('topspin_fail_'+p,'0');lsSet('topspin_lock_'+p,'0');}
function formatPhone(p){if(!p)return'';p=String(p).replace(/[^\d+]/g,'');if(p[0]==='8'&&p.length===11)p='+7'+p.substring(1);if(p&&p[0]!=='+')p='+'+p;return p;}

function setsCountArr(s){let a=0,b=0,d=0;if(!s)return[a,b,d];

function standingsTeam(tid){const t=tourn(tid);if(!t||t.type!=='team'||!(t.teams||[]).length)return[];

const of=pid=>(t.teams||[]).find(x=>(x.playerIds||[]).indexOf(pid)>=0);
state.matches.filter(m=>m.tournamentId===tid&&matchFinished(m)).forEach(m=>{
const a=of(m.playerAId),b=of(m.playerBId);if(!a||!b||a.id===b.id)return;
const A=rows[a.id],B=rows[b.id],sc=setsCountArr(m.sets),bc=ballsCountArr(m.sets);
A.sw+=sc[0];A.sl+=sc[1];A.bw+=bc[0];A.bl+=bc[1];B.sw+=sc[1];B.sl+=sc[0];B.bw+=bc[1];B.bl+=bc[0];
if(sc[0]===sc[1]){A.d++;B.d++;A.pts+=PTS_DRAW;B.pts+=PTS_DRAW;return;}
if(sc[0]>sc[1]){A.w++;A.pts+=PTS_WIN;B.l++;B.pts+=PTS_LOSS;}else{B.w++;B.pts+=PTS_WIN;A.l++;A.pts+=PTS_LOSS;}});
return Object.values(rows).sort((a,b)=>b.pts-a.pts||((b.sw-b.sl)-(a.sw-a.sl))||a.name.localeCompare(b.name,'ru'));}
const levelOf=r=>r<250?'Новичок':r<450?'Любитель':r<700?'Разрядник':r<900?'КМС':'Мастер';
function levelInfo(r){
if(r<250)return{n:'Новичок',from:0,to:250,c1:'#5f7699',c2:'#31507e',ico:'🌱'};
if(r<450)return{n:'Любитель',from:250,to:450,c1:'#41e08d',c2:'#12855a',ico:'🏓'};
if(r<700)return{n:'Разрядник',from:450,to:700,c1:'#3aa9ff',c2:'#1e5bc4',ico:'⚡'};
if(r<900)return{n:'КМС',from:700,to:900,c1:'#a78bfa',c2:'#6d3fd4',ico:'🔥'};
return{n:'Мастер',from:900,to:null,c1:'#ffd166',c2:'#e0452c',ico:'👑'};}

/* ---------- ВРЕМЯ / СТАТУСЫ ---------- */
const startMs=t=>new Date((t.date||'2000-01-01')+'T'+(t.startTime||'00:00')+':00').getTime();
const endMs=t=>new Date((t.date||'2000-01-01')+'T'+(t.endTime||'23:59')+':00').getTime();
const trainingMs=tr=>new Date((tr.date||'2000-01-01')+'T'+(tr.time||'00:00')+':00').getTime();
const trainingIsPast=tr=>{const t=trainingMs(tr);return!t||isNaN(t)||t<Date.now()-14*864e5;};
function autoCloseCheck(){if(!booted||!isAdminMode)return;const n=Date.now();let ch=false;const closed=[];
state.tournaments.forEach(t=>{if(!t.closed&&t.date&&t.endTime&&n>endMs(t)&&!state.matches.some(m=>m.tournamentId===t.id&&matchLive(m))){t.closed=true;ch=true;closed.push(t.id);}});
if(ch){save();render();if(LIVE.tid)renderLive();closed.forEach(id=>speakTournamentFinish(id));}}
function tStatus(t){if(!t)return'finished';if(t.closed)return'finished';const n=Date.now();
if(n<startMs(t))return'upcoming';if(n<=endMs(t))return'live';return'finished';}
const statusChip=t=>`<span class="status-dot ${tStatus(t)}"></span>`;
function pState(t,pid){if(!t)return'active';if((t.archived||[]).indexOf(pid)>=0)return'removed';
const s=(t.playerState||{})[pid];return s==='paused'||s==='out'?s:'active';}
const isActive=(t,pid)=>!!t&&(t.playerIds||[]).indexOf(pid)>=0&&pState(t,pid)==='active';
const activeIds=t=>t?(t.playerIds||[]).filter(pid=>isActive(t,pid)):[];
const stateLabel=s=>s==='paused'?'Пауза':s==='out'?'Выбыл':s==='removed'?'Удалён':'Активен';
const wdl=r=>`${r.w}-${r.d||0}-${r.l}`;

/* ---------- НАГРАДЫ ---------- */
function computeAutoAwards(eng){eng=eng||engine();if(eng.__aw)return eng.__aw;
const awards=[],players=state.players||[];if(!players.length){eng.__aw=awards;return awards;}
const baseR=+state.settings.startRating||1000,S={};players.forEach(p=>{S[p.id]=playerStats(p.id,eng);});
const sorted=players.slice().sort((a,b)=>eng.R[b.id]-eng.R[a.id]);
if(sorted.length>=3){const md=['🥇','🥈','🥉'],tt=['Император рейтинга','Серебро рейтинга','Бронза рейтинга'];
for(let i=0;i<3;i++)awards.push({id:'auto_top'+(i+1)+'_'+sorted[i].id,playerId:sorted[i].id,title:tt[i],emoji:md[i],auto:true,sub:'Топ-'+(i+1)+' по рейтингу'});}
players.forEach(p=>{if(S[p.id].streak>=3)awards.push({id:'auto_streak_'+p.id,playerId:p.id,title:'Серия побед',emoji:'🔥',auto:true,sub:S[p.id].streak+' побед подряд'});});
let wr=null;players.forEach(p=>{const s=S[p.id];if(s.m>=5&&s.winp>=60&&(!wr||s.winp>wr.v))wr={p:p.id,v:s.winp};});
if(wr)awards.push({id:'auto_sniper_'+wr.p,playerId:wr.p,title:'Снайпер',emoji:'🎯',auto:true,sub:'Винрейт '+wr.v+'%'});
let mar=null;players.forEach(p=>{const s=S[p.id];const sets=s.sw+s.sl+s.sd;if(sets>=40&&(!mar||sets>mar.n))mar={p:p.id,n:sets};});
if(mar)awards.push({id:'auto_iron_'+mar.p,playerId:mar.p,title:'Железный марафон',emoji:'💪',auto:true,sub:mar.n+' сетов сыграно'});
let ris=null;players.forEach(p=>{if(S[p.id].m>=5){const g=eng.R[p.id]-baseR;if(!ris||g>ris.g)ris={p:p.id,g};}});
if(ris&&ris.g>0)awards.push({id:'auto_rising_'+ris.p,playerId:ris.p,title:'Восходящая звезда',emoji:'📈',auto:true,sub:'+'+ris.g+' к рейтингу'});
let gk=null;players.forEach(p=>{let w=0;const my=eng.R[p.id];eng.played.forEach(m=>{if(m.playerAId!==p.id&&m.playerBId!==p.id)return;const o=m.playerAId===p.id?m.playerBId:m.playerAId;if(eng.R[o]>my&&matchWinner(m)===p.id)w++;});if(w>=3&&(!gk||w>gk.w))gk={p:p.id,w};});
if(gk)awards.push({id:'auto_giant_'+gk.p,playerId:gk.p,title:'Гроза авторитетов',emoji:'👑',auto:true,sub:gk.w+' побед над сильнейшими'});
const tc={};(state.trainings||[]).forEach(tr=>(tr.participantIds||[]).forEach(pid=>{tc[pid]=(tc[pid]||0)+1;}));
let tf=null;players.forEach(p=>{const c=tc[p.id]||0;if(c>=5&&(!tf||c>tf.c))tf={p:p.id,c};});
if(tf)awards.push({id:'auto_training_'+tf.p,playerId:tf.p,title:'Тренировочный маньяк',emoji:'🏓',auto:true,sub:tf.c+' тренировок'});
const sv=state.awards||[];awards.forEach(a=>{const ex=sv.find(x=>x.auto&&x.title===a.title&&x.playerId===a.playerId);
a.date=(ex&&ex.date)?ex.date:new Date().toISOString().slice(0,10);});
eng.__aw=awards;return awards;}
const playerAwards=pid=>state.awards.filter(a=>a.playerId===pid);
function awardsFor(pid,eng){const out=playerAwards(pid).slice();
computeAutoAwards(eng).forEach(a=>{if(a.playerId===pid&&!out.some(x=>x.title===a.title))out.push(a);});return out;}
function syncAutoAwards(){if(!isAdminMode||!booted)return;try{const l=computeAutoAwards(engine());let ch=false;
l.forEach(a=>{if(!state.awards.some(x=>x.auto&&x.title===a.title&&x.playerId===a.playerId)){
state.awards.push({id:a.id,playerId:a.playerId,title:a.title,emoji:a.emoji,sub:a.sub,auto:true,date:a.date});ch=true;}});
if(ch)save();}catch(e){}}
function gloryCard(a){const p=player(a.playerId);
const mc=a.emoji==='🥇'?'g':a.emoji==='🥈'?'s':a.emoji==='🥉'?'b':'';
return`<div class="gcard ${mc} rise"><div class="gmed">${esc(a.emoji)}</div><div class="gbody">
<div class="gtitle">${esc(a.title)}${a.auto?'<span class="auto-badge">АВТО</span>':''}</div>

/* ---------- ПАРЫ ---------- */
const pairExists=(tid,a,b)=>state.matches.some(m=>m.tournamentId===tid&&((m.playerAId===a&&m.playerBId===b)||(m.playerAId===b&&m.playerBId===a)));
function matchQueue(tid){const t=tourn(tid);if(!t)return[];
return state.matches.filter(m=>m.tournamentId===tid&&!matchFinished(m)&&isActive(t,m.playerAId)&&isActive(t,m.playerBId))
.sort((a,b)=>(matchLive(b)?1:0)-(matchLive(a)?1:0)||(a.table||99)-(b.table||99)||(a.time||'99:99').localeCompare(b.time||'99:99'));}
function generatePairs(tid,mode){const t=tourn(tid);if(!t)return;const ids=activeIds(t);
if(ids.length<2){toast('Нужно минимум 2 активных участника','err');LIVE.tab='roster';renderLive();return;}
let added=0;
if(mode==='swiss'){const st=standings(tid),eng=engine();
const order=ids.slice().sort((a,b)=>{const ra=st.find(r=>r.pid===a),rb=st.find(r=>r.pid===b);
return((rb?rb.pts:0)-(ra?ra.pts:0))||(eng.R[b]-eng.R[a]);});
const used={};order.forEach(a=>{if(used[a])return;let partner=null;
for(let i=0;i<order.length;i++){const b=order[i];if(b===a||used[b])continue;if(!pairExists(tid,a,b)){partner=b;break;}}
if(!partner)for(let j=0;j<order.length;j++){const c=order[j];if(c!==a&&!used[c]){partner=c;break;}}
if(partner){used[a]=1;used[partner]=1;state.matches.push({id:uid(),tournamentId:tid,playerAId:a,playerBId:partner,time:'',table:(added%4)+1,sets:null,finished:false});added++;}});}
else if(mode==='random'){const pool=ids.slice();
for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
for(let k=0;k+1<pool.length;k+=2)if(!pairExists(tid,pool[k],pool[k+1])){
state.matches.push({id:uid(),tournamentId:tid,playerAId:pool[k],playerBId:pool[k+1],time:'',table:(k/2)%4+1,sets:null,finished:false});added++;}}
else{for(let a=0;a<ids.length;a++)for(let b=a+1;b<ids.length;b++)if(!pairExists(tid,ids[a],ids[b])){
state.matches.push({id:uid(),tournamentId:tid,playerAId:ids[a],playerBId:ids[b],time:'',table:0,sets:null,finished:false});added++;}}
if(added){save();LIVE.tab='queue';saveLiveView();renderLive();render();playSound('ok');toast('Создано пар: '+added,'ok');
pushNotify('🏓 Новые пары',t.name+' · создано пар: '+added,{type:'match',to:'all',fcm:false});}
else toast('Новых пар нет','err');}

function tableView(m){
const A=player(m.playerAId),B=player(m.playerBId),sc=setsCountArr(m.sets||[]);
const fin=matchFinished(m),live=matchLive(m),draw=fin&&!m.wo&&sc[0]===sc[1];
const started=matchStarted(m);
const badge=fin?(draw?'НИЧЬЯ':'ЗАВЕРШЁН'):live?'В ИГРЕ':(m.table?'СТОЛ '+m.table:'ОЖИДАНИЕ');
const bcls=fin?(draw?'draw':'done'):live?'live':'';
const srv=started?(sc[0]+sc[1]+sc[2])%2===0?'a':'b':'a';

h+='<div class="tt-edge"></div><div class="tt-surface"></div><div class="tt-lines"></div>';

h+='</div></div>';return h;}
function setsStrip(m){if(!hasSets(m))return'';
return'<div class="qsets">'+m.sets.map((s,i)=>{const a=+s[0],b=+s[1],c=a>b?'a':b>a?'b':'d';
return`<span class="qset ${c}" title="Сет ${i+1}">${a}:${b}</span>`;}).join('')+'</div>';}
const styleName=s=>({attack:'⚔️ атака',defense:'🛡 защита',universal:'⚖️ универсал'}[s||'universal']);
function matchCard(m,i,mode){
const fin=matchFinished(m),live=matchLive(m),sc=setsCountArr(m.sets||[]),w=fin?matchWinner(m):null,draw=fin&&!m.wo&&sc[0]===sc[1];
const A=player(m.playerAId),B=player(m.playerBId);
let head='<div class="mc-head">';
head+=mode==='done'?'<span>✅ Сыграно</span>':(live?'<b style="color:var(--red)">🔴 В игре</b>':(i===0?'<b style="color:var(--orange)">🔥 Следующий</b>':`<span>Пара ${i+1}</span>`));
if(m.table)head+=`<span class="tb">🪑 Стол ${m.table}</span>`;
if(m.time)head+=`<span>🕑 ${esc(m.time)}</span>`;
if(hasSets(m))head+=`<span>${m.sets.length} сетов</span>`;
head+=`<span class="st ${fin?(draw?'d':'f'):live?'l':'q'}">${fin?(draw?'ничья':'итог'):live?'● в игре':'ожидание'}</span></div>`;
const players=`<div class="mc-players">
<div class="mc-pl">${avatarHtml(A,'sm',false)}<span class="nm${w===m.playerAId?' win':''}">${esc(pNameRaw(m.playerAId))}<small>${esc(styleName(A&&A.playStyle))}</small></span></div>
<div class="mc-sc${draw?' draw':''}"><b>${sc[0]}:${sc[1]}</b><span>сеты</span></div>
<div class="mc-pl r"><span class="nm${w===m.playerBId?' win':''}">${esc(pNameRaw(m.playerBId))}<small>${esc(styleName(B&&B.playStyle))}</small></span>${avatarHtml(B,'sm',false)}</div></div>`;
let acts='<div class="qacts">';
if(mode==='done')acts+=`<button class="btn ghost sm" data-live="score" data-id="${esc(m.id)}">✎ Изменить счёт</button><button class="btn danger sm" data-live="clearScore" data-id="${esc(m.id)}">↺ Сбросить</button>`;
else{acts+=`<button class="btn ${live?'live':'primary'} sm" data-live="score" data-id="${esc(m.id)}">${live?'▶ Продолжить матч':'🏓 Ввести счёт'}</button>`;
acts+=`<button class="btn ghost sm" data-live="wo" data-id="${esc(m.id)}">🚫 Неявка</button><button class="btn ghost sm" data-live="table" data-id="${esc(m.id)}">🪑 Стол</button><button class="btn danger sm" data-live="delMatch" data-id="${esc(m.id)}">✕</button>`;}
acts+='</div>';
return`<div class="mcard ${mode==='done'?'done':live?'inplay':i===0?'next':''}">${head}${tableView(m)}${players}${setsStrip(m)}${acts}</div>`;}

const counts={all:all.length,active:act.length,paused:pau.length,out:out.length};
let h=`<div class="live-toolbar"><input type="text" id="liveSearch" placeholder="🔍 Поиск участника…" value="${esc(LIVE.q)}"><select id="liveSort"><option value="pts"${LIVE.sort==='pts'?' selected':''}>По очкам</option><option value="name"${LIVE.sort==='name'?' selected':''}>По имени</option><option value="rating"${LIVE.sort==='rating'?' selected':''}>По рейтингу</option><option value="order"${LIVE.sort==='order'?' selected':''}>По порядку</option></select></div>`;

h+='<div class="live-toolbar"><button class="btn ok xs" data-live="addAll">＋ Участник</button><button class="btn primary xs" data-live="goQueue">🏓 К матчам</button><button class="btn ghost xs" data-live="bulkPauseIdle">⏸ Пауза: без матчей</button><button class="btn ghost xs" data-live="activateAll">▶ Все активны</button></div>';
let list=all.filter(pid=>{const s=pState(t,pid);if(LIVE.filter!=='all'&&s!==LIVE.filter)return false;
if(LIVE.q&&pNameRaw(pid).toLowerCase().indexOf(LIVE.q.toLowerCase())<0)return false;return true;});

function initTrainings(){if(!dbRef)return;TRAIN_REF=firebase.database().ref('topspin/trainings');
TRAIN_REF.on('value',s=>{const d=s.val()||{},a=[];
Object.keys(d).forEach(k=>{const t=d[k];if(!t)return;t.id=k;a.push(t);});
state.trainings=a.filter(t=>!trainingIsPast(t));lsSet(LS_KEY,JSON.stringify(state));bumpData();
if(currentUser&&(ui.tab==='arena'||ui.tab==='profile'))render();});}
function trainingWrite(tr,cb){if(!TRAIN_REF){toast('Нет связи с сервером','err');return;}
TRAIN_REF.child(tr.id).set(tr).then(()=>{if(cb)cb();}).catch(()=>toast('Ошибка сохранения','err'));}

if(!TRAIN_REF&&dbRef)TRAIN_REF=firebase.database().ref('topspin/trainings');

const tr={date:d,time:tm,creatorId:cid,creatorPhone:myPhone(),participantIds:[cid],createdBy:cn,createdAt:Date.now()};
tr.id=TRAIN_REF.push().key;
trainingWrite(tr,()=>{closeModal();toast('Тренировка создана','ok');

function joinTraining(id){let me=getPlayerByPhone(myPhone());if(!me&&isAdminMode)me={id:'admin_club',firstName:'Админ'};
if(!me){toast('Создайте профиль','err');return;}
const tr=(state.trainings||[]).find(x=>x.id===id);if(!tr)return;
if((tr.participantIds||[]).indexOf(me.id)>=0){toast('Вы уже записаны','err');return;}
tr.participantIds=tr.participantIds||[];tr.participantIds.push(me.id);
trainingWrite(tr,()=>{toast('Вы записаны','ok');speakEncouragement(me.firstName,'ты записан на тренировку');});}
function leaveTraining(id){const me=getPlayerByPhone(myPhone()),tr=(state.trainings||[]).find(x=>x.id===id);if(!tr)return;
const cr=me&&(tr.creatorId===me.id||(tr.creatorPhone&&tr.creatorPhone===myPhone()));
if(me)tr.participantIds=(tr.participantIds||[]).filter(x=>x!==me.id);
if(cr||isAdminMode||!tr.participantIds.length)TRAIN_REF.child(id).remove().then(()=>toast('Тренировка удалена','ok'));
else trainingWrite(tr,()=>toast('Вы отписались','ok'));}
function adminDelTraining(id){if(!isAdminMode)return;
confirmBox('Удалить тренировку у всех?',()=>{TRAIN_REF.child(id).remove().then(()=>toast('Удалено','ok'));});}

function roundRobin(ids){const a=ids.slice();if(a.length%2)a.push(null);const n=a.length,r=[];
for(let i=0;i<n-1;i++){for(let j=0;j<n/2;j++){const x=a[j],y=a[n-1-j];if(x&&y)r.push(i%2?[y,x]:[x,y]);}
a.splice(1,0,a.pop());}return r;}
const addMinutes=(hm,m)=>{const p=(hm||'10:00').split(':'),t=(((+p[0])*60+(+p[1])+m)%1440+1440)%1440;
return p2(Math.floor(t/60))+':'+p2(t%60);};

async function analyzeGameStyle(pid){const btn=document.querySelector('.ai-btn-analyze'),box=$('#aiResponseBox');
if(!btn||!box)return;
const ck='ai_v9_'+pid+'_'+new Date().toISOString().slice(0,10);
if(state.aiCache&&state.aiCache[ck]){box.style.display='block';box.textContent=state.aiCache[ck];return;}
const orig=btn.innerHTML;btn.disabled=true;btn.innerHTML='<span class="ai-loading"></span> Анализ…';
box.style.display='block';box.textContent='Собираю статистику по сетам…';
try{const eng=engine(),s=playerStats(pid,eng),p=player(pid);if(!p)throw new Error('Игрок не найден');
const my=eng.played.filter(m=>m.playerAId===pid||m.playerBId===pid);
if(!my.length)throw new Error('Пока нет завершённых матчей');
const ml=my.slice(-6).map(m=>{const isA=m.playerAId===pid,o=isA?m.playerBId:m.playerAId,sc=setsCountArr(m.sets),tie=sc[0]===sc[1];
return`${tie?'🤝 Ничья':(matchWinner(m)===pid?'✅ Победа':'❌ Поражение')} против ${pNameRaw(o)} · ${(isA?sc[0]:sc[1])}:${(isA?sc[1]:sc[0])} · мячи ${(m.sets||[]).map(x=>isA?x[0]+':'+x[1]:x[1]+':'+x[0]).join(', ')}`;}).join('\n');
const sys='Ты — личный тренер по НАСТОЛЬНОМУ ТЕННИСУ. Говори "стол" и "партия". Обращайся на "ты". Формат: свободное число сетов, ничья допустима. Ответ: 1) ОБЩИЙ АНАЛИЗ; 2) ТАКТИКА ПРОТИВ 2 СОПЕРНИКОВ. Максимум 220 слов, с эмодзи.';
const usr='ИГРОК: '+p.firstName+' '+p.lastName+'\nРЕЙТИНГ: '+eng.R[pid]+' · '+s.w+'В '+s.l+'П · сеты '+s.sw+':'+s.sl+'\nМАТЧИ:\n'+ml;
const r=await fetch(WORKER_URL,{method:'POST',headers:{'Content-Type':'application/json'},
body:JSON.stringify({messages:[{role:'system',content:sys},{role:'user',content:usr}],temperature:.7,max_tokens:900})});
if(!r.ok)throw new Error('API '+r.status);
const d=await r.json();if(!d.choices||!d.choices[0])throw new Error('Некорректный ответ');
const txt=d.choices[0].message.content;box.textContent=txt;state.aiCache[ck]=txt;lsSet(LS_KEY,JSON.stringify(state));
}catch(e){box.innerHTML=`<span style="color:var(--red)">❌ ${esc(e.message)}</span>`;}
finally{btn.disabled=false;btn.innerHTML=orig;}}

pushNotify('🏁 Турнир завершён',t.name,{type:'tournament'});
speakTournamentFinish(id);});}break;
case'reopen':{const t=tourn(id);if(t){t.closed=false;save();closeModal();render();toast('Турнир открыт','ok');}}break;
case'addParticipant':addParticipantModal(tid);break;
case'pickParticipant':pickParticipant(tid,id);break;
case'unregisterFromTournament':unregisterFromTournament(tid);break;
case'registerToTournament':registerToTournament(tid);break;
case'saveMatch':saveMatch(tid,id||null);break;
case'delMatch':delMatch(id);break;
case'addSet':addSetRow(1);break;
case'addSets3':addSetRow(3);break;
case'addSets5':addSetRow(5);break;
case'clearSets':clearAllSets();break;
case'rmSet':el.closest('.setrow').remove();renumberSets();resultPreview();break;
case'toggleFinish':{__finTouched=true;const c=$('#mFinished');if(c)c.checked=!c.checked;resultPreview();}break;
case'saveResult':saveResult(false);break;
case'finishResult':saveResult(true);break;
case'clearResult':clearResult();break;
case'woFromResult':__rmid=id;woModal(id);break;
case'woPick':{const m=state.matches.find(x=>x.id===id);if(!m)break;const pid=el.dataset.pid;
m.sets=(m.playerBId===pid)?[[0,11],[0,11],[0,11]]:[[11,0],[11,0],[11,0]];
m.wo=true;m.woWinner=pid;m.finished=true;
if(!m.time)m.time=p2(new Date().getHours())+':'+p2(new Date().getMinutes());
save();playSound('warn');closeModal();afterMatchEdit();toast('Неявка: победа '+pNameRaw(pid),'ok');}break;
case'setTable':{const m=state.matches.find(x=>x.id===id);if(m){m.table=+el.dataset.n;save();tableModal(id);afterMatchEdit();}}break;
case'saveTableTime':{const m=state.matches.find(x=>x.id===id);if(m){const t=val('#mtTime');if(t)m.time=t;
save();closeModal();afterMatchEdit();toast('Сохранено','ok');}}break;
case'openPlayer':openPlayer(id);break;
case'backPlayers':ui.playerId=null;render();break;
case'backTournaments':ui.tournamentId=null;render();break;
case'sortR':ui.ratingSort='r';render();break;
case'sortW':ui.ratingSort='w';render();break;
case'newAward':awardModal();break;
case'filterAwards':ui.awardFilter=el.dataset.type;render();break;
case'emo':__emo=el.dataset.emo;document.querySelectorAll('.emopt').forEach(b=>b.classList.toggle('on',b===el));break;
case'saveAward':saveAward();break;
case'delAward':delAward(id);break;
case'saveSettings':saveSettings();break;
case'showRules':showClubRules();break;
case'exportAllData':exportAllData();break;
case'copyBackup':copyBackup();break;
case'downloadBackup':downloadBackupJSON();break;
case'importData':$('#impFile').click();break;
case'demo':loadDemo();break;
case'resetAll':resetAll();break;
case'closeModal':closeModal();break;
case'confirmYes':{const cb=__cb;__cb=null;closeModal();if(cb)cb();}break;
case'createProfile':createProfileModal();break;
case'saveProfile':saveProfile();break;
case'editMyProfile':__formCache=null;editMyProfileModal();break;
case'saveMyProfile':saveMyProfile();break;
case'setPlayStyle':window.__pendingStyle=el.dataset.style;
document.querySelectorAll('[data-action="setPlayStyle"]').forEach(b=>b.classList.toggle('on',b.dataset.style===el.dataset.style));break;
case'aiAnalyze':analyzeGameStyle(id);break;
case'enablePush':enablePush();break;
case'forceSave':forceSave();closeModal();break;
case'openHistory':openHistoryModal();break;
case'openHistoryDetail':showHistoryDetail(id);break;
case'pickTourType':{const ty=el.dataset.type;$('#tType').value=ty;
$('#typeInd').className='btn '+(ty==='individual'?'primary':'ghost');
$('#typeTeam').className='btn '+(ty==='team'?'primary':'ghost');}break;
case'manageTeams':manageTeamsModal(tid);break;
case'addTeam':teamModal(tid,null);break;
case'editTeam':teamModal(tid,id);break;
case'saveTeam':{const t=tourn(tid);if(!t)break;
const n=val('#tmName').trim(),pk=(window.__teamPicked||[]).slice();
if(!n){toast('Введите название','err');break;}
if(!pk.length){toast('Выберите игроков','err');break;}
t.teams=t.teams||[];
if(id){const tm=t.teams.find(x=>x.id===id);if(tm){tm.name=n;tm.playerIds=pk;}}
else t.teams.push({id:uid(),name:n,playerIds:pk});
save();manageTeamsModal(tid);render();toast('Команда сохранена','ok');}break;
case'delTeam':{const t=tourn(tid);if(t)confirmBox('Удалить команду?',()=>{
t.teams=(t.teams||[]).filter(x=>x.id!==id);save();manageTeamsModal(tid);render();});}break;
case'toggleTeamPlayer':{const pid=el.dataset.pid,arr=(window.__teamPicked||[]).slice(),i=arr.indexOf(pid);
if(i>=0)arr.splice(i,1);else arr.push(pid);window.__teamPicked=arr;const on=i<0;
el.classList.toggle('picker-picked',on);const r=el.querySelector('.rt');
if(r){r.textContent=on?'✓ выбран':'выбрать';r.style.color=on?'var(--green)':'var(--dim)';}}break;
}}

$('#appVersionDisplay').textContent='ТОП-СПИН · версия '+av;}catch(e){}

bind('adminEmail',e=>{if(e.key==='Enter')adminLogin();},'keydown');
bind('impFile',function(){importFile(this);},'change');
document.addEventListener('click',e=>{
const av=e.target.closest?e.target.closest('[data-avatar-src]'):null;
if(av&&!av.dataset.action){const s=av.getAttribute('data-avatar-src');
if(s){e.preventDefault();e.stopPropagation();openLightbox(s);return;}}
const el=e.target.closest?e.target.closest('[data-action]'):null;

document.addEventListener('change',e=>{if(e.target&&e.target.id==='mFinished'){__finTouched=true;resultPreview();}});
}
init();
