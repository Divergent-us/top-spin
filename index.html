
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1424">
<title>ТОП-СПИН — центр турниров</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Golos+Text:wght@400;500;600;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#0a1424;--bg2:#0e1c31;--panel:#132238;--panel2:#182b46;--line:#24395a;--line2:#31507e;--txt:#eaf2ff;--mut:#8ea6c8;--dim:#5f7699;--orange:#ff8b1f;--orange2:#ffb35c;--ball:#ffa41b;--blue:#3aa9ff;--green:#41e08d;--red:#ff5f6b;--gold:#ffd166;--silver:#cfd8e3;--bronze:#e0a06c;--rad:14px;--fd:'Russo One',system-ui,sans-serif;--fb:'Golos Text',system-ui,sans-serif}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:var(--fb);color:var(--txt);background:var(--bg);min-height:100vh;overflow-x:hidden;touch-action:manipulation;-webkit-text-size-adjust:100%}
body.locked{overflow:hidden}
.bg-table{position:fixed;left:50%;top:56%;transform:translate(-50%,-50%);width:min(94vw,560px);color:#fff;opacity:.05;z-index:-1;pointer-events:none;stroke:currentColor;fill:none;stroke-width:2.5}
body.light .bg-table{color:#0a1424;opacity:.07}
body.light{--bg:#f5f7fa;--bg2:#e8ecf1;--panel:#fff;--panel2:#f0f4f8;--line:#d1d9e0;--line2:#b8c4d0;--txt:#1a2332;--mut:#4a5a6a;--dim:#8a96a6}
body.light .topbar{background:rgba(245,247,250,.9)}
body.light .tabbar{background:rgba(245,247,250,.95)}
body.light input,body.light select{background:#fff;color:var(--txt)}
body.light .card,body.light .sheet,body.light .counter,body.light .stat,body.light .trow,body.light .prow,body.light .mrow,body.light .setin,body.light .tally{background:var(--panel)}
body.light .toast{background:#fff;color:var(--txt)}
.login-screen{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:20px;overflow-y:auto}
.login-card{max-width:400px;width:100%;background:linear-gradient(180deg,#152741,#111f36);border:1px solid var(--line);border-radius:20px;padding:30px;text-align:center}
.login-logo{width:80px;height:80px;margin:0 auto 16px}
.login-title{font-family:var(--fd);font-size:24px;margin-bottom:8px}
.login-sub{color:var(--mut);font-size:14px;margin-bottom:24px}
.login-step{display:none}.login-step.active{display:block}
.login-label{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:16px 0 6px;text-align:left}
.login-input{width:100%;font-family:var(--fb);font-size:16px;color:var(--txt);background:#0d1a2d;border:1px solid var(--line);border-radius:10px;padding:14px 12px;outline:none;text-align:center;letter-spacing:2px}
.login-btn{width:100%;margin-top:20px;font-family:var(--fb);font-weight:800;font-size:15px;color:#241203;background:linear-gradient(180deg,#ffa14a,#ff7d12);border:none;border-radius:11px;padding:14px;cursor:pointer}
.login-btn.secondary{background:transparent;color:var(--mut);box-shadow:none;margin-top:10px}
.login-error{color:var(--red);font-size:13px;margin-top:12px;min-height:20px;word-break:break-word}
.login-hint{color:var(--dim);font-size:12px;margin-top:12px;line-height:1.6}
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:8px;max-width:540px;margin:0 auto;width:100%;padding:10px 14px 8px;background:rgba(10,20,36,.85);flex-wrap:wrap}
.app{max-width:540px;margin:0 auto;padding:0 14px 110px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;cursor:pointer}
.logo{width:44px;height:44px;flex:none;filter:drop-shadow(0 4px 12px rgba(255,139,31,.35))}
.brand h1{font-family:var(--fd);font-size:19px;letter-spacing:.06em;line-height:1}
.brand h1 em{font-style:normal;color:var(--orange)}
.brand small{display:block;color:var(--mut);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;margin-top:3px}
.topbar-right{display:flex;flex-direction:column;align-items:flex-end;gap:3px;margin-left:auto}
.datechip{font-size:11.5px;font-weight:600;color:var(--mut);border:1px solid var(--line);border-radius:999px;padding:4px 10px;white-space:nowrap}
.sync-indicator{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:600;color:var(--mut);padding:2px 8px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.sync-indicator.synced{color:var(--green)}
.sync-indicator.error{color:var(--red)}
.sync-dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.iconbtn{width:38px;height:38px;flex:none;display:grid;place-items:center;cursor:pointer;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:11px;color:var(--mut)}
.iconbtn svg{width:19px;height:19px}
.card{background:linear-gradient(180deg,#152741,#111f36);border:1px solid var(--line);border-radius:var(--rad);padding:16px;position:relative}
.row-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.row-actions .btn{flex:1;justify-content:center}
.btn{display:inline-flex;align-items:center;gap:7px;justify-content:center;font-family:var(--fb);font-weight:800;font-size:14px;color:var(--txt);border:none;cursor:pointer;border-radius:11px;padding:11px 16px;user-select:none}
.btn[disabled]{opacity:.55;cursor:not-allowed;filter:grayscale(.55)}
.btn.primary{background:linear-gradient(180deg,#ffa14a,#ff7d12);color:#241203}
.btn.ghost{background:rgba(255,255,255,.04);border:1px solid var(--line2);font-weight:600}
.btn.danger{background:rgba(255,95,107,.12);border:1px solid rgba(255,95,107,.45);color:var(--red)}
.btn.sm{padding:7px 12px;font-size:12.5px}.btn.w100{width:100%}
.mut{color:var(--mut)}.dim{color:var(--dim)}.small{font-size:12px}
.sec-title{font-family:var(--fd);font-size:14px;letter-spacing:.12em;text-transform:uppercase;display:flex;align-items:center;gap:9px;margin:22px 2px 11px}
.sec-title .cnt{margin-left:auto;font-family:var(--fb);font-size:11px;font-weight:700;color:var(--dim)}
.status-dot{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:middle}
.status-dot.live{background:var(--green)}
.status-dot.upcoming{background:var(--blue)}
.status-dot.finished{background:var(--orange)}
.delta{font-weight:800;font-size:12px;padding:2px 8px;border-radius:7px;white-space:nowrap}
.delta.up{color:var(--green)}.delta.down{color:var(--red)}
.avatar{width:42px;height:42px;flex:none;border-radius:12px;display:grid;place-items:center;font-family:var(--fd);font-size:15px;color:#0a1424;overflow:hidden;background:#0d1a2d}
.avatar.lg{width:64px;height:64px;font-size:23px;border-radius:16px}
.avatar.xl{width:72px;height:72px;font-size:26px;border-radius:50%}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
input,select,textarea{width:100%;font-family:var(--fb);font-size:15px;color:var(--txt);background:#0d1a2d;border:1px solid var(--line);border-radius:10px;padding:11px 12px;outline:none}
select{appearance:none}
input[type=file]{padding:8px 10px;font-size:13px}
label{display:block;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:13px 0 6px}
.frm2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hero{overflow:hidden;border-top:1px solid rgba(255,139,31,.35)}
.hero .kick{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.hero h2{font-family:var(--fd);font-size:23px;margin-bottom:6px}
.hero .meta{color:var(--mut);font-size:13px;margin-bottom:14px;display:flex;gap:8px;flex-wrap:wrap}
.count{font-family:var(--fd);font-size:34px;color:var(--ball);margin:2px 0 4px}
.count-lbl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:700}
.winner-line{margin-top:8px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);font-weight:700}
.winner-line span{display:block;font-family:var(--fd);font-size:26px;text-transform:none;color:var(--gold);margin-top:4px}
.winner-banner{margin-top:12px;text-align:center;padding:14px;border-radius:14px;background:rgba(255,209,102,.1);border:1px solid rgba(255,209,102,.45);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:800}
.wb-name{font-family:var(--fd);font-size:26px;text-transform:none;color:var(--gold);margin-top:6px}
.counters{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.counter{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 3px;text-align:center}
.counter b{display:block;font-family:var(--fd);font-size:16px;color:var(--orange2)}
.counter span{font-size:9px;text-transform:uppercase;color:var(--dim);font-weight:700}
.podium{display:flex;align-items:flex-end;gap:8px;padding-top:4px}
.pod{flex:1;min-width:0;text-align:center}
.pod-photo{width:100%;max-width:70px;height:72px;margin:0 auto 6px;border-radius:10px;overflow:hidden;border:2px solid rgba(255,255,255,.28);background:#0d1a2d}
.pod-photo img{width:100%;height:100%;object-fit:cover;display:block}
.pod-photo .ini{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-size:20px;color:#0a1424}
.pod.p1 .pod-photo{border-color:var(--gold)}
.pod.p2 .pod-photo{border-color:var(--silver)}
.pod.p3 .pod-photo{border-color:var(--bronze)}
.pod .bar{border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-size:15px}
.pod.p1 .bar{height:56px;background:#2a2416;border:1px solid rgba(255,209,102,.55);color:var(--gold)}
.pod.p2 .bar{height:42px;background:#20262e;border:1px solid rgba(207,216,227,.4);color:var(--silver)}
.pod.p3 .bar{height:32px;background:#241a12;border:1px solid rgba(224,160,108,.4);color:var(--bronze)}
.pod-name{margin-top:6px;font-size:13px;font-weight:800;line-height:1.25;word-break:break-word}
.pod-awards{margin-top:5px;font-size:17px;letter-spacing:3px;line-height:1.2;min-height:0}
.mover{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid rgba(36,57,90,.55);font-size:13.5px}
.mover:last-child{border-bottom:none}
.mover small{display:block;color:var(--dim);font-size:10.5px;margin-top:2px}
.list{display:flex;flex-direction:column;gap:9px}
.trow,.prow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:linear-gradient(180deg,#152741,#111f36);border:1px solid var(--line);border-radius:var(--rad);padding:13px;cursor:pointer;color:var(--txt);font-family:var(--fb)}
.datebox{flex:none;width:52px;text-align:center;background:#0d1a2d;border:1px solid var(--line);border-radius:11px;padding:7px 4px}
.datebox b{display:block;font-family:var(--fd);font-size:20px;color:var(--orange2)}
.datebox span{font-size:10px;text-transform:uppercase;color:var(--dim)}
.trow .info,.prow .info{flex:1;min-width:0}
.trow .nm,.prow .nm{font-weight:800;font-size:15px}
.trow .sub,.prow .sub{color:var(--mut);font-size:12px;margin-top:3px;display:flex;gap:6px;flex-wrap:wrap}
.prow .rat{font-family:var(--fd);font-size:19px;color:var(--ball)}
.rise{animation:rise .45s both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.empty{text-align:center;padding:38px 20px;border:1.5px dashed var(--line2);border-radius:var(--rad);color:var(--mut)}
.empty .big{font-size:40px;margin-bottom:10px}.empty b{display:block;color:var(--txt);font-size:16px;margin-bottom:5px}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:10px;text-transform:uppercase;color:var(--dim);padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px 8px;border-bottom:1px solid rgba(36,57,90,.5)}
.tbl .rk{font-family:var(--fd);width:30px}
.tbl .nm{font-weight:700;cursor:pointer}
.tbl td.num{text-align:right;color:var(--mut)}
.seg{display:inline-flex;background:#0d1a2d;border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px;margin-bottom:12px}
.seg button{border:none;background:transparent;color:var(--mut);font-weight:700;font-size:12.5px;padding:7px 14px;border-radius:8px;cursor:pointer}
.seg button.on{background:var(--orange);color:#241203}
.backlink{display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:var(--mut);font-weight:700;font-size:13px;cursor:pointer;padding:8px 0;margin:4px 0 8px}
.ptags{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.ptag{display:inline-flex;align-items:center;gap:7px;background:#0d1a2d;border:1px solid var(--line2);border-radius:999px;padding:4px 8px 4px 4px;font-size:13px}
.ptag .pmini{width:26px;height:26px;border-radius:50%;overflow:hidden;display:grid;place-items:center;flex:none}
.ptag .pmini img{width:100%;height:100%;object-fit:cover}
.ptag button{background:none;border:none;color:var(--dim);cursor:pointer}
.ptag.add{border:1.5px dashed var(--orange);color:var(--orange2);cursor:pointer;padding:6px 12px}
.add-actions{display:flex;gap:8px;margin-top:12px}
.mrow{display:flex;align-items:center;gap:10px;background:#0f1e33;border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer;width:100%;text-align:left;color:var(--txt);font-family:var(--fb)}
.mrow .tm{flex:none;font-family:var(--fd);font-size:13px;color:var(--blue);border:1px solid rgba(58,169,255,.3);border-radius:8px;padding:6px 8px;text-align:center}
.mrow .pl{flex:1;min-width:0;font-size:13.5px;font-weight:600}
.mrow .pl span{display:block}
.mrow .sc{font-family:var(--fd);font-size:19px;color:var(--ball)}
.mrow .st{font-size:11px;color:var(--dim);font-weight:700}
.vshead{display:grid;grid-template-columns:46px 1fr 40px 1fr 34px;gap:10px;align-items:center;margin-bottom:18px}
.vshead .side{font-weight:800;font-size:15px;text-align:center}
.vshead .vs{font-family:var(--fd);color:var(--orange);text-align:center}
.setrow{display:grid;grid-template-columns:46px 1fr 40px 1fr 34px;gap:10px;align-items:center;margin-bottom:14px}
.setlabel{font-size:11px;font-weight:800;text-transform:uppercase;color:var(--dim);text-align:center}
.setin{width:100%;height:66px;text-align:center;font-family:var(--fd);font-size:30px;border-radius:14px;border-width:2px}
.setin.win{border-color:var(--green);color:var(--green)}
.colon{font-family:var(--fd);color:var(--orange);font-size:28px;text-align:center}
.setrow .rm{width:34px;height:34px;border-radius:10px}
.tally{display:flex;align-items:center;justify-content:center;gap:20px;background:#0d1a2d;border:2px solid var(--line2);border-radius:16px;padding:18px;margin:18px 0}
.tally .n{font-family:var(--fd);font-size:42px;color:var(--ball)}
.tally .sep{color:var(--dim);font-family:var(--fd);font-size:30px}
.tally .who{font-size:13px;color:var(--mut);max-width:110px;text-align:center;font-weight:700}
.rprev{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(540px,100%);z-index:50;display:flex;gap:4px;padding:8px 10px calc(9px + env(safe-area-inset-bottom));background:rgba(11,20,36,.92);border-top:1px solid var(--line)}
.tabbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;color:var(--dim);font-family:var(--fb);font-size:10px;font-weight:700;cursor:pointer;padding:7px 2px;border-radius:11px}
.tabbtn svg{width:22px;height:22px}.tabbtn.on{color:var(--orange)}
#modal-root{position:fixed;inset:0;z-index:90;display:none;align-items:flex-end;justify-content:center;pointer-events:none}
.backdrop{position:absolute;inset:0;background:rgba(4,9,18,.7)}
.sheet{position:relative;width:min(540px,100%);max-height:92vh;overflow-y:auto;background:linear-gradient(180deg,#17293f,#101d31);border:1px solid var(--line2);border-radius:20px 20px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom))}
.sheet h3{font-family:var(--fd);font-size:18px;margin-bottom:4px}
.sheet .grab{width:44px;height:4px;border-radius:2px;background:var(--line2);margin:0 auto 15px}
.emorow{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px}
.emopt{width:42px;height:42px;font-size:20px;display:grid;place-items:center;cursor:pointer;background:#0d1a2d;border:1.5px solid var(--line);border-radius:11px}
.emopt.on{border-color:var(--orange)}
.awrow{display:flex;align-items:center;gap:11px;padding:11px 2px;border-bottom:1px solid rgba(36,57,90,.5)}
.awrow .em{font-size:26px;flex:none;width:36px;text-align:center}
.awrow .tt{font-weight:800;font-size:14px}.awrow .sub{font-size:12px;color:var(--mut)}
.awrow .del{margin-left:auto}
#toast-root{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;z-index:120;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(440px,92%);pointer-events:none}
.toast{background:#1c2c45;border:1px solid var(--line2);color:var(--txt);font-size:13.5px;font-weight:600;padding:11px 18px;border-radius:12px;opacity:0;transform:translateY(14px);transition:.3s;text-align:center}
.toast.in{opacity:1;transform:none}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:#0f1e33;border:1px solid var(--line);border-radius:11px;padding:11px 6px;text-align:center}
.stat b{display:block;font-family:var(--fd);font-size:18px}
.stat span{font-size:10px;text-transform:uppercase;color:var(--dim);font-weight:700}
.av-preview{width:90px;height:90px;border-radius:50%;overflow:hidden;background:#0d1a2d;border:2px dashed var(--line2);display:grid;place-items:center;margin:8px 0 4px;position:relative}
.av-preview img{width:100%;height:100%;object-fit:cover}
.av-preview .del-av{position:absolute;top:-6px;right:-6px;width:28px;height:28px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;cursor:pointer;font-size:14px}
.picker-list{display:flex;flex-direction:column;gap:6px;max-height:50vh;overflow-y:auto;margin-top:8px}
.picker-item{display:flex;align-items:center;gap:10px;background:#0d1a2d;border:1px solid var(--line);border-radius:11px;padding:9px 11px;cursor:pointer}
.picker-item .nm{flex:1;font-weight:700;font-size:14px}
.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.toggle-row{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:10px;margin:8px 0;cursor:pointer}
.toggle-row input{width:auto}
.toggle-row span{flex:1;font-weight:600}
.profile-card{display:flex;align-items:center;gap:14px;background:linear-gradient(180deg,#152741,#111f36);border:1px solid var(--line);border-radius:var(--rad);padding:20px;margin-bottom:16px}
.profile-info{flex:1}.profile-name{font-family:var(--fd);font-size:20px;margin-bottom:4px}
.profile-phone{color:var(--mut);font-size:12px;margin-bottom:8px}
.profile-rating-num{font-family:var(--fd);font-size:24px;color:var(--ball)}
.tournament-register-item{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:var(--rad);padding:14px;margin-bottom:9px}
.tournament-register-info{flex:1}.tournament-register-name{font-weight:700;font-size:15px}
.tournament-register-meta{color:var(--mut);font-size:12px;margin-top:4px;display:flex;gap:6px;flex-wrap:wrap}
.settings-info{background:rgba(255,139,31,.08);border:1px solid rgba(255,139,31,.2);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:12px;color:var(--mut)}
.code-item{display:flex;align-items:center;gap:10px;background:#0d1a2d;border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin-bottom:8px}

var firebaseConfig={apiKey:"AIzaSyBBfeMqpQe5D6-W3QzuX6Q5PHZdmm5FtD8",authDomain:"top-spin-3ef01.firebaseapp.com",databaseURL:"https://top-spin-3ef01-default-rtdb.europe-west1.firebasedatabase.app",projectId:"top-spin-3ef01",storageBucket:"top-spin-3ef01.firebasestorage.app",messagingSenderId:"939869281373",appId:"1:939869281373:web:5b7fe5304f7052489401b4",measurementId:"G-WC9JD17E9N"};
var firebaseApp=null,dbRef=null,authRef=null,isSyncingFromFirebase=false,currentUser=null,isAdminMode=false,booted=false;
function initFirebase(){try{firebaseApp=firebase.initializeApp(firebaseConfig);dbRef=firebase.database().ref('topspin/data');authRef=firebase.auth();return true;}catch(e){return false;}}
function norm(s){s=s||{};s.settings=Object.assign({},DEF_SET,s.settings||{});s.players=s.players||[];s.tournaments=s.tournaments||[];s.matches=s.matches||[];s.awards=s.awards||[];s.playerCodes=s.playerCodes||{};return s;}
function weight(s){if(!s)return 0;return (s.players?s.players.length:0)*3+(s.tournaments?s.tournaments.length:0)*2+(s.matches?s.matches.length:0)+(s.awards?s.awards.length:0);}

var pNameRaw=function(id){var p=player(id);return p?(p.firstName+' '+p.lastName):'—';};
var MON=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
var MONF=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
function fmtDate(d){var x=new Date(d+'T12:00');return x.getDate()+' '+MONF[x.getMonth()];}
function fmtDateFull(d){var x=new Date(d+'T12:00');return x.toLocaleDateString('ru-RU',{weekday:'short'})+', '+x.getDate()+' '+MONF[x.getMonth()];}
function avColor(id){var h=0,s=String(id);for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))%360;return'linear-gradient(135deg,hsl('+h+' 75% 62%),hsl('+((h+40)%360)+' 70% 48%))';}
function initials(p){return((p.firstName[0]||'')+(p.lastName[0]||'')).toUpperCase();}
function avatarHtml(p,size){size=size||'reg';var cls=size==='lg'?'avatar lg':size==='xl'?'avatar xl':'avatar';if(p&&p.avatar)return'<div class="'+cls+'"><img src="'+p.avatar+'" alt=""></div>';return'<div class="'+cls+'" style="background:'+avColor(p?p.id:'x')+'">'+(p?initials(p):'?')+'</div>';}
function miniAvatar(p){if(p&&p.avatar)return'<span class="pmini"><img src="'+p.avatar+'" alt=""></span>';return'<span class="pmini" style="background:'+avColor(p?p.id:'x')+'">'+(p?initials(p):'?')+'</span>';}
function podPhoto(p){return'<div class="pod-photo">'+(p.avatar?'<img src="'+p.avatar+'" alt="">':'<span class="ini" style="background:'+avColor(p.id)+'">'+initials(p)+'</span>')+'</div>';}
function playerAwards(pid){return state.awards.filter(function(a){return a.playerId===pid;});}
function compressImage(file,cb){var r=new FileReader();r.onload=function(e){var img=new Image();img.onload=function(){var mW=200,mH=200,w=img.width,h=img.height;if(w>mW){h=h*mW/w;w=mW;}if(h>mH){w=w*mH/h;h=mH;}var c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);cb(c.toDataURL('image/jpeg',0.85));};img.onerror=function(){};img.src=e.target.result;};r.readAsDataURL(file);}
function playSound(type){if(lsGet('soundEnabled')==='false')return;try{var a=new(window.AudioContext||window.webkitAudioContext)();var o=a.createOscillator();var g=a.createGain();o.connect(g);g.connect(a.destination);if(type==='setEnd'){o.frequency.value=880;o.type='sine';g.gain.setValueAtTime(0.3,a.currentTime);g.gain.exponentialRampToValueAtTime(0.01,a.currentTime+0.3);o.start(a.currentTime);o.stop(a.currentTime+0.3);}else if(type==='matchEnd'){o.frequency.setValueAtTime(523,a.currentTime);o.frequency.setValueAtTime(659,a.currentTime+0.15);o.frequency.setValueAtTime(784,a.currentTime+0.3);o.type='sine';g.gain.setValueAtTime(0.35,a.currentTime);g.gain.exponentialRampToValueAtTime(0.01,a.currentTime+0.6);o.start(a.currentTime);o.stop(a.currentTime+0.6);}else if(type==='click'){o.frequency.value=600;o.type='square';g.gain.setValueAtTime(0.08,a.currentTime);g.gain.exponentialRampToValueAtTime(0.01,a.currentTime+0.05);o.start(a.currentTime);o.stop(a.currentTime+0.05);}}catch(e){}}
function formatPhone(phone){if(!phone)return'';phone=String(phone).replace(/[^\d+]/g,'');if(phone.charAt(0)==='8'&&phone.length===11){phone='+7'+phone.substring(1);}if(phone&&phone.charAt(0)!=='+'){phone='+'+phone;}return phone;}
function isTestPhone(phone){return phone==='+79998389845'||ADMIN_PHONES.indexOf(phone)!==-1;}
function showPhoneStep(){document.getElementById('loginStepPhone').classList.add('active');document.getElementById('loginStepCode').classList.remove('active');document.getElementById('loginError').textContent='';document.getElementById('loginError2').textContent='';var b=document.getElementById('loginSendBtn');if(b){b.disabled=false;b.textContent='Получить код';}}
function showCodeStep(phone){document.getElementById('loginStepPhone').classList.remove('active');document.getElementById('loginStepCode').classList.add('active');document.getElementById('loginPhoneDisplay').textContent=phone;document.getElementById('loginCode').value='';var btn=document.getElementById('loginVerifyBtn');if(btn){btn.disabled=false;btn.textContent='Войти';}setTimeout(function(){var el=document.getElementById('loginCode');if(el)el.focus();},100);}
function sendPhoneCode(){var phoneInput=document.getElementById('loginPhone');var errorEl=document.getElementById('loginError');var btn=document.getElementById('loginSendBtn');if(!phoneInput)return;var phone=formatPhone(phoneInput.value);if(!phone||phone.length<10){errorEl.textContent='Введите корректный номер телефона';return;}errorEl.textContent='';btn.disabled=true;btn.textContent='Проверка...';setTimeout(function(){showCodeStep(phone);btn.disabled=false;btn.textContent='Получить код';},300);}
function verifyPhoneCode(){var codeInput=document.getElementById('loginCode');var errorEl=document.getElementById('loginError2');var btn=document.getElementById('loginVerifyBtn');var phone=formatPhone(document.getElementById('loginPhone').value);var code=codeInput.value.trim();errorEl.textContent='';if(!code){errorEl.textContent='Введите код';return;}btn.disabled=true;btn.textContent='Проверка...';setTimeout(function(){if(isTestPhone(phone)){if(code===ADMIN_CODE){completeLogin(phone);}else{errorEl.textContent='Неверный код администратора';btn.disabled=false;btn.textContent='Войти';}return;}var personalCode=state.playerCodes[phone];if(personalCode){if(code===personalCode){completeLogin(phone);}else{errorEl.textContent='Неверный персональный код';btn.disabled=false;btn.textContent='Войти';}return;}errorEl.textContent='У вас нет кода доступа. Обратитесь к администратору.';btn.disabled=false;btn.textContent='Войти';},200);}
function completeLogin(phone){currentUser={phone:phone,role:ADMIN_PHONES.indexOf(phone)!==-1?'admin':'player',loginTime:new Date().toISOString()};isAdminMode=currentUser.role==='admin';lsSet('topspin_session',JSON.stringify(currentUser));hideLoginScreen();toast(currentUser.role==='admin'?'Вход как админ':'Вход выполнен','ok');render();}
function hideLoginScreen(){document.getElementById('loginScreen').style.display='none';document.getElementById('mainHeader').style.display='flex';document.getElementById('view').style.display='block';document.getElementById('mainTabbar').style.display='flex';}
function showLoginScreen(){document.getElementById('loginScreen').style.display='flex';document.getElementById('mainHeader').style.display='none';document.getElementById('view').style.display='none';document.getElementById('mainTabbar').style.display='none';showPhoneStep();}
function logout(){confirmBox('Выйти из аккаунта?',function(){currentUser=null;isAdminMode=false;lsSet('topspin_session','');showLoginScreen();});}
function checkSession(){var session=lsGet('topspin_session');if(session){try{currentUser=JSON.parse(session);if(currentUser&&currentUser.phone){isAdminMode=currentUser.role==='admin';hideLoginScreen();return true;}}catch(e){}}showLoginScreen();return false;}
function updateSyncIndicator(status){var ind=document.getElementById('syncIndicator');if(!ind)return;ind.className='sync-indicator '+status;if(status==='synced'){ind.innerHTML='<span class="sync-dot"></span>синхр';}else if(status==='error'){ind.innerHTML='<span class="sync-dot"></span>ошибка';}}
function saveToFirebase(){if(!dbRef)return;try{dbRef.set(state).then(function(){updateSyncIndicator('synced');}).catch(function(e){updateSyncIndicator('error');});}catch(e){updateSyncIndicator('error');}}
function loadFromFirebase(){if(!dbRef){booted=true;return;}var local=loadState();var backup=loadBackup();dbRef.once('value').then(function(snap){var data=snap.val();var remote=(data&&data.players)?norm(data):null;var cands=[local,backup,remote].filter(function(x){return !!x;});var chosen=null;for(var i=0;i<cands.length;i++){if(!chosen||weight(cands[i])>weight(chosen))chosen=cands[i];}if(chosen&&weight(chosen)>0){state=chosen;lsSet(LS_KEY,JSON.stringify(state));lsSet(BAK_KEY,JSON.stringify(state));saveToFirebase();render();toast('История восстановлена: игроков '+state.players.length+', турниров '+state.tournaments.length,'ok');}booted=true;updateSyncIndicator('synced');}).catch(function(){booted=true;updateSyncIndicator('error');});}
function setupFirebaseListener(){if(!dbRef)return;dbRef.on('value',function(snap){if(isSyncingFromFirebase||!booted)return;var data=snap.val();if(data&&data.players){isSyncingFromFirebase=true;var remote=norm(data);if(weight(remote)>weight(state)){state=remote;lsSet(LS_KEY,JSON.stringify(state));lsSet(BAK_KEY,JSON.stringify(state));render();}updateSyncIndicator('synced');setTimeout(function(){isSyncingFromFirebase=false;},100);}});}
function autoCloseCheck(){if(!booted)return;var now=Date.now();var changed=false;state.tournaments.forEach(function(t){if(!t.closed&&t.date&&t.endTime){var e=new Date(t.date+'T'+t.endTime+':00').getTime();if(now>e){t.closed=true;changed=true;}}});if(changed){save();render();}}
function setsCountArr(sets){var a=0,b=0;for(var i=0;i<sets.length;i++){if(sets[i][0]>sets[i][1])a++;else if(sets[i][1]>sets[i][0])b++;}return[a,b];}
function ballsCountArr(sets){var a=0,b=0;for(var i=0;i<sets.length;i++){a+=sets[i][0];b+=sets[i][1];}return[a,b];}
function matchWinner(m){if(!m.sets||!m.sets.length)return null;var sc=setsCountArr(m.sets);if(sc[0]===sc[1])return null;return sc[0]>sc[1]?m.playerAId:m.playerBId;}
function mKey(m){var t=tourn(m.tournamentId);return new Date((t?t.date:'2000-01-01')+'T'+(m.time||'23:59')+':00').getTime();}
function engine(ignoreId){var base=+state.settings.startRating||1000,K=+state.settings.kFactor||32;var R={},hist={},last={},mdelta={};state.players.forEach(function(p){R[p.id]=base;hist[p.id]=[base];});var played=state.matches.filter(function(m){return m.id!==ignoreId&&m.sets&&m.sets.length&&matchWinner(m)&&R[m.playerAId]!==undefined&&R[m.playerBId]!==undefined;}).sort(function(a,b){return mKey(a)-mKey(b);});for(var i=0;i<played.length;i++){var m=played[i],A=m.playerAId,B=m.playerBId,Ra=R[A],Rb=R[B];var expA=1/(1+Math.pow(10,(Rb-Ra)/400));var w=matchWinner(m),sc=setsCountArr(m.sets);var mult=1+0.25*(Math.abs(sc[0]-sc[1])-1);var d=Math.round(K*mult*((w===A?1:0)-expA));if(d===0)d=(w===A?1:-1);R[A]+=d;R[B]-=d;hist[A].push(R[A]);hist[B].push(R[B]);last[A]={d:d,vs:B,res:w===A?'W':'L'};last[B]={d:-d,vs:A,res:w===B?'W':'L'};mdelta[m.id]={A:d,B:-d};}return{R:R,hist:hist,last:last,played:played,mdelta:mdelta};}
function eloDeltaFor(Ra,Rb,winnerIsA,sa,sb){var K=+state.settings.kFactor||32;var expA=1/(1+Math.pow(10,(Rb-Ra)/400));var mult=1+0.25*(Math.abs(sa-sb)-1);var d=Math.round(K*mult*((winnerIsA?1:0)-expA));if(d===0)d=winnerIsA?1:-1;return d;}

function viewProfile(){var eng=engine();var myPlayer=getPlayerByPhone(currentUser?currentUser.phone:null);if(!myPlayer){return'<div class="sec-title">Мой кабинет</div><div class="empty rise"><div class="big">👤</div><b>Профиль не найден</b><div class="row-actions"><button class="btn primary" data-action="createProfile">Создать профиль</button></div></div>';}var st=playerStats(myPlayer.id,eng);var myTournaments=state.tournaments.filter(function(t){return(t.playerIds||[]).indexOf(myPlayer.id)!==-1;});var availableTournaments=state.tournaments.filter(function(t){return(t.playerIds||[]).indexOf(myPlayer.id)===-1&&tStatus(t)!=='finished';});var aw=playerAwards(myPlayer.id);var html='<div class="sec-title">Мой кабинет</div><div class="profile-card rise">'+avatarHtml(myPlayer,'xl')+'<div class="profile-info"><div class="profile-name">'+esc(myPlayer.firstName)+' '+esc(myPlayer.lastName)+'</div><div class="profile-phone">'+(currentUser?currentUser.phone:'')+'</div><div class="profile-rating-num">'+eng.R[myPlayer.id]+'</div>'+(aw.length?'<div style="font-size:18px;margin-top:4px">'+aw.map(function(a){return a.emoji;}).join(' ')+'</div>':'')+'</div><button class="iconbtn" data-action="editMyProfile">✎</button></div>';html+='<div class="statgrid rise"><div class="stat"><b>'+st.m+'</b><span>матчей</span></div><div class="stat"><b>'+st.w+'</b><span>побед</span></div><div class="stat"><b>'+st.l+'</b><span>поражений</span></div><div class="stat"><b>'+st.winp+'%</b><span>% побед</span></div><div class="stat"><b>'+st.sw+':'+st.sl+'</b><span>сеты</span></div><div class="stat"><b>'+st.bw+':'+st.bl+'</b><span>мячи</span></div></div>';if(availableTournaments.length){html+='<div class="sec-title">Записаться на турнир</div>';availableTournaments.forEach(function(t){html+='<div class="tournament-register-item rise"><div class="tournament-register-info"><div class="tournament-register-name">'+esc(t.name)+'</div><div class="tournament-register-meta">'+fmtDate(t.date)+'</div></div><button class="btn primary sm" data-action="registerToTournament" data-tid="'+t.id+'">Записаться</button></div>';});}return html;}
function render(){try{clearInterval(window.__tick);}catch(e){}var eng=engine();var v=$('#view');if(!v)return;if(ui.tab==='arena')v.innerHTML=viewArena(eng);else if(ui.tab==='tournaments')v.innerHTML=ui.tournamentId?viewTournamentDetail(ui.tournamentId):viewTournaments();else if(ui.tab==='players')v.innerHTML=ui.playerId?viewPlayer(ui.playerId):viewPlayers(eng);else if(ui.tab==='rating')v.innerHTML=viewRating(eng);else if(ui.tab==='awards')v.innerHTML=viewAwards();else if(ui.tab==='profile')v.innerHTML=viewProfile();document.querySelectorAll('.tabbtn').forEach(function(b){b.classList.toggle('on',b.dataset.tab===ui.tab);});var ps=document.getElementById('pSearch');if(ps)ps.addEventListener('input',function(){filterPlayers(this.value);});startTick();}

function playerModal(pid){if(!isAdminMode)return;var p=pid?player(pid):null;__pendingAvatar=p&&p.avatar?p.avatar:null;var avHtml=__pendingAvatar?'<div class="av-preview" id="avPrev"><img src="'+__pendingAvatar+'"><span class="del-av" data-action="clearAvatar">✕</span></div>':'<div class="av-preview" id="avPrev"></div>';modal('<h3>'+(p?'Редактировать игрока':'Новый игрок')+'</h3><label>Фото</label>'+avHtml+'<input type="file" id="pfAvatar" accept="image/*"><label>Имя</label><input id="pf" value="'+(p?esc(p.firstName):'')+'"><label>Фамилия</label><input id="pl" value="'+(p?esc(p.lastName):'')+'"><div class="row-actions"><button class="btn ghost" data-action="closeModal">Отмена</button><button class="btn primary" data-action="savePlayer" data-id="'+(pid||'')+'">Сохранить</button></div>'+(p?'<button class="btn danger w100" data-action="delPlayer" data-id="'+pid+'">Удалить</button>':''));var fi=document.getElementById('pfAvatar');if(fi){fi.addEventListener('change',function(){if(this.files&&this.files[0]){compressImage(this.files[0],function(b64){__pendingAvatar=b64;refreshAvatarPreview();});}});}}

function tournamentModal(tid){if(!isAdminMode)return;var t=tid?tourn(tid):null;var today=new Date().toISOString().slice(0,10);modal('<h3>'+(t?'Редактировать турнир':'Новый турнир')+'</h3><label>Название</label><input id="tn" value="'+(t?esc(t.name):'')+'"><label>Дата</label><input id="td" type="date" value="'+(t?t.date:today)+'"><div class="frm2"><div><label>Начало</label><input id="ts" type="time" value="'+(t?t.startTime:'10:00')+'"></div><div><label>Окончание</label><input id="te" type="time" value="'+(t?t.endTime:'14:00')+'"></div></div><div class="row-actions"><button class="btn ghost" data-action="closeModal">Отмена</button><button class="btn primary" data-action="saveTournament" data-id="'+(tid||'')+'">Сохранить</button></div>');}

function roundRobin(ids){var a=[].concat(ids);if(a.length%2)a.push(null);var n=a.length,res=[];for(var r=0;r<n-1;r++){for(var i=0;i<n/2;i++){var x=a[i],y=a[n-1-i];if(x&&y)res.push(r%2?[y,x]:[x,y]);}a.splice(1,0,a.pop());}return res;}
function addMinutes(hm,mins){var parts=(hm||'10:00').split(':');var tot=(((+parts[0])*60+(+parts[1])+mins)%1440+1440)%1440;return p2(Math.floor(tot/60))+':'+p2(tot%60);}

function setRowHtml(i,a,b){return'<div class="setrow"><span class="setlabel">Сет '+(i+1)+'</span><input type="number" class="setin pa" value="'+((a==null)?'':a)+'" oninput="resultPreview()"><span class="colon">:</span><input type="number" class="setin pb" value="'+((b==null)?'':b)+'" oninput="resultPreview()"><button class="iconbtn rm" data-action="rmSet">✕</button></div>';}
function addSetRow(){var wrap=$('#setsWrap');if(wrap.children.length>=MAX_SETS){toast('Максимум '+MAX_SETS,'err');return;}wrap.insertAdjacentHTML('beforeend',setRowHtml(wrap.children.length,null,null));resultPreview();}
function collectSets(){var sets=[];var bad=false;document.querySelectorAll('#setsWrap .setrow').forEach(function(r){var a=r.querySelector('.pa').value,b=r.querySelector('.pb').value;if(a===''&&b==='')return;if(a===''||b===''||a===b){bad=true;return;}sets.push([+a,+b]);});return{sets:sets,bad:bad};}
function resultPreview(){var m=state.matches.find(function(x){return x.id===__rmid;});if(!m)return;var cs=collectSets();var sc=setsCountArr(cs.sets);var bc=ballsCountArr(cs.sets);var tb=document.getElementById('tallyBox');if(tb)tb.innerHTML='<div class="who">'+pName(m.playerAId)+'</div><div class="n">'+sc[0]+'</div><div class="sep">:</div><div class="n">'+sc[1]+'</div><div class="who">'+pName(m.playerBId)+'</div>';document.querySelectorAll('#setsWrap .setrow').forEach(function(r){var a=r.querySelector('.pa');var b=r.querySelector('.pb');var av=parseInt(a.value);var bv=parseInt(b.value);a.classList.remove('win');b.classList.remove('win');if(!isNaN(av)&&!isNaN(bv)){if(av>bv)a.classList.add('win');else if(bv>av)b.classList.add('win');}});var rp=document.getElementById('rprev');if(rp)rp.innerHTML=(sc[0]>sc[1]||sc[1]>sc[0])?'<span class="small">Мячи '+bc[0]+':'+bc[1]+' | Победитель: '+esc(pNameRaw(sc[0]>sc[1]?m.playerAId:m.playerBId))+'</span>':'<span class="small">Введите счёт</span>';}
function saveResult(){var m=state.matches.find(function(x){return x.id===__rmid;});var cs=collectSets();if(cs.bad){toast('Проверьте сеты','err');return;}if(!cs.sets.length){toast('Введите сет','err');return;}if(cs.sets.length>MAX_SETS){toast('Максимум '+MAX_SETS,'err');return;}var sc=setsCountArr(cs.sets);if(sc[0]===sc[1]){toast('Счёт сетов равный','err');return;}m.sets=cs.sets;save();closeModal();render();toast('Сохранено','ok');}
function clearResult(){var m=state.matches.find(function(x){return x.id===__rmid;});m.sets=null;save();closeModal();render();}
function awardModal(){if(!isAdminMode)return;if(!state.players.length)return;var emo=['🏆','🥇','🥈','','⭐','','💪','🎯','🚀','🛡️'];__emo='🏆';modal('<h3>Вручить награду</h3><label>Игрок</label><select id="awP">'+state.players.map(function(p){return'<option value="'+p.id+'">'+esc(p.firstName+' '+p.lastName)+'</option>';}).join('')+'</select><label>Награда</label><div class="emorow">'+emo.map(function(e,i){return'<button class="emopt '+(i===0?'on':'')+'" data-action="emo" data-emo="'+e+'">'+e+'</button>';}).join('')+'</div><label>Название</label><input id="awT"><label>Турнир</label><select id="awTid"><option value="">— без турнира —</option>'+state.tournaments.map(function(t){return'<option value="'+t.id+'">'+esc(t.name)+'</option>';}).join('')+'</select><div class="row-actions"><button class="btn ghost" data-action="closeModal">Отмена</button><button class="btn primary" data-action="saveAward">Вручить</button></div>');}
function pickEmoji(btn,e){__emo=e;document.querySelectorAll('.emopt').forEach(function(b){b.classList.toggle('on',b===btn);});}
function saveAward(){var pid=$('#awP').value,title=$('#awT').value.trim()||'Специальная награда',tid=$('#awTid').value||null;state.awards.push({id:uid(),playerId:pid,title:title,emoji:__emo,tournamentId:tid,date:new Date().toISOString().slice(0,10)});save();closeModal();render();toast('Награда вручена — появится на пьедестале','ok');}
function delAward(id){confirmBox('Удалить награду?',function(){state.awards=state.awards.filter(function(a){return a.id!==id;});save();render();});}
function awardPodium(tid){var t=tourn(tid);var st=standings(tid);if(st.length<3){toast('Нужно 3 участника','err');return;}var defs=[['🥇','Чемпион турнира'],['🥈','Серебряный призёр'],['🥉','Бронзовый призёр']];var added=0;defs.forEach(function(d,i){if(!state.awards.some(function(a){return a.tournamentId===tid&&a.title===d[1];})){state.awards.push({id:uid(),tournamentId:tid,playerId:st[i].pid,title:d[1],emoji:d[0],date:t.date});added++;}});save();render();toast('Вручено '+added,'ok');}
function getPlayerByPhone(phone){if(!phone)return null;return state.players.find(function(p){return p.phone===phone;})||null;}
function createProfileModal(){modal('<h3>Создать профиль</h3><p class="mut small">Ваш номер: '+(currentUser?currentUser.phone:'')+'</p><label>Имя</label><input id="profFirstName"><label>Фамилия</label><input id="profLastName"><div class="row-actions"><button class="btn ghost" data-action="closeModal">Отмена</button><button class="btn primary" data-action="saveProfile">Создать</button></div>');}
function saveProfile(){var f=$('#profFirstName').value.trim(),l=$('#profLastName').value.trim();if(!f||!l){toast('Имя и фамилия','err');return;}if(!currentUser||!currentUser.phone){toast('Нет номера','err');return;}if(getPlayerByPhone(currentUser.phone)){toast('Уже есть','err');return;}state.players.push({id:uid(),firstName:f,lastName:l,avatar:null,phone:currentUser.phone});save();closeModal();render();toast('Профиль создан','ok');}
function editMyProfileModal(){var myPlayer=getPlayerByPhone(currentUser?currentUser.phone:null);if(!myPlayer)return;__pendingAvatar=myPlayer.avatar;var avHtml=myPlayer.avatar?'<div class="av-preview" id="avPrev"><img src="'+myPlayer.avatar+'"><span class="del-av" data-action="clearAvatar">✕</span></div>':'<div class="av-preview" id="avPrev"></div>';modal('<h3>Профиль</h3><label>Фото</label>'+avHtml+'<input type="file" id="pfAvatar" accept="image/*"><label>Имя</label><input id="pf" value="'+esc(myPlayer.firstName)+'"><label>Фамилия</label><input id="pl" value="'+esc(myPlayer.lastName)+'"><div class="row-actions"><button class="btn ghost" data-action="closeModal">Отмена</button><button class="btn primary" data-action="saveMyProfile">Сохранить</button></div>');var fi=document.getElementById('pfAvatar');if(fi){fi.addEventListener('change',function(){if(this.files&&this.files[0]){compressImage(this.files[0],function(b64){__pendingAvatar=b64;refreshAvatarPreview();});}});}}
function saveMyProfile(){var myPlayer=getPlayerByPhone(currentUser?currentUser.phone:null);if(!myPlayer)return;var f=$('#pf').value.trim(),l=$('#pl').value.trim();if(!f||!l)return;myPlayer.firstName=f;myPlayer.lastName=l;myPlayer.avatar=__pendingAvatar||myPlayer.avatar;save();closeModal();render();toast('Обновлено','ok');}
function registerToTournament(tid){var myPlayer=getPlayerByPhone(currentUser?currentUser.phone:null);if(!myPlayer){toast('Создайте профиль','err');return;}var t=tourn(tid);if(!t)return;if((t.playerIds||[]).indexOf(myPlayer.id)!==-1){toast('Уже записаны','err');return;}t.playerIds=t.playerIds||[];t.playerIds.push(myPlayer.id);save();render();toast('Записаны','ok');}
function exportRatingCSV(){try{var eng=engine();var rows=[['Место','Игрок','Рейтинг','Побед','Поражений']];[].concat(state.players).sort(function(a,b){return eng.R[b.id]-eng.R[a.id];}).forEach(function(p,i){var st=playerStats(p.id,eng);rows.push([i+1,p.firstName+' '+p.lastName,eng.R[p.id],st.w,st.l]);});var ws=XLSX.utils.aoa_to_sheet(rows);var wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Рейтинг');XLSX.writeFile(wb,'rating.xlsx');toast('Excel готов','ok');}catch(e){toast('Не удалось экспортировать','err');}}
function exportRatingPDF(){try{var eng=engine();var sorted=[].concat(state.players).sort(function(a,b){return eng.R[b.id]-eng.R[a.id];});if(!sorted.length)return;var canvas=document.createElement('canvas');var scale=2,rowH=40*scale,totalH=60*scale+80*scale+(sorted.length+1)*rowH,totalW=800*scale;canvas.width=totalW;canvas.height=totalH;var ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,totalW,totalH);var y=60*scale;ctx.fillStyle='#000';ctx.font='bold '+(24*scale)+'px Arial';ctx.textAlign='center';ctx.fillText('Рейтинг ТОП-СПИН',totalW/2,y);y+=60*scale;ctx.font='bold '+(16*scale)+'px Arial';ctx.textAlign='left';ctx.fillText('#',30*scale,y);ctx.fillText('Игрок',80*scale,y);ctx.textAlign='right';ctx.fillText('Рейтинг',760*scale,y);y+=rowH;ctx.font=(16*scale)+'px Arial';sorted.forEach(function(p,i){ctx.textAlign='left';ctx.fillText(String(i+1),30*scale,y);ctx.fillText(p.firstName+' '+p.lastName,80*scale,y);ctx.textAlign='right';ctx.fillText(String(eng.R[p.id]),760*scale,y);y+=rowH;});var img=canvas.toDataURL('image/png');var pdf=new jspdf.jsPDF({orientation:'portrait',unit:'mm',format:'a4'});var pw=pdf.internal.pageSize.getWidth();var ih=pw*(totalH/totalW);pdf.addImage(img,'PNG',0,0,pw,ih);pdf.save('rating.pdf');toast('PDF готов','ok');}catch(e){toast('Не удалось создать PDF','err');}}
function exportTournamentCSV(tid){try{var t=tourn(tid);if(!t)return;var rows=[['Место','Игрок','И','В','П','Сеты','Мячи','Очки']];standings(tid).forEach(function(r,i){rows.push([i+1,pNameRaw(r.pid),r.w+r.l,r.w,r.l,r.sw+':'+r.sl,r.bw+':'+r.bl,r.w*2+r.l]);});var ws=XLSX.utils.aoa_to_sheet(rows);var wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Результаты');XLSX.writeFile(wb,'tournament.xlsx');toast('Excel готов','ok');}catch(e){toast('Не удалось экспортировать','err');}}
function exportTournamentPDF(tid){try{var t=tourn(tid);if(!t)return;var stnd=standings(tid);if(!stnd.length)return;var canvas=document.createElement('canvas');var scale=2,rowH=40*scale,totalH=80*scale+(stnd.length+1)*rowH,totalW=900*scale;canvas.width=totalW;canvas.height=totalH;var ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,totalW,totalH);var y=50*scale;ctx.fillStyle='#000';ctx.font='bold '+(22*scale)+'px Arial';ctx.textAlign='center';ctx.fillText(t.name,totalW/2,y);y+=50*scale;ctx.font='bold '+(14*scale)+'px Arial';ctx.textAlign='left';ctx.fillText('#',20*scale,y);ctx.fillText('Игрок',60*scale,y);ctx.textAlign='right';ctx.fillText('Очки',860*scale,y);y+=rowH;ctx.font=(14*scale)+'px Arial';stnd.forEach(function(r,i){ctx.textAlign='left';ctx.fillText(String(i+1),20*scale,y);ctx.fillText(pNameRaw(r.pid),60*scale,y);ctx.textAlign='right';ctx.fillText(String(r.w*2+r.l),860*scale,y);y+=rowH;});var img=canvas.toDataURL('image/png');var pdf=new jspdf.jsPDF({orientation:'landscape',unit:'mm',format:'a4'});var pw=pdf.internal.pageSize.getWidth();var ih=pw*(totalH/totalW);pdf.addImage(img,'PNG',0,0,pw,ih);pdf.save('tournament.pdf');toast('PDF готов','ok');}catch(e){toast('Не удалось создать PDF','err');}}
function exportAllData(){try{var json=JSON.stringify(state,null,2);modal('<h3>Резервная копия</h3><p class="mut small">Это ваша резервная копия. Нажмите «Копировать» и сохраните текст в файл .json на устройстве.</p><textarea id="bakText" style="width:100%;height:220px;font-size:11px;font-family:monospace">'+esc(json)+'</textarea><div class="row-actions"><button class="btn primary" data-action="copyBackup">Копировать</button><button class="btn ghost" data-action="closeModal">Закрыть</button></div>');}catch(e){toast('Не удалось создать копию','err');}}
function copyBackup(){var ta=document.getElementById('bakText');if(!ta)return;ta.focus();ta.select();try{document.execCommand('copy');toast('Скопировано в буфер','ok');}catch(e){toast('Выделите текст и скопируйте вручную','err');}}
function importFile(inp){var f=inp.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var d=JSON.parse(r.result);if(!d.players)throw 0;state=norm(d);save();closeModal();render();toast('Импортировано','ok');}catch(e){toast('Файл не подходит','err');}};r.readAsText(f);}
function resetAll(){confirmBox('Удалить ВСЕ данные?',function(){state=norm({});save();ui={tab:'arena',tournamentId:null,playerId:null,ratingSort:'r'};render();toast('Очищено');});}
function loadDemo(){confirmBox('Загрузить демо?',function(){var defs=[['Александр','Волков'],['Дмитрий','Соколов'],['Иван','Крылов'],['Мария','Орлова'],['Павел','Лебедев'],['Анна','Смирнова']];var players=defs.map(function(d,i){return{id:'dp'+(i+1),firstName:d[0],lastName:d[1],avatar:null,phone:null};});var y=new Date(Date.now()-86400000).toISOString().slice(0,10);var t={id:'tdemo',name:'Кубок ТОП-СПИН',date:y,startTime:'16:00',endTime:'20:00',playerIds:players.map(function(p){return p.id;}),closed:false};var strength={'dp1':6,'dp2':4,'dp3':2,'dp4':5,'dp5':1,'dp6':3};var TPL=[[[11,7],[11,8],[11,6]],[[11,9],[8,11],[11,7],[11,5]],[[12,10],[11,8],[9,11],[11,9]],[[11,5],[11,9],[11,7]],[[11,8],[11,6],[7,11],[11,9]]];var pairs=roundRobin(players.map(function(p){return p.id;}));var matches=pairs.map(function(pr,i){var winA=strength[pr[0]]>strength[pr[1]];if(i%3===2)winA=!winA;var sets=TPL[i%TPL.length].map(function(s){return[s[0],s[1]];});if(!winA)sets=sets.map(function(s){return[s[1],s[0]];});return{id:'dm'+i,tournamentId:'tdemo',playerAId:pr[0],playerBId:pr[1],time:addMinutes('16:00',i*15),sets:sets};});state=norm({players:players,tournaments:[t],matches:matches,awards:[]});save();render();toast('Демо загружено','ok');});}
function dispatch(el){var act=el.dataset.action;var id=el.dataset.id;var tid=el.dataset.tid;switch(act){case'tab':setTab(el.dataset.tab);break;case'settings':settingsModal();break;case'openAppearance':openAppearanceModal();break;case'setTheme':setTheme(el.dataset.theme);break;case'setFontSize':setFontSize(el.dataset.size);break;case'toggleSound':toggleSound();break;case'logout':logout();break;case'managePlayerCodes':managePlayerCodes();break;case'addPlayerCodeModal':addPlayerCodeModal();break;case'savePlayerCode':savePlayerCode();break;case'removePlayerCode':removePlayerCode(el.dataset.phone);break;case'newPlayer':ui.tab='players';ui.playerId=null;render();playerModal();break;case'editPlayer':playerModal(id);break;case'savePlayer':savePlayer(id||null);break;case'delPlayer':delPlayer(id);break;case'clearAvatar':__pendingAvatar=null;refreshAvatarPreview();break;case'newTournament':tournamentModal();break;case'editTournament':tournamentModal(id);break;case'saveTournament':saveTournament(id||null);break;case'delTournament':delTournament(id);break;case'openTournament':openTournament(id);break;case'closeNow':closeTournamentNow(id);break;case'reopen':reopenTournament(id);break;case'addParticipant':addParticipantModal(tid);break;case'pickParticipant':pickParticipant(tid,id);break;case'addAllParticipants':addAllParticipants(tid);break;case'removeParticipant':removeParticipant(tid,id);break;case'newMatch':matchModal(tid);break;case'editMatch':matchModal(tid,id);break;case'saveMatch':saveMatch(tid,id||null);break;case'delMatch':delMatch(id);break;case'genRR':genRRModal(tid);break;case'runGenRR':runGenRR(tid);break;case'result':resultSheet(id);break;case'addSet':addSetRow();break;case'rmSet':el.closest('.setrow').remove();resultPreview();break;case'saveResult':saveResult();break;case'clearResult':clearResult();break;case'openPlayer':openPlayer(id);break;case'backPlayers':ui.playerId=null;render();break;case'backTournaments':ui.tournamentId=null;render();break;case'sortR':ui.ratingSort='r';render();break;case'sortW':ui.ratingSort='w';render();break;case'newAward':awardModal();break;case'emo':pickEmoji(el,el.dataset.emo);break;case'saveAward':saveAward();break;case'delAward':delAward(id);break;case'awardPodium':awardPodium(id);break;case'saveSettings':saveSettings();break;case'exportRatingCSV':exportRatingCSV();break;case'exportRatingPDF':exportRatingPDF();break;case'exportTournamentCSV':exportTournamentCSV(el.dataset.tid);break;case'exportTournamentPDF':exportTournamentPDF(el.dataset.tid);break;case'exportAllData':exportAllData();break;case'copyBackup':copyBackup();break;case'importData':document.getElementById('impFile').click();break;case'demo':loadDemo();break;case'resetAll':resetAll();break;case'closeModal':closeModal();break;case'confirmYes':if(__cb)__cb();__cb=null;closeModal();break;case'createProfile':createProfileModal();break;case'saveProfile':saveProfile();break;case'editMyProfile':editMyProfileModal();break;case'saveMyProfile':saveMyProfile();break;case'registerToTournament':registerToTournament(tid);break;}}
(function init(){
try{var d=new Date();document.getElementById('todayChip').textContent=d.toLocaleDateString('ru-RU',{weekday:'short'})+', '+d.getDate()+' '+MON[d.getMonth()];}catch(e){}
if(lsGet('theme')==='light')document.body.classList.add('light');
if(lsGet('fontSize')==='big')document.body.classList.add('big-font');
var fbOk=initFirebase();
checkSession();
if(fbOk){loadFromFirebase();setupFirebaseListener();}else{booted=true;}
autoCloseCheck();
setInterval(autoCloseCheck,20000);
var sb=document.getElementById('loginSendBtn');if(sb)sb.addEventListener('click',sendPhoneCode);
var vb=document.getElementById('loginVerifyBtn');if(vb)vb.addEventListener('click',verifyPhoneCode);
var bb=document.getElementById('loginBackBtn');if(bb)bb.addEventListener('click',showPhoneStep);
var lp=document.getElementById('loginPhone');if(lp)lp.addEventListener('keydown',function(e){if(e.key==='Enter')sendPhoneCode();});
var lc=document.getElementById('loginCode');if(lc)lc.addEventListener('keydown',function(e){if(e.key==='Enter')verifyPhoneCode();});
document.addEventListener('click',function(e){var el=e.target.closest('[data-action]');if(el)dispatch(el);});
if(document.getElementById('loginScreen').style.display==='none'){render();}
})();
</script>
