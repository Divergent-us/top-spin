#modal-root{position:fixed;inset:0;z-index:90;display:none;align-items:flex-end;justify-content:center;pointer-events:none}
.backdrop{position:absolute;inset:0;background:rgba(4,9,18,.7);backdrop-filter:blur(3px);animation:fade .25s both}

.sheet{position:relative;width:min(540px,100%);max-height:92vh;overflow-y:auto;background:linear-gradient(180deg,#17293f,#101d31);border:1px solid var(--line2);border-bottom:none;border-radius:20px 20px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));animation:sheetUp .32s cubic-bezier(.2,.9,.3,1.1) both}
@keyframes sheetUp{from{transform:translateY(60px);opacity:0}}
.sheet h3{font-family:var(--fd);font-size:18px;letter-spacing:.03em;margin-bottom:4px}
.sheet .grab{width:44px;height:4px;border-radius:2px;background:var(--line2);margin:0 auto 15px}
.emorow{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px}
.emopt{width:42px;height:42px;font-size:20px;display:grid;place-items:center;cursor:pointer;background:#0d1a2d;border:1.5px solid var(--line);border-radius:11px;transition:.15s}
.emopt.on{border-color:var(--orange);background:rgba(255,139,31,.14);transform:scale(1.08)}
.awrow{display:flex;align-items:center;gap:11px;padding:11px 2px;border-bottom:1px solid rgba(36,57,90,.5)}
.awrow:last-child{border-bottom:none}
.awrow .em{font-size:26px;flex:none;width:36px;text-align:center;filter:drop-shadow(0 3px 6px rgba(0,0,0,.4))}
.awrow .tt{font-weight:800;font-size:14px}
.awrow .sub{font-size:12px;color:var(--mut);margin-top:2px}
.awrow .del{margin-left:auto}
#toast-root{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;z-index:120;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(440px,92%);pointer-events:none}
.toast{background:#1c2c45;border:1px solid var(--line2);color:var(--txt);font-size:13.5px;font-weight:600;padding:11px 18px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.45);opacity:0;transform:translateY(14px);transition:.3s;text-align:center;pointer-events:auto}
.toast.in{opacity:1;transform:none}
.toast.err{border-color:rgba(255,95,107,.55)}
.toast.ok{border-color:rgba(65,224,141,.5)}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:#0f1e33;border:1px solid var(--line);border-radius:11px;padding:11px 6px;text-align:center}
.stat b{display:block;font-family:var(--fd);font-size:18px;color:var(--txt)}
.stat span{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);font-weight:700}
.stat b.g{color:var(--green)}.stat b.r{color:var(--red)}.stat b.o{color:var(--orange2)}
.av-preview{width:90px;height:90px;border-radius:50%;overflow:hidden;background:#0d1a2d;border:2px dashed var(--line2);display:grid;place-items:center;margin:8px 0 4px;position:relative}
.av-preview img{width:100%;height:100%;object-fit:cover}
.av-preview .del-av{position:absolute;top:-6px;right:-6px;width:28px;height:28px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;cursor:pointer;border:2px solid #0d1a2d;font-size:14px;font-weight:700}
.av-preview.empty-av span{color:var(--dim);font-size:11px;text-align:center;padding:4px}
.picker-list{display:flex;flex-direction:column;gap:6px;max-height:50vh;overflow-y:auto;margin-top:8px}
.picker-item{display:flex;align-items:center;gap:10px;background:#0d1a2d;border:1px solid var(--line);border-radius:11px;padding:9px 11px;cursor:pointer;transition:.15s}
.picker-item:hover{border-color:var(--orange);background:#111f36}
.picker-item .nm{flex:1;font-weight:700;font-size:14px}
.picker-item .rt{font-family:var(--fd);font-size:13px;color:var(--ball)}
.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}

.toggle-row span{flex:1;font-weight:600}

function playSound(type){if(lsGet('soundEnabled')==='false')return;try{var audioCtx=new (window.AudioContext||window.webkitAudioContext)();var oscillator=audioCtx.createOscillator();var gainNode=audioCtx.createGain();oscillator.connect(gainNode);gainNode.connect(audioCtx.destination);if(type==='setEnd'){oscillator.frequency.value=880;oscillator.type='sine';gainNode.gain.setValueAtTime(0.3,audioCtx.currentTime);gainNode.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.3);oscillator.start(audioCtx.currentTime);oscillator.stop(audioCtx.currentTime+0.3);}else if(type==='matchEnd'){oscillator.frequency.setValueAtTime(523,audioCtx.currentTime);oscillator.frequency.setValueAtTime(659,audioCtx.currentTime+0.15);oscillator.frequency.setValueAtTime(784,audioCtx.currentTime+0.3);oscillator.type='sine';gainNode.gain.setValueAtTime(0.35,audioCtx.currentTime);gainNode.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.6);oscillator.start(audioCtx.currentTime);oscillator.stop(audioCtx.currentTime+0.6);}else if(type==='click'){oscillator.frequency.value=600;oscillator.type='square';gainNode.gain.setValueAtTime(0.08,audioCtx.currentTime);gainNode.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.05);oscillator.start(audioCtx.currentTime);oscillator.stop(audioCtx.currentTime+0.05);}}catch(e){}}

function engine(ignoreId){var base=+state.settings.startRating||1000,K=+state.settings.kFactor||32;var R={},hist={},last={},mdelta={};state.players.forEach(function(p){R[p.id]=base;hist[p.id]=[base];});var played=state.matches.filter(function(m){return m.id!==ignoreId&&m.sets&&m.sets.length&&matchWinner(m)&&R[m.playerAId]!==undefined&&R[m.playerBId]!==undefined;}).sort(function(a,b){return mKey(a)-mKey(b);});for(var i=0;i<played.length;i++){var m=played[i],A=m.playerAId,B=m.playerBId,Ra=R[A],Rb=R[B];var expA=1/(1+Math.pow(10,(Rb-Ra)/400));var w=matchWinner(m),sc=setsCountArr(m.sets);var mult=1+0.25*(Math.abs(sc[0]-sc[1])-1);var d=Math.round(K*mult*((w===A?1:0)-expA));if(d===0)d=(w===A?1:-1);R[A]+=d;R[B]-=d;hist[A].push(R[A]);hist[B].push(R[B]);last[A]={d:d,vs:B,res:w===A?'W':'L'};last[B]={d:-d,vs:A,res:w===B?'W':'L'};mdelta[m.id]={A:d,B:-d};}return{R:R,hist:hist,last:last,played:played,mdelta:mdelta};}

function savePlayer(pid){var f=$('#pf').value.trim(),l=$('#pl').value.trim();if(!f||!l){toast('Введите имя и фамилию','err');return;}var urlEl=document.getElementById('pfUrl');var urlVal=urlEl?urlEl.value.trim():'';var av=__pendingAvatar||urlVal||null;if(pid){var p=player(pid);p.firstName=f;p.lastName=l;p.avatar=av;toast('Игрок обновлён','ok');}else{state.players.push({id:uid(),firstName:f,lastName:l,avatar:av});toast('Игрок добавлен','ok');}save();closeModal();render();}

function tournamentModal(tid){var t=tid?tourn(tid):null;var today=new Date().toISOString().slice(0,10);modal('<h3>'+(t?'Редактировать турнир':'Новый турнир')+'</h3><label>Название</label><input id="tn" value="'+(t?esc(t.name):'')+'" placeholder="Например: Кубок осени"><label>Дата соревнований</label><input id="td" type="date" value="'+(t?t.date:today)+'"><div class="frm2"><div><label>Начало встреч</label><input id="ts" type="time" value="'+(t?t.startTime:'10:00')+'"></div><div><label>Окончание</label><input id="te" type="time" value="'+(t?t.endTime:'14:00')+'"></div></div><label>Формат матча</label><select id="tb"><option value="5" '+((!t||t.bestOf!=='3')?'selected':'')+'>До 3 выигранных сетов (5)</option><option value="3" '+((t&&t.bestOf==='3')?'selected':'')+'>До 2 выигранных сетов (3)</option></select><div class="mut small" style="margin-top:10px">⏱ Ввод результатов откроется автоматически после времени окончания.</div><div class="row-actions"><button class="btn ghost" data-action="closeModal">Отмена</button><button class="btn primary" data-action="saveTournament" data-id="'+(tid||'')+'">Сохранить</button></div>');}

function addParticipantModal(tid){var t=tourn(tid);var avail=state.players.filter(function(p){return(t.playerIds||[]).indexOf(p.id)<0;});if(!avail.length){toast('Все игроки уже добавлены','err');return;}var items=avail.map(function(p){return'<div class="picker-item" data-action="pickParticipant" data-tid="'+tid+'" data-id="'+p.id+'">'+miniAvatar(p)+'<span class="nm">'+esc(p.firstName+' '+p.lastName)+'</span><span class="rt">'+engine().R[p.id]+'</span></div>';}).join('');modal('<h3>Добавить участника</h3><p class="mut small" style="margin-top:6px">Нажмите на игрока, чтобы добавить его в турнир.</p><div class="picker-list">'+items+'</div><div class="row-actions"><button class="btn ghost" data-action="closeModal">Закрыть</button></div>');}

function addAllParticipants(tid){var t=tourn(tid);t.playerIds=t.playerIds||[];var added=0;state.players.forEach(function(p){if(t.playerIds.indexOf(p.id)<0){t.playerIds.push(p.id);added++;}});save();render();toast('Добавлено: '+added,'ok');}
function removeParticipant(tid,pid){var t=tourn(tid);var played=state.matches.some(function(m){return m.tournamentId===tid&&(m.playerAId===pid||m.playerBId===pid)&&matchWinner(m);});if(played){toast('У игрока есть сыгранные матчи в турнире','err');return;}state.matches=state.matches.filter(function(m){return!(m.tournamentId===tid&&(m.playerAId===pid||m.playerBId===pid));});t.playerIds=t.playerIds.filter(function(x){return x!==pid;});save();render();}

function saveMatch(tid,mid){var a=$('#mA').value,b=$('#mB').value,tm=$('#mTime').value;if(!a||!b||a===b){toast('Выберите двух разных игроков','err');return;}if(mid){var m=state.matches.find(function(x){return x.id===mid;});m.playerAId=a;m.playerBId=b;m.time=tm;}else state.matches.push({id:uid(),tournamentId:tid,playerAId:a,playerBId:b,time:tm,sets:null});save();closeModal();render();toast('Сохранено','ok');}
function delMatch(mid){confirmBox('Удалить встречу?',function(){state.matches=state.matches.filter(function(m){return m.id!==mid;});save();render();});}
function roundRobin(ids){var a=[].concat(ids);if(a.length%2)a.push(null);var n=a.length,res=[];for(var r=0;r<n-1;r++){for(var i=0;i<n/2;i++){var x=a[i],y=a[n-1-i];if(x&&y)res.push(r%2?[y,x]:[x,y]);}a.splice(1,0,a.pop());}return res;}
function addMinutes(hm,mins){var parts=(hm||'10:00').split(':');var tot=(((+parts[0])*60+(+parts[1])+mins)%1440+1440)%1440;return p2(Math.floor(tot/60))+':'+p2(tot%60);}
function genRRModal(tid){modal('<h3>Круговая система</h3><p class="mut small" style="margin-top:6px">Каждый участник сыграет с каждым.</p><label>Интервал между встречами (мин)</label><input id="rrStep" type="number" value="15" min="5" max="120"><div class="row-actions"><button class="btn ghost" data-action="closeModal">Отмена</button><button class="btn primary" data-action="runGenRR" data-tid="'+tid+'">Создать расписание</button></div>');}
function runGenRR(tid){var t=tourn(tid);var step=Math.max(5,parseInt($('#rrStep').value)||15);var pairs=roundRobin(t.playerIds||[]);state.matches=state.matches.filter(function(m){return m.tournamentId!==tid||(m.sets&&m.sets.length&&matchWinner(m));});pairs.forEach(function(pr,i){state.matches.push({id:uid(),tournamentId:tid,playerAId:pr[0],playerBId:pr[1],time:addMinutes(t.startTime,step*i),sets:null});});save();closeModal();render();toast('Создано встреч: '+pairs.length,'ok');}
function resultSheet(mid){var m=state.matches.find(function(x){return x.id===mid;});var t=tourn(m.tournamentId);if(tStatus(t)!=='finished'){toast('Результаты — после окончания ('+(t.endTime||'—')+')','err');return;}__rmid=mid;var sets=(m.sets&&m.sets.length)?m.sets:[[null,null]];modal('<h3>Результат матча</h3><div class="mut small">до '+needSets(t)+' выигранных сетов • '+esc(t.name)+'</div><div class="vshead" style="margin-top:12px"><div class="side">'+pName(m.playerAId)+'</div><div class="vs">VS</div><div class="side r">'+pName(m.playerBId)+'</div></div><div id="setsWrap">'+sets.map(function(s,i){return setRowHtml(i,s[0],s[1]);}).join('')+'</div><button class="btn ghost sm" data-action="addSet">＋ Сет</button><div class="tally" id="tallyBox"></div><div class="rprev" id="rprev"></div><div class="row-actions"><button class="btn ghost" data-action="closeModal">Отмена</button><button class="btn primary" data-action="saveResult">💾 Сохранить счёт</button></div>'+(m.sets?'<button class="btn danger w100" style="margin-top:8px" data-action="clearResult">Убрать результат</button>':''));resultPreview();}
function setRowHtml(i,a,b){return'<div class="setrow"><span class="setlabel">Сет '+(i+1)+'</span><input type="number" inputmode="numeric" min="0" max="99" class="setin pa" value="'+((a==null)?'':a)+'" placeholder="—" oninput="resultPreview()"><span class="colon">:</span><input type="number" inputmode="numeric" min="0" max="99" class="setin pb" value="'+((b==null)?'':b)+'" placeholder="—" oninput="resultPreview()"><button class="iconbtn rm" data-action="rmSet">✕</button></div>';}
function addSetRow(){var m=state.matches.find(function(x){return x.id===__rmid;});var t=tourn(m.tournamentId);var wrap=$('#setsWrap');var maxSets=String(t.bestOf)==='3'?3:5;if(wrap.children.length>=maxSets){toast('Больше сетов не нужно','err');return;}wrap.insertAdjacentHTML('beforeend',setRowHtml(wrap.children.length,null,null));resultPreview();}
function collectSets(){var sets=[];var bad=false;document.querySelectorAll('#setsWrap .setrow').forEach(function(r){var a=r.querySelector('.pa').value,b=r.querySelector('.pb').value;if(a===''&&b==='')return;if(a===''||b===''||a===b){bad=true;return;}sets.push([+a,+b]);});return{sets:sets,bad:bad};}
function resultPreview(){var m=state.matches.find(function(x){return x.id===__rmid;});if(!m)return;var t=tourn(m.tournamentId);var need=needSets(t);var cs=collectSets();var sets=cs.sets;var sc=setsCountArr(sets);$('#tallyBox').innerHTML='<div class="who">'+pName(m.playerAId)+'</div><div class="n">'+sc[0]+'</div><div class="sep">:</div><div class="n">'+sc[1]+'</div><div class="who">'+pName(m.playerBId)+'</div>';var done=sc[0]===need||sc[1]===need;if(done&&sc[0]!==sc[1]){var eng=engine(__rmid);var Ra=eng.R[m.playerAId],Rb=eng.R[m.playerBId];if(Ra===undefined||Rb===undefined){$('#rprev').innerHTML='';return;}var d=eloDeltaFor(Ra,Rb,sc[0]>sc[1],sc[0],sc[1]);$('#rprev').innerHTML='<span class="delta up">'+(sc[0]>sc[1]?pName(m.playerAId):pName(m.playerBId))+' '+(d>0?'+':'')+d+' ▲</span><span class="delta down">'+(sc[0]>sc[1]?pName(m.playerBId):pName(m.playerAId))+' '+(-d)+' ▼</span>';playSound('setEnd');}else{$('#rprev').innerHTML='<span class="chip">для победы нужно '+need+' сета</span>';}}
function saveResult(){var m=state.matches.find(function(x){return x.id===__rmid;});var t=tourn(m.tournamentId);var cs=collectSets();if(cs.bad){toast('Проверьте сеты: оба числа, без ничьих','err');return;}if(!cs.sets.length){toast('Введите хотя бы один сет','err');return;}var sc=setsCountArr(cs.sets);var need=needSets(t);if(sc[0]!==need&&sc[1]!==need){toast('Матч не завершён: нужно '+need+' выигранных сета','err');return;}m.sets=cs.sets;save();playSound('matchEnd');closeModal();render();toast('Счёт сохранён','ok');}
function clearResult(){var m=state.matches.find(function(x){return x.id===__rmid;});m.sets=null;save();closeModal();render();toast('Результат убран');}
function awardModal(){if(!state.players.length){toast('Сначала добавьте игроков','err');return;}var emo=['🏆','🥇','🥈','🥉','⭐','🔥','💪','🎯','🚀','🛡️'];__emo='🏆';modal('<h3>Вручить награду</h3><label>Игрок</label><select id="awP">'+state.players.map(function(p){return'<option value="'+p.id+'">'+esc(p.firstName+' '+p.lastName)+'</option>';}).join('')+'</select><label>Награда</label><div class="emorow">'+emo.map(function(e,i){return'<button class="emopt '+(i===0?'on':'')+'" data-action="emo" data-emo="'+e+'">'+e+'</button>';}).join('')+'</div><label>Название</label><input id="awT" placeholder="Например: Воля к победе"><label>Турнир (не обязательно)</label><select id="awTid"><option value="">— без турнира —</option>'+state.tournaments.map(function(t){return'<option value="'+t.id+'">'+esc(t.name)+' • '+fmtDate(t.date)+'</option>';}).join('')+'</select><div class="row-actions"><button class="btn ghost" data-action="closeModal">Отмена</button><button class="btn primary" data-action="saveAward">Вручить</button></div>');}
function pickEmoji(btn,e){__emo=e;document.querySelectorAll('.emopt').forEach(function(b){b.classList.toggle('on',b===btn);});}
function saveAward(){var pid=$('#awP').value,title=$('#awT').value.trim()||'Специальная награда',tid=$('#awTid').value||null;state.awards.push({id:uid(),playerId:pid,title:title,emoji:__emo,tournamentId:tid,date:new Date().toISOString().slice(0,10)});save();closeModal();render();toast('Награда вручена 🎉','ok');}
function delAward(id){confirmBox('Удалить награду?',function(){state.awards=state.awards.filter(function(a){return a.id!==id;});save();render();});}
function awardPodium(tid){var t=tourn(tid);var st=standings(tid);if(st.length<3){toast('Нужно минимум 3 участника с матчами','err');return;}var defs=[['🥇','Чемпион турнира'],['🥈','Серебряный призёр'],['🥉','Бронзовый призёр']];var added=0;defs.forEach(function(d,i){if(!state.awards.some(function(a){return a.tournamentId===tid&&a.title===d[1];})){state.awards.push({id:uid(),tournamentId:tid,playerId:st[i].pid,title:d[1],emoji:d[0],date:t.date});added++;}});save();render();toast(added?('Вручено наград: '+added+' 🏆'):'Призёры уже награждены','ok');}
function settingsModal(){if(!isAdminMode){modal('<h3>🔑 Вход администратора</h3><p class="mut" style="margin:10px 0;">Введите пароль для доступа к настройкам.</p><label>Пароль</label><input type="password" id="adminPassInput" placeholder="Введите пароль"><div class="mut small" style="margin-top:8px;">Пароль по умолчанию: <b>1234</b>. После входа можно изменить.</div><div class="row-actions"><button class="btn ghost" data-action="closeModal">Отмена</button><button class="btn primary" data-action="verifyAdminPass">Войти</button></div>');setTimeout(function(){var inp=document.getElementById('adminPassInput');if(inp)inp.focus();},100);return;}modal('<h3>⚙️ Настройки рейтинга</h3><div class="mut small" style="margin-bottom:10px;">🔑 Режим администратора активен</div><label>Стартовый рейтинг</label><input id="setR" type="number" value="'+state.settings.startRating+'" min="100" max="3000"><label>K-фактор (чувствительность рейтинга)</label><input id="setK" type="number" value="'+state.settings.kFactor+'" min="8" max="64"><div class="row-actions"><button class="btn primary" style="flex:1" data-action="saveSettings">Сохранить</button></div><div class="row-actions"><button class="btn ghost" style="flex:1" data-action="changeAdminPass">🔒 Сменить пароль</button><button class="btn ghost" style="flex:1" data-action="exitAdminMode">🚪 Выйти из режима админа</button></div><div class="row-actions"><button class="btn ghost" style="flex:1" data-action="exportData">⤓ Экспорт данных</button><button class="btn ghost" style="flex:1" data-action="importData">⤒ Импорт</button></div><input type="file" id="impFile" accept=".json,application/json" style="display:none" onchange="importFile(this)"><div class="row-actions"><button class="btn ghost" style="flex:1" data-action="demo">Демо-данные</button><button class="btn danger" style="flex:1" data-action="resetAll">Сбросить всё</button></div><div class="mut small" style="margin-top:14px">☁️ Данные синхронизируются через Firebase. Режим: '+(_lsOk?'нормальный':'только в этой сессии')+'</div>');}
function saveSettings(){state.settings.startRating=Math.min(3000,Math.max(100,parseInt($('#setR').value)||1000));state.settings.kFactor=Math.min(64,Math.max(8,parseInt($('#setK').value)||32));save();closeModal();render();toast('Настройки сохранены','ok');}
function exportData(){try{var blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='topspin-backup.json';document.body.appendChild(a);a.click();a.remove();toast('Файл резервной копии создан','ok');}catch(e){toast('Не удалось создать файл','err');}}
function importFile(inp){var f=inp.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var d=JSON.parse(r.result);if(!d.players||!d.tournaments)throw 0;state=Object.assign({settings:Object.assign({},DEF_SET)},d);state.settings=Object.assign({},DEF_SET,d.settings||{});save();closeModal();render();toast('Данные импортированы','ok');}catch(e){toast('Файл не подходит','err');}};r.readAsText(f);}
function resetAll(){confirmBox('Удалить ВСЕ данные? Это удалит данные и из облака!',function(){state={players:[],tournaments:[],matches:[],awards:[],settings:Object.assign({},DEF_SET)};save();ui={tab:'arena',tournamentId:null,playerId:null,ratingSort:'r'};render();toast('Данные очищены');});}
function loadDemo(){confirmBox('Загрузить демонстрационные данные?',function(){var defs=[['Александр','Волков'],['Дмитрий','Соколов'],['Иван','Крылов'],['Мария','Орлова'],['Павел','Лебедев'],['Анна','Смирнова']];var players=defs.map(function(d,i){return{id:'dp'+(i+1),firstName:d[0],lastName:d[1],avatar:null};});var y=new Date(Date.now()-86400000).toISOString().slice(0,10);var t={id:'tdemo',name:'Кубок ТОП-СПИН',date:y,startTime:'16:00',endTime:'20:00',bestOf:'5',playerIds:players.map(function(p){return p.id;}),closed:false};var strength={'dp1':6,'dp2':4,'dp3':2,'dp4':5,'dp5':1,'dp6':3};var TPL=[[[11,7],[11,8],[11,6]],[[11,9],[8,11],[11,7],[11,5]],[[12,10],[11,8],[9,11],[11,9]],[[11,5],[11,9],[11,7]],[[11,8],[11,6],[7,11],[11,9]]];var pairs=roundRobin(players.map(function(p){return p.id;}));var matches=pairs.map(function(pr,i){var winA=strength[pr[0]]>strength[pr[1]];if(i%3===2)winA=!winA;var sets=TPL[i%TPL.length].map(function(s){return[s[0],s[1]];});if(!winA)sets=sets.map(function(s){return[s[1],s[0]];});return{id:'dm'+i,tournamentId:'tdemo',playerAId:pr[0],playerBId:pr[1],time:addMinutes('16:00',i*15),sets:sets};});state={players:players,tournaments:[t],matches:matches,awards:[],settings:Object.assign({},DEF_SET)};var st=standings('tdemo');[['🥇','Чемпион турнира'],['🥈','Серебряный призёр'],['🥉','Бронзовый призёр']].forEach(function(d,i){if(st[i])state.awards.push({id:uid(),tournamentId:'tdemo',playerId:st[i].pid,title:d[1],emoji:d[0],date:y});});state.awards.push({id:uid(),tournamentId:'tdemo',playerId:'dp4',title:'Воля к победе',emoji:'🔥',date:y});save();ui={tab:'arena',tournamentId:null,playerId:null,ratingSort:'r'};render();toast('Демо-данные загружены','ok');});}
function dispatch(el){var act=el.dataset.action;var id=el.dataset.id;var tid=el.dataset.tid;switch(act){case'tab':playSound('click');setTab(el.dataset.tab);break;case'settings':settingsModal();break;case'openAppearance':openAppearanceModal();break;case'setTheme':setTheme(el.dataset.theme);break;case'setFontSize':setFontSize(el.dataset.size);break;case'toggleSound':toggleSound();break;case'verifyAdminPass':verifyAdminPass();break;case'changeAdminPass':changeAdminPass();break;case'saveAdminPass':saveAdminPass();break;case'exitAdminMode':exitAdminMode();break;case'newPlayer':ui.tab='players';ui.playerId=null;render();playerModal();break;case'editPlayer':playerModal(id);break;case'savePlayer':savePlayer(id||null);break;case'delPlayer':delPlayer(id);break;case'clearAvatar':__pendingAvatar=null;var u=document.getElementById('pfUrl');if(u)u.value='';refreshAvatarPreview();break;case'newTournament':tournamentModal();break;case'editTournament':tournamentModal(id);break;case'saveTournament':saveTournament(id||null);break;case'delTournament':delTournament(id);break;case'openTournament':playSound('click');openTournament(id);break;case'closeNow':closeTournamentNow(id);break;case'reopen':reopenTournament(id);break;case'addParticipant':addParticipantModal(tid);break;case'pickParticipant':pickParticipant(tid,id);break;case'addAllParticipants':addAllParticipants(tid);break;case'removeParticipant':removeParticipant(tid,id);break;case'newMatch':matchModal(tid);break;case'editMatch':matchModal(tid,id);break;case'saveMatch':saveMatch(tid,id||null);break;case'delMatch':delMatch(id);break;case'genRR':genRRModal(tid);break;case'runGenRR':runGenRR(tid);break;case'result':resultSheet(id);break;case'addSet':addSetRow();break;case'rmSet':el.closest('.setrow').remove();resultPreview();break;case'saveResult':saveResult();break;case'clearResult':clearResult();break;case'openPlayer':playSound('click');openPlayer(id);break;case'backPlayers':ui.playerId=null;render();break;case'backTournaments':ui.tournamentId=null;render();break;case'sortR':ui.ratingSort='r';render();break;case'sortW':ui.ratingSort='w';render();break;case'newAward':awardModal();break;case'emo':pickEmoji(el,el.dataset.emo);break;case'saveAward':saveAward();break;case'delAward':delAward(id);break;case'awardPodium':awardPodium(id);break;case'saveSettings':saveSettings();break;case'exportData':exportData();break;case'importData':document.getElementById('impFile').click();break;case'demo':loadDemo();break;case'resetAll':resetAll();break;case'closeModal':closeModal();break;case'confirmYes':if(__cb)__cb();__cb=null;closeModal();break;}}
(function init(){try{var d=new Date();$('#todayChip').textContent=d.toLocaleDateString('ru-RU',{weekday:'short'})+', '+d.getDate()+' '+MON[d.getMonth()];}catch(e){}if(lsGet('theme')==='light')document.body.classList.add('light');if(lsGet('fontSize')==='big')document.body.classList.add('big-font');try{var svg=document.querySelector('.logo').outerHTML.replace('class="logo"','xmlns="http://www.w3.org/2000/svg"');var fav=document.createElement('link');fav.rel='icon';fav.href='data:image/svg+xml,'+encodeURIComponent(svg);document.head.appendChild(fav);}catch(e){}if(initFirebase()){loadFromFirebase();setupFirebaseListener();}document.addEventListener('click',function(e){var el=e.target.closest('[data-action]');if(el)dispatch(el);});try{render();}catch(e){var v=$('#view');if(v)v.innerHTML='<div class="empty"><div class="big">⚠</div><b>Ошибка запуска</b><span class="small">'+esc(e.message)+'</span></div>';}})();
</script>
